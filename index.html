  sheetMode = "edit";
  const isNew = !r;
  r = r || { id: "c-" + uid(), title: "", category: "Hlavní jídlo", tags: [], servings: 2, time_min: null, ingredients: [{ q: null, q2: null, u: "", n: "" }], steps: [], note: "" };
  const qtyStr = g => g.q == null ? "" : fmtExact(g.q) + (g.q2 != null ? "-" + fmtExact(g.q2) : "");
  showSheet(`
    <div class="head">
      <div class="row"><span class="cat" style="color:var(--mk)">${isNew ? "Nový recept" : "Úprava receptu"} · MK²</span><button class="iconbtn" id="close" aria-label="Zavřít">×</button></div>
      <h2 id="sTitle">${isNew ? "Nový recept" : esc(r.title)}</h2>
    </div>
    <form class="body form" id="editForm" autocomplete="off">
      <label class="f">Název<input id="eTitle" required value="${esc(r.title)}"></label>
      <div class="two">
        <label class="f">Počet porcí<input id="eServ" type="number" min="1" max="99" inputmode="numeric" value="${esc(r.servings ?? "")}" placeholder="např. 2"></label>
        <label class="f">Čas (min)<input id="eTime" type="number" min="1" max="999" inputmode="numeric" value="${esc(r.time_min ?? "")}"></label>
      </div>
      <label class="f">Kategorie<select id="eCat">${CAT_ORDER.map(c => `<option ${c === r.category ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
      <section><h4>Suroviny</h4>
        <div class="ingrows">
          <div class="inghead"><span>Množ.</span><span>Jednotka</span><span>Surovina</span><span></span></div>
          <div id="ingRows"></div>
        </div>
        <button type="button" class="btn small" id="addIng" style="margin-top:8px">+ Přidat surovinu</button>
      </section>
      <label class="f">Postup (každý krok na nový řádek)<textarea id="eSteps" rows="7">${esc((r.steps || []).join("\n"))}</textarea></label>
      <label class="f">Poznámka<textarea id="eNote" rows="2" style="min-height:60px">${esc(r.note || "")}</textarea></label>
      <label class="f">Štítky (oddělené čárkou)<input id="eTags" value="${esc((r.tags || []).join(", "))}"></label>
      <div class="formbar"><button class="btn mk" type="submit" style="background:var(--mk);color:var(--surface)">Uložit</button><button class="btn" type="button" id="cancelEdit">Zrušit</button></div>
    </form>`);
  const rows = $("ingRows");
  const addRow = g => {
    const d = document.createElement("div"); d.className = "ingrow";
    d.innerHTML = `<input class="iq" inputmode="decimal" placeholder="–" value="${esc(qtyStr(g))}" aria-label="Množství"><input class="iu" placeholder="–" value="${esc(g.u || "")}" aria-label="Jednotka"><input class="in" placeholder="surovina" value="${esc(g.n || "")}" aria-label="Surovina"><button type="button" class="rm" aria-label="Smazat surovinu">×</button>`;
    d.querySelector(".rm").onclick = () => d.remove();
    rows.appendChild(d); return d;
  };
  (r.ingredients.length ? r.ingredients : [{ q: null, u: "", n: "" }]).forEach(addRow);
  $("addIng").onclick = () => addRow({ q: null, u: "", n: "" }).querySelector(".iq").focus();
  $("close").onclick = closeSheet;
  $("cancelEdit").onclick = () => isNew ? closeSheet() : openRecipe("mk2", r.id);
  $("editForm").onsubmit = e => {
    e.preventDefault();
    const title = $("eTitle").value.trim(); if (!title) { $("eTitle").focus(); return; }
    const ingredients = [...rows.querySelectorAll(".ingrow")].map(d => {
      const { q, q2 } = parseQty(d.querySelector(".iq").value);
      return { q, q2, u: d.querySelector(".iu").value.trim(), n: d.querySelector(".in").value.trim() };
    }).filter(g => g.n || g.q != null);
    const now = Date.now();
    const rec = {
      ...(isNew ? { createdAt: now } : mk2.recipes[r.id] || {}),
      id: r.id, title, category: $("eCat").value,
      servings: parseInt($("eServ").value) || null, time_min: parseInt($("eTime").value) || null,
      ingredients, steps: $("eSteps").value.split("\n").map(s => s.trim()).filter(Boolean),
      note: $("eNote").value.trim(), tags: $("eTags").value.split(",").map(s => s.trim().toLowerCase()).filter(Boolean),
      updatedAt: now, deleted: false
    };
    if (isNew) { rec.src = null; rec.author = ""; }
    mutateMk(d => { d.recipes[rec.id] = rec; });
    openRecipe("mk2", rec.id);
  };
  $("eTitle").focus();
}
function fmtExact(x) { return (+x.toFixed(3)).toString().replace(".", ","); }

/* ---------- sync settings sheet ---------- */
function openSync() {
  sheetMode = "sync";
  const s = SYNC_LABEL[sync.state] || ["", ""];
  const connected = !!ghToken;
  showSheet(`
    <div class="head">
      <div class="row"><span class="cat">MK² kuchařka</span><button class="iconbtn" id="close" aria-label="Zavřít">×</button></div>
      <h2 id="sTitle">Synchronizace</h2>
    </div>
    <div class="body">
      ${!SYNC_OK ? `<div class="note">Společná MK² kuchařka se synchronizuje jen v appce na <a href="${SITE}" target="_blank" rel="noopener">mkfko.github.io/papu-kucharka</a>. Tady se recepty ukládají jen v tomhle prohlížeči.</div>` : `
      <div class="status ${s[1] === "ok" ? "ok" : s[1] ? "err" : ""}">${esc(s[0])}${sync.msg ? " · " + esc(sync.msg) : ""}</div>
      <p style="margin:0">MK² recepty se ukládají do souboru <code>mk2.json</code> v GitHub repozitáři <b>papu-kucharka</b>. Když je appka připojená, vidíte s přítelkyní obě totéž.</p>
      ${connected ? `
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn mk" id="syncNow">Synchronizovat teď</button><button class="btn danger" id="disconnect">Odpojit tento telefon</button></div>
        <div id="discZone"></div>` : `
        <section class="help"><h4>Připojení (jednou na každém telefonu)</h4>
          <ol>
            <li>Na GitHubu otevři <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Fine-grained tokens → Generate new token</a>.</li>
            <li>Název třeba <code>papu</code>, platnost podle sebe (třeba 1 rok).</li>
            <li><b>Repository access</b>: Only select repositories → <code>papu-kucharka</code>.</li>
            <li><b>Permissions → Repository → Contents</b>: Read and write.</li>
            <li>Vytvoř token, zkopíruj ho a vlož sem. Ukládá se jen v tomhle telefonu.</li>
          </ol>
        </section>
        <form class="form" id="tokForm" autocomplete="off">
          <label class="f">GitHub token<input id="tok" type="password" placeholder="github_pat_…" spellcheck="false" autocapitalize="off"></label>
          <div style="display:flex;gap:8px"><button class="btn mk" type="submit">Připojit</button></div>
          <div id="tokMsg"></div>
        </form>`}
      `}
    </div>`);
  $("close").onclick = closeSheet;
  const sn = $("syncNow"); if (sn) sn.onclick = () => runSync();
  const dc = $("disconnect"); if (dc) dc.onclick = () => {
    $("discZone").innerHTML = `<div class="confirm"><span>Odpojit? Recepty zůstanou na GitHubu.</span><button class="btn danger small" id="dcYes">Odpojit</button><button class="btn small" id="dcNo">Nechat</button></div>`;
    $("dcNo").onclick = () => { $("discZone").innerHTML = ""; };
    $("dcYes").onclick = () => { ghToken = ""; store.del("papu-gh-token"); setSync("readonly"); openSync(); };
  };
  const tf = $("tokForm"); if (tf) tf.onsubmit = async e => {
    e.preventDefault();
    const t = $("tok").value.trim(); if (!t) return;
    $("tokMsg").innerHTML = `<div class="status">Ověřuji…</div>`;
    try {
      const r = await fetch(`https://api.github.com/repos/${GH.repo}`, { headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + t }, cache: "no-store" });
      if (!r.ok) throw new Error(r.status === 401 ? "Token je neplatný." : "GitHub vrátil chybu " + r.status + ".");
      const j = await r.json();
      if (j.permissions && j.permissions.push === false) throw new Error("Token nemá právo zapisovat. Zkontroluj Contents: Read and write.");
      ghToken = t; store.set("papu-gh-token", t);
      setSync("idle"); openSync(); runSync();
    } catch (err) { $("tokMsg").innerHTML = `<div class="status err">${esc(err.message || err)}</div>`; }
  };
}

/* ---------- events ---------- */
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("clear").onclick = () => { state.q = ""; $("q").value = ""; render(); $("q").focus(); };
$("cats").onclick = e => { const b = e.target.closest("[data-cat]"); if (!b) return; state.cat = b.dataset.cat || null; state.tags.clear(); render(); };
$("tags").onclick = e => { const b = e.target.closest("[data-tag]"); if (!b) return; const t = b.dataset.tag; state.tags.has(t) ? state.tags.delete(t) : state.tags.add(t); render(); };
$("onlyRecipe").onchange = e => { state.onlyRecipe = e.target.checked; render(); };
$("sort").onchange = e => { state.sort = e.target.value; render(); };
$("grid").onclick = e => { const c = e.target.closest(".card"); if (c) openRecipe(c.dataset.kind, c.dataset.id); };
$("viewbar").onclick = e => { if (e.target.closest("#newRecipe")) openEditor(null); else if (e.target.closest("#vbSync")) openSync(); };
$("menuBtn").onclick = openDrawer;
$("drawer").onclick = e => { const b = e.target.closest("[data-view]"); if (b) setView(b.dataset.view); };
$("openSync").onclick = () => { closeDrawer(); openSync(); };
$("scrim").onclick = () => { if (!$("drawer").hidden) closeDrawer(); else closeSheet(); };
$("random").onclick = () => { const l = filtered(); if (l.length) { const r = l[Math.floor(Math.random() * l.length)].r; openRecipe(r.kind, r.kind === "mk2" ? r.id : r.i); } };
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (!$("drawer").hidden) closeDrawer(); else if (!$("sheet").hidden) closeSheet(); }
  else if (e.key === "/" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) { e.preventDefault(); $("q").focus(); }
});
function fromHash() {
  let m = location.hash.match(/^#r-(\d+)$/); if (m) return openRecipe("papu", m[1]);
  m = location.hash.match(/^#m-([\w-]+)$/); if (m && MK.find(x => x.id === m[1])) openRecipe("mk2", m[1]);
}
window.addEventListener("hashchange", fromHash);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && SYNC_OK) runSync(); });
window.addEventListener("online", () => { if (SYNC_OK && dirty) runSync(); });
render(); renderSyncBits(); fromHash();
if (SYNC_OK) runSync();
</script>

<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
