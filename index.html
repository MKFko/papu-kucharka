e každej za úkol udělat něco z tohohle Lucca 4.0 od Fabini nerez pekáče na kterej je s mým kódem RUNDUS až 40% sleva. A já nominuju @simonkan_ \n\nRecept:  Kvásek 240ml vlažného mléka\n1 lžička cukru 7g droždí (2 a čtvrt lžičky)\n Po 5 minutách do kvásku přidej\n360g hladké mouky\n42g rozpuštěného máslo\n1,5 lžičky soli 1/2 lžičky sušený česnek (nemusíte)\n1/4 lžičky sušená cibule (nemusíte)\n1/2 lžičky sušená oregáno (nemusíte)\n1/2 lžičky bazalka (nemusíte)\n\nMáslo\n8 stroužků česneku\n220g másla\n1 lžička soli \nČerstvé bylinky (já použil raketu bazalky, trochu tymiánu, rozmarýnu a orgánu)\nNasekaná zelená část jarní cibulky  Sýr Použil jsem 250g mozarelly a 250 cheddaru\n\nPostup:\nPříprava kvásku: Do velké mísy nalejte teplé mléko, přidejte cukr a droždí. Nechte přibližně 5 minut odstát, dokud droždí nevzejde. \nVypracování těsta: Do mísy přidejte rozpouštěné máslo, mouku a koření. Vše dobře promíchejte a hněťte, dokud nezískáte hladké a pružné těsto. \nPrvní kynutí: Mísu přikryjte a nechte těsto odpočívat v teplém prostředí přibližně 30 - 90 minut \nTvarování: Vykynuté těsto rozválejte na plát a potřete ho připravenou česnekovo-máslovou směsí. Posypte strouhaným sýrem a pevně srolujte do rolády. Nakrájejte na stejné dílky. \nDruhé kynutí: Připravte si pekáč. Dno můžete posypat trochou strouhaného sýra pro vytvoření sýrové krusty. Do pekáče naskládejte šneky, přikryjte a nechte kynout v teple minimálně 1 hodinu (nebo dokud nezdvojnásobí svůj objem).\n\nPečení: Pečte v předehřáté troubě na 180 °C po dobu 28–33 minut dozlatova. \nDokončení: Ihned po vytažení z trouby potřete teplé šneky odloženou máslovou pomazánkou a podle chuti posypte hrubozrnnou/vločkovou solí, parmezánem a nasekanou čerstvou petrželkou.\n\n#spolupráce #recept #pečení #vaření #adamrundus", "title": "Sýrové kynuté šneky", "title_orig": "Sýrový kynutý šneci", "category": "Pečivo", "tags": ["pečivo", "kynuté těsto", "sýr", "mozzarella", "cheddar", "česnek", "do trouby"], "ingredients": ["Kvásek nIngredients:\n• 255g dried wide rice noodles\n• 4 boneless, skinless chicken thighs\n• 2 whole eggs + 150g egg whites\n• 175g Chinese broccoli\n• 3 tbsp oyster sauce\n• 2 tbsp soy sauce\n• 1 tbsp dark soy sauce\n• 3 tsp Splenda Brown Sugar Blend\n• 1 tbsp cornstarch\n• Garlic, S&P + cooking spray\n\nHow to make it:\n\n1. Cook noodles until slightly firm.\n2. Slice chicken and marinate with 1 tbsp oyster sauce, 1 tbsp soy sauce, cornstarch, S&P and cooking spray.\n3. Mix remaining soy sauce, dark soy, oyster sauce and brown sugar blend for the sauce.\n4. Cook chicken until browned, then remove.\n5. Stir-fry garlic and Chinese broccoli, starting with the stems.\n6. Add eggs + egg whites and scramble until just set.\n7. Add noodles and sauce. Toss over high heat until coated and slightly caramelized.\n8. Add everything back in, toss together and enjoy. 🇹🇭🔥\n\nTOTAL MACROS (per 1 serving — ⅓ of recipe):\n~665 calories | ~95g carbs | ~13g fat | ~42g protein\n\nAll the flavour of Pad See Ew with 40+ grams of protein per serving — proof that getting in shape doesn’t mean giving up the foods you grew up loving.\n\nSave this one for your next noodle craving. 🍜🔥\n\n#noodles #padseeew #highprotein #mealprep #asianfood", "title": "Pad see ew (high-protein verze)", "title_orig": "PAD SEE EW", "category": "Hlavní jídlo", "tags": ["kuřecí", "nudle", "rýžové nudle", "thajské", "asijské", "high-protein", "vejce", "meal prep"], "ingredients": ["255 g sušených širokých rýžových nudlí", "4 kuřecí stehna bez kosti a kůže", "2 celá vejce + 150 g vaječných bílků", "175 g čínské brokolice", "3 lžíce ústřicové omáčky", "2 lžíce sójové omáčky", "1 lžíce tmavé sójové omáčky", "3 lžičky hnědého sladidla (Splenda Brown Sugar Blend)", "1 lžíce kukuřičného škrobu", "česnek, sůl, pepř, olej ve spreji"], "steps": ["Uvařit nudle dopevna.", "Kuře nakrájet a marinovat s 1 lžící ústřicové a 1 lžící sójové omáčky, škrobem, solí, pepřem a olejem.", "Zbylé omáčky a sladidlo smíchat na sos.", "Kuře opéct KUCHYNI trúfli na recept, na ktorý sa odváži máloktoooo (málokto na kameru samozrejme🎥)- POCTIVÝ SLEPAČÍ VÝVAR ktorý všetci zbožnujeme!!!🍲 A paradox? Hovorí sa, že vývar sa varí sám. Áno😭. Len my sme pri ňom dnes museli stáť 6 hodín, aby sme vám za 90 sekúnd ukázali, AKO sa varí sám. 😂\n\nIšli sme pekne krok po kroku - čo kedy pridať, prečo niektorá zelenina potrebuje viac času, kedy dochucovať a hlavne ako z toho celého dostať krásny, silný domáci vývar.\n\nAle!☝🏻Vývar je presne ten recept, pri ktorom má každá rodina svoje pravidlá. Niekto dáva viac mrkvy a miluje ho sladší, niekto dáva zeleninu postupne, niekto ju šupne dnu naraz. A priznám sa, ja veľakrát večer zalejem mäso, neskôr pridám zeleninu a ráno nás čaká hotový vývar.✌🏻\n\nTakže dnes nechceme vyhlásiť jediný \"správny\" spôsob. Chceme hlavne ukázať našim TEENAGEROM, že ani poctivý slepačí vývar nemusí byť žiadna veda.\n\nPOTREBUJEME:\n\n1-1,5kg kuracieho mäsa s kosťou\ncca 3-3,5l studenej vody!\ncibuľa, zeler, kaleráb, pór, mrkva, petržlen \npár gulôčok celého čierneho korenia\nsoľ\npetržlenová vňať\nrezance do polievky\n⚠️A POZOR! - VÝVAR SA NEVARÍ, VÝVAR SA ŤAHÁ! \nTo znamená, že ho nechávame niekoľko hodín na veľmi miernom ohni - nemá prudko vrieť, iba sa jemnučko pohybovať a sem-tam pustiť malú bublinku. Práve to pomalé ťahanie mu dá krásnu chuť a udržiava ho číry🤩\n\nA teraz SEM S VAŠIMI VYCHYTÁVKAMI!👇🏻\nAko robíte slepačí vývar vy? Čo je tá jedna vec, bez ktorej podľa vás dobrý vývar jednoducho nie je?🍲❤️\n\nĎakujeme za každý LIKE, KOMENTÁR a ZDIEĽANIE!\n\n#teenager #teenagervkuchyni #slepacivyvar #naucmeteenagerovvarit #funinthekitchen", "title": "Poctivý slepičí vývar", "title_orig": "POCTIVÝ SLEPAČÍ VÝVAR", "category": "Polévka", "tags": ["polévka", "vývar", "kuřecí", "slovenské", "tradiční", "zelenina"], "ingredients": ["1–1,5 kg kuřecího masa s kostí", "cca 3–3,5 l studené vody", "cibule, celer, kedlubna, pórek, mrkev, petržel", "pár kuliček celého černého pepře", "sůl", "petrželová nať", "nudle do polévky"], "steps": ["Maso zalít studenou vodou, přidat zeleninu a koření.", "Vývar se nevaří, ale 'táhne': několik hodin na velmi mírném ohni, jen lehce bublat.", "Dochutit solí, podávat s nudlemi a petrželkou."], "recipe": "full", "note": "Doba tažení několik hodin (autorky cca 6 h); lze i přes noc", "time_min": null, "unsure": false, "servings": null}, {"i": 27, "url": "https://www.instagram.com/reel/DcjS1HeIeFy/", "author": "_klaraberisha", "caption": "Ingredience\nNa taštičky\n 400 g mletého kuřecího masa (pro rostlinnou variantu použijte extra tvrdé tofu rozmixované v kuchyňském robotu)\n 15 g pažitky, nakrájené najemno\n 3 stroužky česneku, nastrouhané najemno\n 2,5 cm (1 palec) zázvoru, nastrouhaného najemno\n 2 lžíce světlé sójové omáčky\n 1 lžíce rýžového octa\n 1 lžíce sezamového oleje\n 1 lžička cukru\n ¼ lžičky mletého černého pepře\n 16 plátků těsta na taštičky (dumpling wrappers)\n ½ lžíce sezamových semínek\n\nNa omáčku k namáčení\n 1 stroužek česneku, nastrouhaný najemno\n 1,2 cm (½ palce) zázvoru, nastrouhaného najemno\n 2 lžíce světlé sójové omáčky\n 1 lžíce rýžového octa\n ½ lžíce sezamového oleje\n ¼ lžičky MSG (glutamátu sodného)\n 1 lžíce chilli oleje\n\nInstrukce\n1. Ve velké míse smíchejte mleté kuřecí maso, nasekanou pažitku, nastrouhaný česnek, nastrouhaný zázvor, světlou sójovou omáčku, rýžový ocet, sezamový olej, cukr a mletý černý pepř. Míchejte, dokud nevznikne spojená směs.\n2. Na mírný až střední plamen dejte velkou nepřilnavou pánev (s pokličkou). Pomocí naběračky na zmrzlinu (nebo tvarováním malých kuliček v dlaních) dávkujte na pánev kuličky náplně o velikosti cca 1 lžíce. Mezi jednotlivými kuličkami nechte mezeru zhruba 2,5 až 5 cm. V závislosti na velikosti pánve možná budete muset použít dvě pánve nebo dělat taštičky na dvě dávky.\n3. Na každou kuličku náplně položte těsto na taštičky (dumpling wrapper) jako přikrývku a po stranách ho zastrčte. Opakujte pro všechny kuličky. Přijijte 3 lžíce vody, posypte sezamovými semínky, přiklopte pokličkou a nechte vařit v páře 6–8 minut.\n4. Mezitím si připravte zálivku z chilli oleje. V misce smíchejte nastrouhaný česnek, nastrouhaný zázvor, světlou sójovou omáčku, rýžový ocet, sezamový olej, MSG (glutamát sodný) a chilli olej. Promíchejte.\n5. Taštičky jsou hotové, jakmile je náplň provařená, těsto je měkké a voda se odpařila. Posypte jemně nasekanou pažitkou a přelijte zálivkou z chilli oleje. Dobrou chuť!", "title": "Taštičky s kuřecím masem a chilli dipem", "title_orig": "", "category": "Snack / předkrm", "tags": ["kuřecí", "mleté maso", "knedlíčky", "taštičky", "asijské", "dip", "tofu"], "ingredients": ["400 g mletého kuřecího masa (nebo extra tvrdé tofu rozmixované)", "15 g pažitky, jemně nakrájené", "3 stroužky česneku, nastrouhané", "2,5 cm zázvoru, nastrouhaného", "2 lžíce světlé sójové omáčky", "1 lžíce rýžového octa", "1 lžíce sezamového oleje", "1 lžička cukru", "1/4 lžičky mletého černého pepře", "16 plátků těsta na taštičky", "1/2 lžíce sezamových semínek", "Dip: 1 stroužek česneku", "1,2 cm zázvoru", "2 lžíce světlé sójové omáčky", "1 lžíce rýžového octa", "1/2 lžíce sezamového oleje", "1/4 lžičky MSG", "1 lžíce chilli oleje"], "steps": ["Smíchat maso s pažitkou, česnekem, zázvorem, sójovkou, octem, olejem, cukrem a pepřem.", "Na velkou nepřilnavou pánev s pokličkou dávkovat kuličky náplně (cca 1 lžíce) s mezerami 2,5–5 cm.", "Na každou kuličku položit plát těsta a zastrčit okraje.", "Přidat 3 lžíce vody, posypat sezamem, přikrýt a vařit v páře 6–8 minut.", "Smíchat ingredience dipu.", "Hotové taštičky posypat pažitkou a přelít dipem."], "recipe": "full", "note": "Název v captionu chybí, jde o dumplings", "time_min": null, "unsure": true, "servings": null}, {"i": 28, "url": "https://www.instagram.com/reel/DcohiE3OzMH/", "author": "katerinablahovatyrpeklova", "caption": "🫑Kuře na paprice trochu jinak ❤️\n\n🛒 Ingredience na 2-3 porce \n\n* 2 kuřecí prsa\n* 1 cibule\n* 3 červené papriky\n* 500 ml vývaru\n* ¾ kelímku 31% smetany ke erze:\nPřidal jsem ČERSTVÝ jalapeňo\nPár kuliček pepře\n\nNechte v lednici minimalně 3 dny a můžete se do toho pustit.\n\n#spolupráce #recept #česnek #vietnamskakuchyne", "title": "Nakládaný česnek po vietnamsku", "title_orig": "Nakladaný česnek jako z vietnamský restaurace", "category": "Snack / předkrm", "tags": ["česnek", "nakládané", "vietnamské", "asijské", "jalapeño"], "ingredients": ["250 ml rýžového octa", "100 ml vody", "1,5 lžíce cukru (třtinový obarví do hněda)", "1 lžička soli", "1 lžíce rybí omáčky (lze vynechat)", "česnek", "čerstvé jalapeño", "pár kuliček pepře"], "steps": ["Připravit nálev z octa, vody, cukru, soli a rybí omáčky.", "Česnek s jalapeñem a pepřem zalít nálevem.", "Nechat v lednici min. 3 dny."], "recipe": "full", "note": "Spolupráce; množství česneku neuvedeno", "time_min": null, "unsure": false, "servings": null}, {"i": 30, "url": "https://www.instagram.com/reel/DbTWdx_tar4/", "author": "veronikavojackovaa", "caption": "Jednoduché lasagne z jedné pánve 🍝\n\nKdyž máš chuť na domácí lasagne, ale nechce se ti trávit hodinu vrstvením a pečením, vyzkoušej tuhle rychlou verzi z jedné pánve. ❤️ Je plná šťavnatého hovězího masa, rajčatové omáčky, lasagnových plátů a rozpečeného sýra. Rychlá večeře, kterou si zamiluje celá rodina.\n\n📝 Ingredience:\n• 500 g mletého hovězího masa\n• 1 větší cibule\n• 3 stroužky česneku\n• 1 lžíce oleje\n• 700 ml rajčatové passaty nebo drcených rajčat\n• 2 lžíce rajčatového protlaku\n• 300 ml hovězího vývaru nebo vody\n• 200 g lasagnových plátů, nalámaných na menší kousky\n• Čerstvé bylinky (bazalka a pažitka)\n• Sůl a pepř podle chuti\n• 150–200 g strouhaného eidamu\n\n👩🏼‍🍳 Postup:\n\n1. Na oleji orestuj cibuli, přidej česnek a následně mleté maso. Opékej dozlatova.\n2. Vmíchej rajčatový protlak, přilij passatu a vývar. Osol, opepři a přidej nasekané bylinky.\n3. Přidej nalámané lasagnové pláty, promíchej a vař pod pokličkou 15–18 minut. Občas promíchej a podle potřeby přilij trochu vody.\n4. Nakonec posyp strouhaným eidamem, přiklop na 2–3 minuty a nech sýr rozpustit.\n\n💡 Tip: Já tentokrát použila eidam, ale pokud chceš ještě výraznější chuť, zkus kombinaci mozzarelly a parmazánu.\n\nUlož si recept na den, kdy nebudeš vědět, co uvařit. 🤍\n\n#rychlavecere #lasagnerecipe #onepanmeal #easyfamilydinner #weeknightdinner", "title": "Lasagne z jedné pánve", "title_orig": "Jednoduché lasagne z jedné pánve", "category": "Hlavní jídlo", "tags": ["hovězí", "mleté maso", "těstoviny", "lasagne", "italské", "jedna pánev", "rychlovka", "sýr"], "ingredients": ["500 g mletého hovězího masa", "1 větší cibule", "3 stroužky česneku", "1 lžíce oleje", "700 ml rajčatové passaty nebo drcených rajčat", "2 lžíce rajčatového protlaku", "300 ml hovězího vývaru nebo vody", "200 g lasagnových plátů, nalámaných", "čerstvé bylinky (bazalka, pažitka)", "sůl a pepř", "150–200 g strouhaného eidamu"], "steps": ["Na oleji orestovat cibuli, přidat česnek a mleté maso, opékat dozlatova.", "Vmíchat protlak, přilít passatu a vývar, osolit, opepřit, přidat bylinky.", "Přidat nalámané pláty a vařit pod pokličkou 15–18 minut, občas promíchat.", "Posypat sýrem, přiklopit na 2–3 minuty do rozpuštění."], "recipe": "full", "note": "Tip: místo eidamu mozzarella s parmazánem", "time_min": null, "unsure": false, "servings": null}, {"i": 31, "url": "https://www.instagram.com/reel/DaMG8oEv7xM/", "author": "salt.sheikh", "caption": "Follow if you want more easy recipes like these! \nCOMMENT “YES” FOR RECIPE \n\n10 Minute Chilli Garlic Noodles! 🔥 🍜", "title": "Chilli česnekové nudle", "title_orig": "10 Minute Chilli Garlic Noodles", "category": "Hlavní jídlo", "tags": ["nudle", "česnek", "chilli", "asijské", "rychlovka", "vegetariánské"], "ingredients": [], "steps": [], "recipe": "none", "note": "Recept posílá autor po komentáři", "time_min": 10, "unsure": false, "servings": null}, {"i": 32, "url": "https://www.instagram.com/reel/Daa72MBozdf/", "author": "zapisky_zkuchyne", "caption": "A brusinky byly zrovna domácí od babičky! 🥲🥲🫠\n\nTohle je přesný recept, který zveřejnila IKEA, tentokrát jsem nedělala žádné úpravy. Třeba si ho vyzkoušíte taky.😇\n\nSuroviny na masové kuličky:\n500 g mletého hovězího masa\n250 g mletého vepřového masa\n1 menší cibule, najemno nakrájená\n1 stroužek česneku, prolisovaný\n100 g strouhanky\n1 vejce\n5 lžic mléka\nSůl a čerstvě mletý černý pepř podle chuti\n\nPostup:\nSmícháme hovězí a vepřové maso.\nPřidáme cibuli, česnek, strouhanku, vejce, mléko, sůl a pepř. Dobře promícháme.\nZe směsi vytvarujeme malé kuličky.\nPřikryjeme fólií a dáme na 2 hodiny do lednice, aby zpevnily.\nNa pánvi rozehřejeme trochu oleje a na středním plameni kuličky opečeme ze všech stran dozlatova.\nPřendáme je do zapékací misky, zakryjme alobalem a pečte v troubě předehřáté na 180 °C (nebo 160 °C s horkovzduchem) asi 30 minut.\n\nSuroviny na omáčku:\nTrocha oleje na smažení\n20 g másla\n20 g hladké mouky\n80 ml zeleninového vývaru\n80 ml hovězího vývaru\n80 ml smetany ke šlehání (33 %)\n1 lžičky sójové omáčky\n1/2 lžička dijonské hořčice\n\nPostup:\nNa pánvi rozpustíme máslo.\nPřisypeme mouku a za stálého míchání připravíme jíšku.\nPostupně přiléváme zeleninový i hovězí vývar a pořádně rozmícháme.\nPřidáme smetanu, sójovou omáčku a dijonskou hořčici.\nPřivedeme k mírnému varu a vaříme, dokud omáčka nezhoustne.", "title": "Švédské masové kuličky s omáčkou (IKEA)", "title_orig": "masové kuličky", "category": "Hlavní jídlo", "tags": ["hovězí", "vepřové", "mleté maso", "masové kuličky", "švédské", "do trouby", "smetana"], "ingredients": ["Kuličky: 500 g mletého hovězího", "250 g mletého vepřového", "1 menší cibule, najemno", "1 stroužek česneku", "100 g strouhanky", "1 vejce", "5 lžic mléka", "sůl, pepř", "Omáčka: olej", "20 g másla", "20 g hladké mouky", "80 ml zeleninového vývaru", "80 ml hovězího vývaru", "80 ml smetany ke šlehání 33 %", "1 lžička sójové omáčky", "1/2 lžičky dijonské hořčice"], "steps": ["Smíchat maso s cibulí, česnekem, strouhankou, vejcem, mlékem, solí a pepřem; vytvarovat malé kuličky.", "Přikryté dát na 2 hodiny do lednice.", "Opéct na oleji ze všech stran dozlatova.", "Přendat do zapékací misky, přikrýt alobalem a péct 30 minut na 180 °C (160 °C horkovzduch).", "Omáčka: rozpustit máslo, vmíchat mouku na jíšku, postupně přilít vývary.", "Přidat smetanu, sójovku a hořčici a vařit do zhoustnutí."], "recipe": "full", "note": "Recept dle IKEA; podávat s brusinkami", "time_min": null, "unsure": false, "servings": null}, {"i": 33, "url": "https://www.instagram.com/reel/DbA4TXTM8oB/", "author": "zezivotakuchare", "caption": "Thajská pecka 😍 Pad Kra Pao 🇹🇭 #recipe #recept #thailand #miluju #chalky", "title": "Pad kra pao", "title_orig": "Pad Kra Pao", "category": "Hlavní jídlo", "tags": ["thajské", "asijské", "mleté maso", "rýže", "pálivé"], "ingredients": [], "steps": [], "recipe": "none", "note": "Recept jen ve videu", "time_min": null, "unsure": false, "servings": null}, {"i": 34, "url": "https://www.instagram.com/reel/DX4euxNRA4Q/", "author": "viktorie_hrazdilkova", "caption": "Zkoušel/a jsi už někdy gyoza knedlíčky?\n\nGYOZA KNEDLÍČKY 👩‍🍳👨‍🍳\n\n🥟 240g hladké mouky\n🥟 špetka soli\n🥟 120ml horké vody\n🥟 1 PL oleje\n\nNáplň: 300g mletého kuřecího, hrst jarní cibulky, 1 menší červená cibule, 2 PL sójovky, 1 PL worcestru, 2 stroužky česneku, 5cm čerstvého zázvoru, 1/2 ČL sušeného česneku, chilli dle chuti, sůl a pepř\n\nPostup: Začni těstem na knedlíčky - smíchej mouku, sůl a horkou vodu a zrpacuj těsto, které dáš do fólie nebo sáčku a necháš 10 min odležet při pokojové teplotě. Mezitím si připrav náplň - mleté maso ochuť solí, pepřem, sójovkou, worcesterovou omáčkou, česnekem sušeným a i čerstvě utřeným, nastrouhaným čerstvým zázvorem a případně přidej i chilli. Zamíchej, přidej nadrobno nasekanou jarní i červenou cibuli a znova zamíchej. Nyní vem těsto, to rozválej opravdu natenko a vykrajuj kolečka dle videa (20). Do každého kolečka dej lžičku náplně a zabal dle videa. Na kvalitní nepřilnavou pánev dej lžíci oleje, přidej knedlíčky a 3 min opékej (pouze z jedné strany) spíše na středním plamenu. Poté přidej trochu vody (cca 100ml), přiklop pánev poklicí a nechej vařit 5 min. Hotové knedlíčky dozdob & vychutnávej 😋.\n\nPokud sháníš kvalitní nepřilnavou a netoxickou pánev, doporučuji značku @elmichcz a jejich totální špičku ⚠️👉 nepřilnavou nerezovou pánev Tria Ceramic s keramickým povrchem, kdy díky mé spolupráci můžeš využít nyní slevový kód: 𝗙𝗜𝗧𝗩𝗜𝗞𝗜𝟭𝟬 a kvalitní pánev, která ti vydrží roky, nakoupit výhodněji ✌️❤️.\n\nNutriční hodnoty 1 knedlíčku (1/20):\nB: 4,7g\nS: 9,4g\nT: 2,2g\n76 kcal\n\n#gyoza #rychlerecepty #zdraverecepty #hubnuti #recept", "title": "Gyoza knedlíčky", "title_orig": "GYOZA KNEDLÍČKY", "category": "Snack / předkrm", "tags": ["kuřecí", "mleté maso", "knedlíčky", "gyoza", "asijské", "zdravé"], "ingredients": ["Těsto: 240 g hladké mouky", "špetka soli", "120 ml horké vody", "1 lžíce oleje", "Náplň: 300 g mletého kuřecího", "hrst jarní cibulky", "1 menší červená cibule", "2 lžíce sójové omáčky", "1 lžíce worcesteru", "2 stroužky česneku", "5 cm čerstvého zázvoru", "1/2 lžičky sušeného česneku", "chilli dle chuti", "sůl a pepř"], "steps": ["Smíchat mouku, sůl a horkou vodu, vypracovat těsto a nechat 10 min odležet ve fólii.", "Maso ochutit solí, pepřem, sójovkou, worcesterem, česnekem, zázvorem a chilli, vmíchat cibuli.", "Těsto rozválet natenko, vykrájet kolečka, naplnit lžičkou náplně a zabalit.", "Na pánvi s olejem opékat 3 minuty z jedné strany.", "Přilít cca 100 ml vody, přiklopit a vařit 5 minut."], "recipe": "full", "note": "Spolupráce; 1 knedlíček (1/20): 76 kcal, B 4,7 g, S 9,4 g, T 2,2 g", "time_min": null, "unsure": false, "servings": null}, {"i": 35, "url": "https://www.instagram.com/reel/DaDtlM1iZh8/", "author": "2foodfitlovers", "caption": "Anelli CROCCANTI di zucchine 🥒 NON FRITTI ❌ \n\nDecisamente più light dei classici anelli di cipolla fritti🧅, \nOvviamente vengono bene pure con le cipolle, a patto che stiano per guardare un film🫱🏻‍🫲🏼\n\nRICETTA:\n-3 zucchine \n-300g farina + 300 acqua \n-100 g cornflakes \n- olio, sale, pepe e spezie a piacere qb \n\nSalsina con:\n-avanzi di zucchina cotti\n-100g yogurt greco 0%\n-olio, sale, pepe, menta, succo di limone 🍋\n\nLava le zucchine e tagliale a rondelle, cercando di mantenerle né troppo spesse né troppo sottili. Con dei piccoli coppa pasta (oppure con un coltello), ricava dei cerchi ritagliando lungo i bordi di ogni fetta.\n\nI dischetti centrali non si buttano: cuocili in padella con un filo d’olio e un pizzico di sale finché diventano morbidi.\n\nNel frattempo prepara la pastella mescolando farina, acqua e sale, fino a ottenere un composto liscio e senza grumi. In una ciotola a parte, sbriciola i cornflakes con le mani oppure aiutandoti con un bicchiere.\n\nPassa i cerchi di zucchine prima nella pastella e poi nei cornflakes, facendoli aderire bene su entrambi i lati.\n\nCuoci in friggitrice ad aria per 10-15 minuti a 180-200°C, fino a doratura. I tempi possono variare in base al modello della friggitrice. In alternativa, puoi cuocerli anche in forno con le stesse temperature.\n\nDurante la cottura prepara la salsina: frulla (o schiaccia) le zucchine cotte con yogurt greco, sale, pepe e le spezie che preferisci.\n\n#zucchine #nonfritto #ricetta #croccante #cenafacile", "title": "Křupavé cuketové kroužky (z fritézy)", "title_orig": "Anelli croccanti di zucchine", "category": "Snack / předkrm", "tags": ["cuketa", "airfryer", "zdravé", "italské", "vegetariánské", "křupavé", "dip"], "ingredients": ["3 cukety", "300 g mouky + 300 ml vody", "100 g cornflakes", "olej, sůl, pepř, koření dle chuti", "Dip: uvařené zbytky cukety", "100 g řeckého jogurtu 0 %", "olej, sůl, pepř, máta, citronová šťáva"], "steps": ["Cuketu nakrájet na kolečka, vykrájet kroužky; středy uvařit na pánvi do měkka.", "Z mouky, vody a soli udělat hladké těstíčko; cornflakes rozdrtit.", "Kroužky obalit v těstíčku a pak v cornflakes.", "Péct ve fritéze 10–15 minut při 180–200 °C dozlatova (nebo v troubě)." ut."], "recipe": "full", "note": "", "time_min": null, "unsure": false, "servings": null}, {"i": 38, "url": "https://www.instagram.com/reel/DZ6rQ5DsHFn/", "author": "sarlota_and_cakes", "caption": "🍋 Citronový koláč s italským sněhem\n\nKřehké těsto\n🍋 250 g hladké mouky\n🍋 80 g cukru moučky\n🍋 špetka soli\n🍋 1 vejce\n🍋 2 žloutky\n🍋 100 g změklého másla\n🍋 1/2 lžičky prášku do pečiva\n\n🍋Vypracujte těsto pomocí protínací metly, natlačte do formy o průměru 24-26 cm, dbejte na to, aby těsto nebylo silné (během pečení nabude) a poté propíchejte vidličkou.\n🍋Nechte vychladit v lednici.\n🍋Pečte při 180 °C asi 15 minut dozlatova.\n🍋Po 10 minutách pečení stlačte těsto skleničkou a dopečte.\n\nCitronový krém\n🍋 150 g másla\n🍋 100 g cukru krupice\n🍋 80 g třtinového cukru\n🍋 150 g citronové šťávy\n🍋 3 vejce\n🍋 2 žloutky\n\n🍋Vše zahřívejte nad vodní lázní do 80 °C a zhoustnutí. Nalijte na upečený a vychladlý korpus a nechte vychladit a zatuhnout v lednici.\n\nItalský sníh\n🍋 100 g bílků\n🍋 100 g cukru do bílků\n🍋 100 g cukru na rozvar\n🍋 voda (jen tolik, aby zakryla cukr)\n\n🍋Bílky vyšlehejte s cukrem. Z druhé části cukru a vody uvařte rozvar na 118 °C a za stálého šlehání přilévejte k bílkům. Šlehejte do vychladnutí.\n\n🍋 Navrstvěte na citronový krém.\n🍋 Opalte flambovací pistolí.\n🍋 Ozdobte plátky citronu a borůvkami. ✨🍋\n\n#pastry #cake #like #lemontart #recipe", "title": "Citronový koláč s italským sněhem", "title_orig": "Citronový koláč s italským sněhem", "category": "Sladké", "tags": ["koláč", "citron", "dezert", "pečení", "křehké těsto", "do trouby"], "ingredients": ["Těsto: 250 g hladké mouky", "80 g cukru moučky", "špetka soli", "1 vejce", "2 žloutky", "100 g změklého másla", "1/2 lžičky prášku do pečiva", "Krém: 150 g másla", "100 g krupice cukru", "80 g třtinového cukru", "150 g citronové šťávy", "3 vejce", "2 žloutky", "Italský sníh: 100 g bílků", "100 g cukru do bílků", "100 g cukru na rozvar", "voda", "plátky citronu a borůvky na ozdobu"], "steps": ["Vypracovat těsto, natlačit do formy 24–26 cm, propíchat, vychladit.", "Péct při 180 °C asi 15 minut; po 10 minutách těsto stlačit skleničkou.", "Krém: vše zahřívat nad vodní lázní do 80 °C a zhoustnutí, nalít na korpus a nechat zatuhnout.", "Italský sníh: bílky vyšlehat s cukrem, rozvar z cukru a vody uvařit na 118 °C a za šlehání přilévat; šlehat do vychladnutí.", "Navrstvit na krém, opálit pistolí, ozdobit citronem a borůvkami."], "recipe": "full", "note": "", "time_min": null, "unsure": false, "servings": null}, {"i": 39, "url": "https://www.instagram.com/reel/DZ1q3dkihnT/", "author": "klarka.be.fit", "caption": "ve vedrech bych nejedla noc jinýho než meloun a saláty, ale nejsem úplně tým zelenina se zeleninou 👀 takže menší upgrade a tenhle na asijský způsobem je moje zaaavislost už poslední dvě léta 🌈 \n\npotřebuješ: \nrýžové nudle \nzeleninu, kterou máš zrovna v lednici✨— já použila mrkev, avokádo, okurku a ledový salát (skvělý je i červené zelí!) \n+ libovolný zdroj bílkovin — já dala @vilgainczsk kuřecí maso\n\nna omáčku:\nlžíce arašídového másla \nlžíce sojové omáčky \n1/2 lžičky medu \n1/2 lžičky citronové šťávy\n(chilli / wasabi pokud máš radši pálivé)\n\n všeechno smícháš, zaliješ omáčkou a máš hotovoo! (skvělý je i na mealprep do krabičky✨\n\n@vilgainczsk KLARKABEFIT pro slevičku", "title": "Asijský salát s rýžovými nudlemi", "title_orig": "", "category": "Salát", "tags": ["salát", "rýžové nudle", "kuřecí", "asijské", "arašídové máslo", "meal prep", "zdravé", "rychlovka"], "ingredients": ["rýžové nudle", "zelenina dle výběru (mrkev, avokádo, okurka, ledový salát nebo červené zelí)", "libovolný zdroj bílkovin (kuřecí maso)", "Omáčka: 1 lžíce arašídového másla", "1 lžíce sójové omáčky", "1/2 lžičky medu", "1/2 lžičky citronové šťávy", "chilli nebo wasabi (volitelně)"], "steps": ["Uvařit nudle, nakrájet zeleninu a přidat bílkovinu.", "Smíchat omáčku, zalít a promíchat."], "recipe": "full", "note": "Vhodné i na meal prep do krabičky; spolupráce", "time_min": null, "unsure": false, "servings": null}, {"i": 40, "url": "https://www.instagram.com/reel/DWCKI_kjJI5/", "author": "luckaa_luci", "caption": "Cesnakové kuracie mäsko so zemiakovou kašou🥘\n\nToto je presne to jedlo, po ktorom si tvoj chlap naloží na tanier ešte minimálne raz.. teda aspoň u nás to tak bolo 🤭\n\nVšetky suroviny nakúpiš na jednom miesto a to v @lidlsk , kde ja bežne kupujem aj čerstvé slovenské kuracie mäsko 🍗\n\nRecept na mäsko (cca 5-6 porcií):\n•900g očistených kuracích pŕs alebo stehien (ja som použila tak pol na pol)\n•40g hladkej múky + soľ + korenie + 1 čl sušeného cesnaku\n•4 pl olivového oleja \n•mix korenín: 1 čl soli + 1 čl údenej paprika + 1 čl sušeného rozmarínu + 1 čl čierneho mletého korenia + 1/2 čl chilli + 1 čl korenia na mäso - tu si môžete použiť koreniny podľa seba\n•1 menšia cibuľa\n•5-6 strúčikov cesnaku\n•400ml vývaru alebo vody\n•50g strúhaného parmezánu\n•80g masla\n•čerstvé bylinky (ideálne petržlen alebo bazalka)\nPostup:\nKuracie mäso si očistíme a narežeme na menšie, tenšie kúsky. Každý kúsok obalíme v zmesi múky, sušeného cesnaku, soli a korenia.\nNásledne mäso opečieme na olivovom oleji niekoľko minút z každej strany. Počas pečenia ho posypeme zmesou korenín. Potom mäso vyberieme na tanier a na výpeku orestujeme cibuľu, cesnak, zalejeme vývarom, chvíľu povaríme a potom pridáme aj strúhaný parmezán, maslo a čerstvé bylinky. Vložíme do toho naspäť mäso a poprelievame omáčkou. Podávame napríklad so zemiakovou kašou, či pečenými zemiakmi alebo ryžou. Dobrú chuť!\n\n#lunchtime#lunchidea#chickenrecipes#recipeidea#spolupraca", "title": "Česnekové kuře s bramborovou kaší", "title_orig": "Cesnakové kuracie mäsko so zemiakovou kašou", "category": "Hlavní jídlo", "tags": ["kuřecí", "česnek", "brambory", "parmazán", "omáčka", "slovenské"], "ingredients": ["900 g očištěných kuřecích prsou nebo stehen", "40 g hladké mouky", "sůl, pepř, 1 lžička sušeného česneku", "4 lžíce olivového oleje", "Koření: 1 lžička soli, 1 lžička uzené papriky, 1 lžička sušeného rozmarýnu, 1 lžička mletého pepře, 1/2 lžičky chilli, 1 lžička koření na maso", "1 menší cibule", "5–6 stroužků česneku", "400 ml vývaru nebo vody", "50 g strouhaného parmazánu", "80 g másla", "čerstvé bylinky (petržel nebo bazalka)"], "steps": ["Maso nakrájet na menší tenké kousky a obalit ve směsi mouky, česneku, soli a pepře.", "Opéct na oleji z každé strany, posypat kořením, vyndat.", "Na výpeku orestovat cibuli a česnek, zalít vývarem, krátce povařit.", "Přidat parmazán, máslo a bylinky, vrátit maso a podlévat omáčkou.", "Podávat s bramborovou kaší, pečenými bramborami nebo rýží."], "recipe": "full", "note": "Cca 5–6 porcí; spolupráce (Lidl)", "time_min": null, "unsure": false, "servings": 5}, {"i": 41, "url": "https://www.instagram.com/reel/DYVjbrzmueE/", "author": "simple.home.edit", "caption": "If dinner feels hard today, make this one-pan chicken and broccoli lasagne!\n\nEverything cooks in the same pan… including the lasagne sheets. It’s creamy, cheesy, loaded with chicken and broccoli and topped with bubbling mozzarella. Basically all the comfort of homemade lasagne without the layering or the sink full of dishes afterwards.\n\nFind the recipe on my website (link in bio) or comment RECIPE and I’ll send you the link. \n\n#onepanmeal #lasagne #comfortfood #familydinner #easyweeknightdinner #simplehomeedit #pastarecipes", "title": "Lasagne z jedné pánve s kuřecím a brokolicí", "title_orig": "one-pan chicken and broccoli lasagne", "category": "Hlavní jídlo", "tags": ["kuřecí", "brokolice", "těstoviny", "lasagne", "jedna pánev", "sýr", "mozzarella", "rychlovka"], "ingredients": [], "steps": [], "recipe": "none", "note": "Recept na webu autora (odkaz v bio) nebo po komentáři", "time_min": null, "unsure": false, "servings": null}, {"i": 42, "url": "https://www.instagram.com/reel/DYAdRC1R4pS/", "author": "mydarr", "caption": "Crispy Rice Salad \n\nINGREDIENTS\nCrispy Rice:\n1 cup cold, cooked rice (day-old for best texture)\n1 tbsp chili oil\n1 tsp soy sauce\n\nSalad Base:\n1 cups cucumbers, thinly sliced\n1 avocado, sliced \n1 cup cooked shrimp or protein of your choice\n1/2 cup shelled edamame (cooked)\n1-2 green onions, thinly sliced\n\nOptional Add-Ins:\nFresh herbs: cilantro or mint\nLime wedges, for serving\nSesame seeds \n\nPeanut Dressing:\n1/2 cup peanut butter\n1 tbsp rice vinegar\n1 tbsp soy sauce\n1 tbsp honey or maple syrup\n1/2 tbsp toasted sesame oil\n2 garlic cloves, finely minced\n1-2 tbsp warm water (to loosen)\n\n⸻\n\nINSTRUCTIONS\nRice → Toss rice with chili oil, and soy sauce. Spread in a thin layer on parchment and air fryer at 400°F (200°C) for 14-18 minutes, until deep golden and crispy edges.\n\nDressing → Whisk everything until smooth and pourable. Add water slowly until it’s creamy but not thick.\n*Taste check: salty + sweet + tangy + nutty. Adjust with lime or honey if needed.\n\nSalad → In a large bowl, combine all salad ingredients.\n\nFinish → Fold in the crispy rice last so it stays crunchy. Drizzle dressing on top. Finish with herbs, sesame seeds, and a squeeze of lime.\n\n⸻\n#healthyfoods \n#healthyrecipes \n#easyrecipes \n#crispyrice \n#salad", "title": "Salát s křupavou rýží a arašídovým dresinkem", "title_orig": "Crispy Rice Salad", "category": "Salát", "tags": ["rýže", "krevety", "asijské", "airfryer", "edamame", "arašídy", "zdravé"], "ingredients": ["Křupavá rýže: 160 g studené vařené rýže", "1 lžíce chilli oleje", "1 lžička sójové omáčky", "Salát: 130 g tence nakrájené okurky", "1 avokádo", "150 g vařených krevet nebo jiné bílkoviny", "80 g vařeného edamame", "1-2 jarní cibulky", "Volitelně: koriandr nebo máta, limetka, sezam", "Dresink: 130 g arašídového másla", "1 lžíce rýžového octa", "1 lžíce sójové omáčky", "1 lžíce medu nebo javorového sirupu", "1/2 lžíce sezamového oleje", "2 stroužky česneku", "1-2 lžíce teplé vody"], "steps": ["Rýži promíchat s chilli olejem a sójovkou, rozprostřít na pečicí papír a péct v airfryeru při 200 °C 14-18 minut do křupava", "Dresink důkladně rozmíchat, vodu přidávat postupně do krémové konzistence", "Smíchat ingredience salátu", "Nakonec vmíchat křupavou rýži, polít dresinkem, posypat bylinkami a sezamem, přidat limetku"], "recipe": "full", "note": "Dresink ochutnat: slané, sladké, kyselé, oříškové", "time_min": null, "unsure": false, "servings": null}, {"i": 43, "url": "https://www.instagram.com/reel/DXWylFFCPC7/", "author": "jeffandlaurenshow", "caption": "Apple Rose Tarts! 🍎🌹\nSurprisingly easy to make and stunning on the table! This delicious apple dessert is perfect for any occasion! #baking #treats #apple #dessert #easybaking", "title": "Jablečné růžičky", "title_orig": "Apple Rose Tarts", "category": "Sladké", "tags": ["jablka", "dezert", "pečení", "koláč", "jednoduché"], "ingredients": [], "steps": [], "recipe": "none", "note": "Recept jen ve videu", "time_min": null, "unsure": false, "servings": null}, {"i": 44, "url": "https://www.instagram.com/reel/DWMY0tLjbv0/", "author": "zivot.v.rovnovaze", "caption": "Domácí pastilky na bolest v krku\nTohle je přesně ten typ věci, který chceš mít doma… a říkáš si, proč jsem to neudělala už dávno.\n\nDomácí cucací „pastilky“ z medu, zázvoru a skořice. \nPár surovin. Pár minut. A úleva pro krk, která pomůže.\n\nJak to funguje? \n- Med krásně obalí podrážděný krk a zklidní ho. \n- Zázvor zahřeje, podpoří imunitu a pomáhá při škrábání v krku. \n- Skořice působí antibakteriálně a dodá tomu chuť, kterou si fakt oblíbíš.\n\nJá je miluju hlavně proto, že: \n– víš přesně, co v nich je \n– jsou hotové za pár minut ze surovin, co máš\n– stojí pár korun (40 pastilek mě vyšlo ca na 30-40 kč)\n– a upřímně… fungují líp než spousta věcí z lékárny\n\nNavíc jsou ideální i na cesty nebo do kabelky, když na tebe něco „leze“ nebo tě bolí v krku\n\nCo na ně potřebuješ? \nmed, čerstvý zázvor (šťávu z něj), skořici \n(případně můžeš přidat i citron)\n\nJestli chceš přesný postup + další moje tipy, co dělat hned při prvních příznacích nachlazení, napiš do komentáře „PASTILKY“ a pošlu ti to.\n\nSleduj mě, ať ti neuniknou další tipy a sdílej to dál, ať tohle zkusí každý🤍", "title": "Domácí pastilky na bolest v krku", "title_orig": "Domácí pastilky na bolest v krku", "category": "Ostatní", "tags": ["med", "zázvor", "skořice", "nachlazení", "domácí lék"], "ingredients": ["Med", "Šťáva z čerstvého zázvoru", "Skořice", "Volitelně citron"], "steps": [], "recipe": "partial", "note": "Přesný postup posílá autor po komentáři „PASTILKY“. Nejde o jídlo, spíš domácí lék.", "time_min": null, "unsure": false, "servings": null}, {"i": 45, "url": "https://www.instagram.com/reel/DE21OMpAW40/", "author": "anetjiskra", "caption": "Dnešní recept na rychlé curry s masovými kuličkami!\n\nBudete potřebovat:\n\n500g mletého kuřecího masa\n1 lžička mletého zázvoru\n2 jarní cibulky\n1/4 lžičky chilli\n1 lžička granulovaného česneku\n1 vejce\nKůra z 1/2 limetky\nSůl, pepř\n3 lžíce polohrubé mouky\n\nNa omáčku:\n1 balení červené curry pasty (koupíte v asijských večerkách nebo i v supermarketech)\n2 jarní cibulky\nPlechovka kokosového mléka\n300g zeleniny (já dala papriku a brokolici)\n1 lžička granulovaného česneku\n1 lžička mletého zázvoru\n1 lžička sójové omáčky\n1 lžička medu\nSůl, pepř\n1 lžíce lahůdkového droždí (nebo 1/2 kostky zeleninového vývaru)\nŠťáva z 1/2 limetky\n\nPodávejte s rýží posypané sezamovými semínky 🙏🏻🙂 ať chutná ❤️\n\n#recept#reel#hannetonmonde#tipnaveceri", "title": "Rychlé curry s masovými kuličkami", "title_orig": "Rychlé curry s masovými kuličkami", "category": "Hlavní jídlo", "tags": ["kuřecí", "mleté maso", "curry", "kokosové mléko", "rýže", "asijské", "rychlovka"], "ingredients": ["Kuličky: 500 g mletého kuřecího masa", "1 lžička mletého zázvoru", "2 jarní cibulky", "1/4 lžičky chilli", "1 lžička granulovaného česneku", "1 vejce", "Kůra z 1/2 limetky", "Sůl, pepř", "3 lžíce polohrubé mouky", "Omáčka: 1 balení červené curry pasty", "2 jarní cibulky", "1 plechovka kokosového mléka", "300 g zeleniny (paprika, brokolice)", "1 lžička gra aire", "title": "Kukuřičné placky (wrapy) s tuňákem", "title_orig": "Galettes de maïs", "category": "Hlavní jídlo", "tags": ["kukuřice", "vejce", "sýr", "tuňák", "wrap", "fit", "do trouby", "zdravé"], "ingredients": ["400 g okapané kukuřice", "Sůl, pepř, pažitka", "1 vejce", "2 hrsti strouhané mozzarelly", "Náplň: salát", "150 g tuňáku smíchaného s 2 lžícemi tvarohu/čerstvého sýra", "šťáva z 1/2 citronu, koření, pažitka", "avokádo"], "steps": ["Kukuřici okapat, smíchat s vejcem, kořením a sýrem", "Na pečicím papíře vytvarovat tenké kruhy a péct 20-25 minut na 180 °C", "Nechat vychladnout, sundat z papíru a naplnit salátem, avokádem a tuňákovou směsí"], "recipe": "full", "note": "Na 4 wrapy", "time_min": 25, "unsure": false, "servings": 4}, {"i": 48, "url": "https://www.instagram.com/reel/DVOpGN7Cs0_/", "author": "myriadrecipes", "caption": "SPICY PEANUT BUTTER RAMEN 🍜 \n\nThese are my Spicy Peanut Butter Noodles topped with chicken, lime wedges, coriander (cilantro), chilli oil, and mangetouts (snow peas) 🫛 🌶️\n\nPerfect for a weeknight speedy dinner, this ramen is super creamy, slurpy, and absolutely delicious 🤤 I shared this with you last year and it got a whopping 17 MILLION views!!! You guys loved it, so this is your annual reminder to make it!!! ❤️❤️\n\nAs always, you can find the full recipe on my website (link in bio) or just google search “spicy peanut butter noodles myriad recipes” \n\n#peanutbutternoodles #noodlerecipe #peanutbutterramen", "title": "Pálivé nudle s arašídovým máslem", "title_orig": "Spicy Peanut Butter Ramen", "category": "Hlavní jídlo", "tags": ["nudle", "arašídy", "kuřecí", "asijské", "rychlovka", "pálivé"], "ingredients": [], "steps": [], "recipe": "none", "note": "Recept na webu autora (Myriad Recipes). V captionu je jen popis: kuřecí, limetka, koriandr, chilli olej, hrášek v lusku", "time_min": null, "unsure": false, "servings": null}, {"i": 49, "url": "https://www.instagram.com/reel/DX7HCDZIb_p/", "author": "anetjiskra", "caption": "„Sushi“ rolka 😍 Tip na rychlý oběd nebo večeři 🙏🏻\nTyhle rolky jsme v Asii jedli pořád jako svačinu. Nedávno mi je připomněl TikTok, tak jsem si je musela udělat i doma 😍\nBudete potřebovat:\nCca 200 g rýže (cca 1/2 lžičky rýžového octa)\nKus lososa (200-300g)\n4 lžíce Kewpie majonézy\n1 lžičku srirachy\n1 lžíci sójové omáčky\nNori řasy\nSezamová semínka\n1/3 okurky\n1/2 avokáda\n#recept #hannetonmonde", "title": "Sushi rolka s lososem", "title_orig": "„Sushi“ rolka", "category": "Hlavní jídlo", "tags": ["losos", "rýže", "nori", "asijské", "rychlovka", "avokádo", "okurka"], "ingredients": ["Cca 200 g rýže (cca 1/2 lžičky rýžového octa)", "Kus lososa (200-300 g)", "4 lžíce Kewpie majonézy", "1 lžička srirachy", "1 lžíce sójové omáčky", "Nori řasy", "Sezamová semínka", "1/3 okurky", "1/2 avokáda"], "steps": [], "recipe": "ingredients", "note": "Postup není popsán", "time_min": null, "unsure": false, "servings": null}, {"i": 50, "url": "https://www.instagram.com/reel/DXRUVQ3j09x/", "author": "carbsmakeitokay", "caption": "how to make lasagna like an Italian Nonna 🤭🍝🧀 \n\nTHE SAUCE (cook 3 hours, no shortcuts)\n\nblend 2 onions, 3 carrots & celery. fry in oil. brown 500g pork + 500g beef mince with basil, rosemary & bay leaves. add crushed tomato & simmer 🍅\n\nTHE LAYERS (x5)\n\nsoften lasagne sheets in oil & water, and follow this order:\n\nsauce → Parmigiano Reggiano (v important go to an Italian deli!!!) → mozzarella → lasagne sheet → repeat. \n\ncook in oven until golden!! \n\n#italian #italianfood #nonna #lasagna #pasta", "title": "Lasagne podle italské babičky", "title_orig": "Lasagna like an Italian Nonna", "category": "Hlavní jídlo", "tags": ["těstoviny", "mleté maso", "vepřové", "hovězí", "italské", "do trouby", "lasagne"], "ingredients": ["Omáčka: 2 cibule, 3 mrkve, celer (rozmixované)", "500 g vepřového mletého", "500 g hovězího mletého", "bazalka, rozmarýn, bobkový list", "drcená rajčata", "olej", "Parmigiano Reggiano", "mozzarella", "lasagnové plátky"], "steps": ["Rozmixovanou cibuli, mrkev a celer osmažit na oleji", "Přidat mleté maso, zahnědnout s bylinkami, přidat rajčata a vařit 3 hodiny", "Plátky změkčit ve vodě s olejem", "Vrstvit: omáčka, parmazán, mozzarella, plát (5x)", "Péct v troubě do zlatova"], "recipe": "full", "note": "Omáčka se vaří 3 hodiny; množství sýrů neuvedeno", "time_min": 180, "unsure": false, "servings": null}, {"i": 51, "url": "https://www.instagram.com/reel/DW4EJgdEdFV/", "author": "workeatplaylove", "caption": "AIR FRYER SHRIMP TACOS & MANGO SALSA\n\nIt’s mango season and these tacos are on repeat. sweet, fresh, a little messy… and way too easy for a weeknight.\n\nSave for your next meal 📌\n\nHere’s how to make it: \n\nPrepare the Shrimp:\n\nStart by defrosting and rinsing the shrimp. Pat them dry, then season with a drizzle of olive oil, paprika, cumin, chilli powder, sea salt, a generous squeeze of lime juice, and a sprinkle of garlic powder. Give it all a good mix and let the shrimp marinate while you prep everything else.\n\nMake the Mango Salsa:\n\nDice up a ripe mango, then toss it with half a small red onion (finely chopped), a handful of chopped cilantro, the juice of one lime, a pinch of sea salt, and a dash of chilli powder. Mix it all, and you’ve got the perfect balance of sweet and tangy.\n\nPrepare the Crema:\n\nIn a small bowl, combine sour cream with garlic powder (or minced garlic), sea salt, lime zest, and a splash of lime juice. This zesty crema ties everything together beautifully.\n\nCook the Shrimp:\n\nPop the shrimp in the air fryer at 400°F for about 7 minutes. I love using my @ourplace Wonder Oven for this—it cooks the shrimp perfectly every time and I love that I can see my food while it’s cooking.\n\nAssemble the Tacos:\n\nChar some tortillas, then pile on the shrimp, shredded purple cabbage, mango salsa, and a drizzle of that luscious crema. \n\nEnjoy!\n.\n.\n#airfryerrecipes #mango #taconight #easydinnerideas #quickdinnerideas", "title": "Airfryer krevetová tacos s mangovou salsou", "title_orig": "Air Fryer Shrimp Tacos & Mango Salsa", "category": "Hlavní jídlo", "tags": ["krevety", "tacos", "mexické", "airfryer", "mango", "tortilla", "rychlovka"], "ingredients": ["Krevety (rozmražené, osušené)", "olivový olej, paprika, kmín, chilli, mořská sůl, limetková šťáva, česnekový prášek", "Salsa: 1 zralé mango", "1/2 malé červené cibule", "hrst koriandru", "šťáva z 1 limetky", "sůl, chilli", "Crema: zakysaná smetana, česnek, sůl, limetková kůra a šťáva", "Tortilly, nakrájené fialové zelí"], "steps": ["Krevety okořenit a nechat marinovat", "Smíchat mangovou salsu", "Smíchat zakysanou smetanu s česnekem, solí a limetkou", "Krevety péct v airfryeru při 200 °C asi 7 minut", "Tortilly opéct, naplnit krevetami, zelím, salsou a cremou"], "recipe": "full", "note": "Množství většiny surovin neuvedeno", "time_min": null, "unsure": false, "servings": null}, {"i": 52, "url": "https://www.instagram.com/reel/DWwmZaeCZQA/", "author": "audreyannej", "caption": "ice cube tray sushi hack 🍣 super fun way to make quick sushi at home! \n\nIngredients\nCooked sushi rice\nSmoked salmon\nAvocado, sliced\nNori (seaweed sheets), cut into small squares\nSpicy mayo\nSesame seeds\n\nInstructions\n1.\tLine an ice cube tray with plastic wrap.\n2.\tAdd a layer of smoked salmon into each cube.\n3.\tTop with avocado slices (and any extras if you want).\n4.\tPack sushi rice firmly on top of each cube.\n5.\tFlip upside down, then remove the ice cube tray and plastic wrap.\n6.\tTop with spicy mayo + sesame seeds.\n\n#sushihack #easyrecipes #viralrecipes #quickmeals #foodreels", "title": "Sushi z formy na led", "title_orig": "Ice cube tray sushi hack", "category": "Hlavní jídlo", "tags": ["sushi", "losos", "rýže", "avokádo", "asijské", "rychlovka", "nori"], "ingredients": ["Vařená sushi rýže", "Uzený losos", "Avokádo (plátky)", "Nori (na malé čtverečky)", "Pálivá majonéza", "Sezamová semínka"], "steps": ["Formu na led vyložit fólií", "Do každé kostky dát vrstvu uzeného lososa", "Přidat plátky avokáda", "Pevně nasypat sushi rýži", "Převrátit, sundat formu a fólii", "Navrch pálivá majonéza a sezam"], "recipe": "full", "note": "", "time_min": null, "unsure": false, "servings": null}, {"i": 53, "url": "https://www.instagram.com/reel/DWe9Ah2kpMf/", "author": "platedbyyuri", "caption": "Viral Dumpling Lasagna 🥟\n\nIngredients\n\nDumpling filling:\n1 lb (450 g) ground pork\n½ cup finely chopped onion\n3 cloves garlic, minced\n1 tbsp grated ginger\n3 green onions, chopped\n1 tbsp light soy sauce\n1 tsp dark soy sauce\n1 tsp sesame oil\n½ tsp salt\n½ tsp black pepper\n\nLayers:\n25–30 dumpling wrappers\n½ cup water or chicken stock\n\nSauce:\n4 tbsp soy sauce\n2 tbsp rice vinegar\n3–4 tbsp chili oil\n\nToppings:\n2 tbsp green onions\nChili oil\n\nInstructions\n\nIn a bowl, mix ground pork, onion, garlic, ginger, green onions, soy sauces, sesame oil, salt, and pepper until sticky.\n\nIn a heatproof dish, spread a thin layer of the meat mixture. Add a layer of dumpling wrappers.\n\nRepeat layering: meat → wrappers → meat → wrappers → meat → wrappers.\n\nPour water or chicken stock evenly over the top.\n\nPlace the dish in a steamer and steam over medium heat for 25–30 minutes, until the pork is fully cooked.\n\nRemove and let it rest for a few minutes.\n\nMix soy sauce, rice vinegar, and chili oil, then pour generously over the dumpling lasagna.\n\nFinish with chili oil and green onions.\n.\n#dumplings #lasagna #recipe #cook #foodie", "title": "Knedlíková lasagne na páře", "title_orig": "Viral Dumpling Lasagna", "category": "Hlavní jídlo", "tags": ["vepřové", "mleté maso", "knedlíčky", "asijské", "dumplings", "na páře", "lasagne"], "ingredients": ["Náplň: 450 g mletého vepřového", "80 g jemně nakrájené cibule", "3 stroužky česneku", "1 lžíce strouhaného zázvoru", "3 jarní cibulky", "1 lžíce světlé sójové omáčky", "1 lžička tmavé sójové omáčky", "1 lžička sezamového oleje", "1/2 lžičky soli", "1/2 lžičky pepře", "Vrstvy: 25-30 plátů na knedlíčky", "120 ml vody nebo kuřecího vývaru", "Omáčka: 4 lžíce sójové omáčky", "2 lžíce rýžového octa", "3-4 lžíce chilli oleje", "Na ozdobu: 2 lžíce jarní cibulky, chilli olej"], "steps": ["Smíchat maso s ostatními surovinami do lepivé hmoty", "V žáruvzdorné misce střídat vrstvy masa a plátů těsta (3x)", "Zalít vodou nebo vývarem", "Dusit v páře na střední teplotu 25-30 minut", "Nechat chvíli odpočinout", "Smíchat omáčku a poléct, ozdobit chilli olejem a jarní cibulkou"], "recipe": "full", "note": "", "time_min": 30, "unsure": false, "servings": null}, {"i": 54, "url": "https://www.instagram.com/reel/DWoUE6Eje51/", "author": "lukishek", "caption": "Jak Luki tak hezky vykládal o jídle padouchům, došlo nám, že tady pro nás nechal ještě další recepis 👇🏻.\n\nKdyž jsi v Survivoru, kokos je základ všeho 😄. Dneska jsem si pro vás připravil jednoduché, ale brutálně dobré kokosové kari s krevetami. Krémové kokosové mléko, lehká pálivost červené kari pasty a šťavnaté krevety – ideální jídlo, když chceš něco rychlého, výživného a plného chuti. Podávej s rýží, koriandrem a kapkou chilli oleje a máš vystaráno. 🌶️🥥\n\nNejdřív si nakrájej jarní cibulku na kolečka, šalotku na kostičky a tupým koncem nože si natluč citronovou trávu. Pak si zarestuj krevety na nerezové pánvi od @fabinicz a dej si je stranou. \n\nNa pánev teď přijdou s oliváčem cibulky, nastrouhaný česnek, zázvor, a červená kari pasta. Po zarestovaní to zalej kokosovým mlékem a přidej citronovou trávu a nachystané krevety. \n\nTrošku to nech zredukovat, a dochuť limetkou, a případně solí a pepřem.\n\nNádobíčko (které teď na ostrově postrádám) nakoupíš na Fabini.cz kde s kódem „Lukishek“ dostaneš ještě 5% slevu.\n\nPotřebuješ:\n250 g syrových krevet (oloupané, bez střívka)\n1 svazek jarní cibulky\n1 menší šalotka\n1 stonek citronové trávy\n2 stroužky česneku\ncca 2 cm čerstvého zázvoru\n1–2 lžíce červené kari pasty (podle pálivosti)\n400 ml kokosového mléka (1 plechovka)\n1–2 lžíce olivového oleje\nšťáva z ½ limetky\nsůl a pepř podle chuti\n\nNa podávání\nrýže (basmati nebo jasmínová, cca 150 g suché)\nčerstvý koriandr\nchilli olej (pár kapek)\n\n#survivor #recept #kari #cooking #spoluprace", "title": "Kokosové kari s krevetami", "title_orig": "Kokosové kari s krevetami", "category": "Hlavní jídlo", "tags": ["krevety", "kari", "kokosové mléko", "rýže", "asijské", "rychlovka", "pálivé"], "ingredients": ["250 g syrových krevet (oloupané, bez střívka)", "1 svazek jarní cibulky", "1 menší šalotka", "1 stonek citronové trávy", "2 stroužky česneku", "cca 2 cm čerstvého zázvoru", "1-2 lžíce červené kari pasty", "400 ml kokosového mléka", "1-2 lžíce olivového oleje", "šťáva z 1/2 limetky", "sůl a pepř", "Na podávání: rýže (cca 150 g suché), čerstvý koriandr, pár kapek chilli oleje"], "steps": ["Nakrájet jarní cibulku a šalotku, natlouct citronovou trávu", "Krevety osmažit na pánvi a odložit", "Na oleji orestovat cibulky, česnek, zázvor a kari pastu", "Zalít kokosovým mlékem, přidat citronovou trávu a krevety", "Nechat zredukovat, dochutit limetkou, solí a pepřem"], "recipe": "full", "note": "Reklamní spolupráce (Fabini)", "time_min": null, "unsure": false, "servings": null}, {"i": 55, "url": "https://www.instagram.com/reel/DWe0xihEmRo/", "author": "aliciamaclaren", "caption": "another day of pretending I own a little restaurant and my #1 customer is my husband 🤍\n\nMade the most delicious and creamy pasta for dinner - Creamy Garlic Parmesan Chicken Pasta, just wow 🤯 \n\nFor the full step-by-step recipe, head to my link in bio 🫶\n\n#pastadinner #homemaking #homemaker #cozypastadinner", "title": "Krémové těstoviny s kuřecím, česnekem a parmazánem", "title_orig": "Creamy Garlic Parmesan Chicken Pasta", "category": "Hlavní jídlo", "tags": ["těstoviny", "kuřecí", "parmazán", "smetana", "česnek", "italské"], "ingredients": [], "steps": [], "recipe": "none", "note": "Recept na webu autora (odkaz v bio)", "time_min": null, "unsure": false, "servings": null}, {"i": 56, "url": "https://www.instagram.com/reel/DBRY5IIMHIT/", "author": "mamachefcz", "caption": "Smažená rýže/Fried rice se zeleninou a vejcem. 🍚🥕🥬🧄🫛 🍳\n\nMajk o tomto jídle mluví asi 2 roky. Pořád jen, ať udělám fried rice. 😄 Tak jsem jeho přání splnila a při tom rovnou vytvořila tento recept. Smažená rýže je jednoduché a moc dobré jídlo. Navíc doma si jej připravíte rozhodně o kapku, nebo spíš i dvě zdravěji, než je k dostání v čínských bistrech. 😁🙌 Ideální na přípravu je právě jasmínová rýže, já jsem použila značku SOS, kterou ode mě už znáte. 😊\n \nReceptů na smaženou rýží je celá řada. Klidně si ji můžete uzpůsobit dle sebe a aktuálních zásob lednice a mrazáku. Co ale nevynechejte je rozhodně…rýže 😄, vejce a sójová omáčka. Místo sójovky můžete ale sáhnout po její alternativě v podobě kokosové amino omáčky. 🥥\n \nIngredience\n \n400 g uvařené jasmínové rýže SOS (cca 250 g syrové)\n+\nrostlinný olej\n3 vejce\n+\n4 stroužky česneku\nkousek zázvoru – volitelné\n100 g lusků mladého hrášku/cukrového hrášku nebo klasického hrášku\n1/3 pórku\n2 menší mrkve\n1 pak choi nebo kousek čínského zelí\n+\n3-4 lžičky sójové omáčky nebo kokosové amino omáčky\n1 lžička rybí omáčky – volitelné\n1-2 lžičky citronové nebo limetové šťávy\nšpetka chilli nebo kajenského pepře – volitelné\nsůl dle potřeby\n \nPostup\n \n1. Rýži uvařte dle návodu na obalu. Doporučuji vařit ve vývaru nebo přidat do vody lžičku koncentrovaného bujónu.\n2. Vejce rozšlehejte v misce. Česnek oloupejte a nasekejte. Zeleninu omyjte, mrkev oloupejte. Lusky hrášku nakrájejte na kousky, pórek rozkrojte napůl a krájejte na půlkolečka. Mrkev nastrouhejte na plátky pomocí škrabky. Pok choi nasekejte nahrubo.\n3. 2-3 lžíce oleje rozehřejte na pánvi a vlijte vejce. Míchejte, dokud se jednotlivé kousky neopečou.\n4. Dále přidejte česnek (popř. nastrouhaný zázvor) a orestujte. Pokračujte uvařenou rýží a míchejte.\n5. Poté postupně přidávejte zeleninu, stále je důležité míchat. Pokud by bylo potřeba, můžete přidat i trošku oleje. Začnete přidáním hrášku v lusku, který se bude vařit nejdéle, pokračujte mrkví, pórkem, a nakonec pak choi.\n\nPokračování v komentářích. 🫚\n\n#spoluprace #sosrice #smazenaryze #friedrice #recept #rychlerecepty", "title": "Smažená rýže se zeleninou a vejcem", "title_orig": "Smažená rýže / Fried rice", "category": "Hlavní jídlo", "tags": ["rýže", "vejce", "zelenina", "asijské", "rychlovka", "vegetariánské", "pak choi"], "ingredients": ["400 g uvařené jasmínové rýže (cca 250 g syrové)", "rostlinný olej", "3 vejce", "4 stroužky česneku", "kousek zázvoru (volitelně)", "100 g lusků mladého hrášku", "1/3 pórku", "2 menší mrkve", "1 pak choi nebo kousek čínského zelí", "3-4 lžičky sójové nebo kokosové amino omáčky", "1 lžička rybí omáčky (volitelně)", "1-2 lžičky citronové nebo limetkové šťávy", "špetka chilli nebo kajenského pepře (volitelně)", "sůl"], "steps": ["Rýži uvařit dle návodu (ideálně ve vývaru)", "Vejce rozšlehat, česnek nasekat, zeleninu nakrájet, mrkev nastrouhat škrabkou na plátky", "Na 2-3 lžících oleje míchat vejce do rozpečení", "Přidat česnek (zázvor) a orestovat, přidat rýži", "Postupně přidávat zeleninu: hrášek, mrkev, pórek, nakonec pak choi"], "recipe": "full", "note": "Postup pokračuje v komentářích (dochucení sójovkou apod. chybí v captionu). Reklamní spolupráce (SOS)", "time_min": null, "unsure": false, "servings": null}, {"i": 57, "url": "https://www.instagram.com/reel/DPT780BCBlk/", "author": "mamachefcz", "caption": "Banana bread s arašídovým máslem – vláčný, sladký, s lehkou slaností arašídů. 🍌🥜\nPokračování receptového seriálu BUCHTA EXPRESS.\nTenhle banánový chlebíček mě fakt baví – a kombinace banánů a arašídů očividně taky (před pár lety jsem dělala banánovo-arašídovou bábovku, ale už si to moc nepamatuju 😅).\nVe videu si můžeš všimnout, že jsem použila BIO banány. Jo, jsem bio freak a milovník a nebojím se to přiznat. 😄\nA právě proto miluju novinku @mixteecz – značku ORGANSIA. \nZnačka rozšiřuje portfolio o čaje v BIO kvalitě – bez postřiků, bez umělých dochucovadel, bez barviv. ✅\nJen 100% přírodní, certifikované suroviny z ekologického zemědělství 🌱.Navíc čajové sáčky jsou z rostlinných materiálů.\n \nIngredience\n• 3 zralé banány (300 g dužiny)\n• 2 vejce\n• 70 g rozpuštěného másla\n• 70 g arašídového másla\n• 100 g zakysané smetany\n• 60–80 g třtinového cukru (podle sladkosti/zralosti banánů)\n• 230 g hladké mouky (lze i špaldová)\n• 1 lžička mleté cejlonské skořice\n• velká špetka soli (ideálně vločkové)\n• 1 lžička jedlé sody\n• 1 lžička prášku do pečiva\n• 80 g nasekané hořké čokolády\n+\n• arašídové máslo na ozdobení\n \nPostup\n1. Předehřejte troubu na 170 °C (horkovzdušnou na 160 °C).\n2. Banány dejte do mísy a rozmačkejte vidličkou na kaši. Přidejte vejce a dobře promíchejte.\n3. Přidejte cukr a znovu dobře promíchejte.\n4. Máslo rozpusťte a rozmíchejte v něm arašídové máslo. Směs by neměla být horká! Přidejte ji k banánům, vejcím a cukru. Vmíchejte zakysanou smetanu.\n5. Přisypte skořici, prosátou mouku, sůl, jedlou sodu a prášek do pečiva. Krátce promíchejte – směs na banana bread se nesmí přešlehat!\n6. Nakonec vmíchejte nasekanou hořkou čokoládu.\n7. Chlebíčkovou formu vyložte pečicím papírem a směs přesuňte do formy. Seshora dejte cca 2 lžíce arašídového másla a vidličkou naaranžujte do spirály.\n8. Pečte v předehřáté troubě 50–60 minut, nebo dokud špejle zapíchnutá do středu nevyjde čistá. Pokud vaše trouba peče silněji, můžete po 40 minutách snížit teplotu na 160 °C, aby se nespálil.\n\n#recept #bananabread #spoluprace #mixtee #organsia", "title": "Banánový chlebíček s arašídovým máslem", "title_orig": "Banana bread s arašídovým máslem", "category": "Pečivo", "tags": ["banány", "arašídy", "čokoláda", "pečení", "sladké", "chlebíček", "do trouby"], "ingredients": ["3 zralé banány (300 g dužiny)", "2 vejce", "70 g rozpuštěného másla", "70 g arašídového másla", "100 g zakysané smetany", "60-80 g třtinového cukru", "230 g hladké mouky (lze špaldová)", "1 lžička mleté skořice", "velká špetka soli", "1 lžička jedlé sody", "1 lžička prášku do pečiva", "80 g nasekané hořké čokolády", "Arašídové máslo na ozdobení"], "steps": ["Předehřát troubu na 170 °C (horkovzdušná 160 °C)", "Banány rozmačkat, přidat vejce a cukr", "Rozpuštěné máslo s arašídovým máslem (nehorké) a zakysanou smetanu vmíchat do banánů", "Přidat skořici, mouku, sůl, sodu a prášek do pečiva, krátce promíchat", "Vmíchat čokoládu", "Dát do formy vyložené papírem, navrch spirála z arašídového másla", "Péct 50-60 minut do čisté špejle"], "recipe": "full", "note": "Reklamní spolupráce (Mixtee/Organsia)", "time_min": 60, "unsure": false, "servings": null}, {"i": 58, "url": "https://www.instagram.com/reel/DVeVyYHjoLE/", "author": "cookingwithtaras", "caption": "one of my favorite pastas EVER 🥑 #pasta #pastarecipes #cooking #foodinspo", "title": "Špagety s avokádovou omáčkou", "title_orig": "one of my favorite pastas", "category": "Hlavní jídlo", "tags": ["těstoviny", "avokádo", "italské"], "ingredients": [], "steps": [], "recipe": "none", "note": "Podle náhledu videu. Recept jen ve videu.", "time_min": null, "unsure": false, "servings": null}, {"i": 59, "url": "https://www.instagram.com/reel/DVJj7gjiLL5/", "author": "anetjiskra", "caption": "Na nakládanou cibulku budeš potřebovat:\n\n2 větší červené cibule \n200 ml iablečného nebo vinného octa \n200 ml vody\n1 Ižíce cukru (klidně třtinový)\n1 Ižička soli\n\nCibuli nakrájej na tenká půl kolečka. V rendlíku zahřej vodu s octem, cukrem a solí (jen tak, aby se vše rozpustilo) Cibuli dej do sklenice a zalij horkým nálevem. Nech vychladnout a poté dej alespoň na 30 minut do lednice, ale ideálně vydrž do druhého dne. 😊🙏🏻\n\nV lednici vydrží přibližně 1-2 týdny!\n\nHodí se na chlebíčky, do salátů, na maso...\n\nDobrou chuť!", "title": "Nakládaná červená cibulka", "title_orig": "Nakládaná cibulka", "category": "Omáčka / dip", "tags": ["cibule", "nakládané", "příloha", "vegetariánské", "veganské", "jednoduché"], "ingredients": ["2 větší červené cibule", "200 ml jablečného nebo vinného octa", "200 ml vody", "1 lžíce cukru (klidně třtinový)", "1 lžička soli"], "steps": ["Cibuli nakrájet na tenká půlkolečka", "Vodu s octem, cukrem a solí ohřát jen do rozpuštění", "Cibuli dát do sklenice a zalít horkým nálevem", "Nechat vychladnout a dát min. na 30 minut do lednice (ideálně do druhého dne)"], "recipe": "full", "note": "Vydrží v lednici 1-2 týdny; hodí se na chlebíčky, do salátů, k masu", "time_min": 30, "unsure": false, "servings": null}, {"i": 60, "url": "https://www.instagram.com/reel/DVE3we1CCXG/", "author": "archersfood", "caption": "Comment “YES” or “RECIPE” and I’ll send you the link to the full free recipe!\n\nHappy hippos tiramisu\n\nWhere to find the recipe: you can click the link in my bio, it will take you to my website and then, search Happy hippos tiramisu or visit\n\nhttps://archersfood.com/happy-hippos-tiramisu/\n\n(or comment YES or RECIPE and I’ll DM the link to you!)\n\nSearch online: Happy hippos tiramisu archersfood\n\nMake sure you follow us or have the DMs open so we can send you the link, enjoy", "title": "Tiramisu Happy Hippos", "title_orig": "Happy hippos tiramisu", "category": "Sladké", "tags": ["tiramisu", "dezert", "italské", "bez pečení"], "ingredients": [], "steps": [], "recipe": "none", "note": "Recept na webu autora (archersfood.com/happy-hippos-tiramisu/)", "time_min": null, "unsure": false, "servings": null}, {"i": 61, "url": "https://www.instagram.com/reel/DUWMJ8ojIlN/", "author": "anetavignerova", "caption": "Miluji květák tahle rychlovka je boží🥳 \nKvěták jsem dala na chvíli do vroucí vody 👌🏻\nParmazán podle chuti ani být nemusí 🥳", "title": "Květák s parmazánem", "title_orig": "", "category": "Hlavní jídlo", "tags": ["květák", "parmazán", "rychlovka", "vegetariánské", "zdravé"], "ingredients": ["Květák", "Parmazán (volitelně)"], "steps": ["Květák chvíli povařit ve vroucí vodě"], "recipe": "partial", "note": "Jen stručné hinty, bez množství", "time_min": null, "unsure": true, "servings": null}, {"i": 62, "url": "https://www.instagram.com/reel/DUlylLDkk2y/", "author": "iramsfoodstory", "caption": "Garlic parmesan chicken wrap 🌯 \n\nFor the chicken\n\n2 lb boneless chicken breast, cut into cubes. \n2 tbsp oil (for marinating)\nSalt to taste\n1 tsp smoked paprika powder \n1 tsp red chili flakes \n1/2 tsp garlic powder \n1/2 tsp onion powder\n1 tsp black pepper \n1/3 cups parmesan cheese, freshly grated \nSqueeze of lemon juice \n1 tsp parsley, freshly chopped \n1/2 tsp fresh garlic, minced\n2 tbsp oil for cooking \n\nFor the sauce: \n\n1/2 cup mayonnaise \n1/2 tsp Dijon mustard\n1 fresh red chili, seeded and minced\n1/4 cup Parmesan cheese, freshly grated \n1 tsp roasted garlic \nSalt and pepper to taste\n1 tsp smoked paprika powder \nSqueeze of lemon juice \nDrizzle of oil \n1 tsp parsley, finely chopped \nSplash of water (to thin out the sauce)\n\nFor the Salad:\n2 cups romaine lettuce, diced\n2 tbsp extra virgin olive oil\nSalt and pepper, to taste 1-2 tbsp lemon juice, freshly \n1/3 cups freshly grated Parmesan  cheese \n\nTo assemble \n5 large tortillas wraps\n1/2 cup onions , diced\n1/2 cup tomatoes, diced\n\nMethod:\n\nIn a bowl, add chicken breast, oil, salt, smoked paprika, garlic powder, black pepper, lemon juice, red chili flakes, parsley. Mix well until the chicken is evenly coated.\nCover and marinate for 20–30 min.\n\nHeat oil in a large skillet over medium-high heat.\nAdd the chicken in a single layer , and fresh garlic and cook for 6–8 minutes, stirring occasionally, until golden brown and fully cooked through.\nRemove from heat and toss chicken with the freshly grated Parmesan cheese and parsley.\n\nIn a bowl, whisk together mayo, red chili, Parmesan cheese, garlic, smoked paprika, lemon juice, salt, and pepper. Drizzle in oil and add a splash of water, mixing until the sauce is smooth. Stir in chopped parsley and adjust seasoning to taste.\n\nIn a bowl, combine lettuce, olive oil, lemon juice, salt, pepper, and grated Parmesan cheese. Toss until evenly coated.\n\nSpread a generous layer of garlic Parmesan sauce over each tortilla.\nAdd the cooked chicken, salad, tomatoes, and onions If desired, add more sauce. Then, roll tightly into wraps. Serve, or toast the wraps in a pan seam side down for extra crispness.\n\n#garlicparmesan #recipe", "title": "Wrap s česnekovým parmazánovým kuřetem", "title_orig": "Garlic parmesan chicken wrap", "category": "Hlavní jídlo", "tags": ["kuřecí", "wrap", "tortilla", "parmazán", "salát", "rychlovka"], "ingredients": ["Kuře: cca 900 g kuřecích prsou na kostky", "2 lžíce oleje na marinování", "sůl", "1 lžička uzené papriky", "1 lžička chilli vloček", "1/2 lžičky česnekového prášku", "1/2 lžičky cibulového prášku", "1 lžička pepře", "35 g čerstvě strouhaného parmazánu", "trocha citronové šťávy", "1 lžička petrželky", "1/2 lžičky čerstvého česneku", "2 lžíce oleje na smažení", "Omáčka: 120 g majonézy", "1/2 lžičky dijonské hořčice", "1 čerstvé červené chilli", "25 g parmazánu", "1 lžička pečeného česneku", "sůl, pepř, 1 lžička uzené papriky, citron, olej, petržel, trocha vody", "Salát: 2 hrnky římského salátu", "2 lžíce olivového oleje", "sůl, pepř, 1-2 lžíce citronové šťávy", "35 g parmazánu", "Na sestavení: 5 velkých tortill", "80 g cibule", "90 g rajčat"], "steps": ["Kuře smíchat s olejem a kořením, marinovat 20-30 minut", "Na pánvi na středně vysoké teplotě smažit s česnekem 6-8 minut dozlatova", "Kuře promíchat s parmazánem a petrželkou", "Zašlehat omáčku z majonézy, chilli, parmazánu, česneku, papriky, citronu, oleje a vody", "Smíchat salát s olejem, citronem, solí a parmazánem", "Tortillu potřít omáčkou, přidat kuře, salát, rajčata, cibuli a pevně zarolovat; případně opéct na pánvi"], "recipe": "full", "note": "", "time_min": null, "unsure": false, "servings": null}, {"i": 63, "url": "https://www.instagram.com/reel/DUoO613DD0t/", "author": "lzickacukru", "caption": "Pokud milujete všechno, co křupe, tak musíte vyzkoušet i tyto knedlíčky z rýžového papíru z horkovzdušné fritézy. 🤤\n\nJak je u mě zvykem, je to poměrně rychlý a jednoduchý recept z pár surovin, ty mám prostě nejradši! Můžete z nich udělat klidně i závitky, s balením si nedělejte moc hlavu, vždy budou chutnat super! 🫶🏻\n\nNa 2 porce potřebujete:\nNa knedlíčky:\n* cca 10 kusů rýžového papíru\n* 300 g mletého hovězího masa\n* 2 menší mrkve\n* kousek červeného zelí\n* 2 stroužky česneku\n* ½ jarní cibulky\n* 2 lžíce sójové omáčky\n* lžíci oleje\n* olej ve spreji\nNa majonézu:\n* lžíci majonézy\n* lžíci řeckého jogurtu\n* lžíci sójové omáčky\n* stroužek česneku\n* lžičku srirachi \nZelí a jednu mrkev nastrouhejte nahrubo, druhou najemno, česnek a jarní cibulku nakrájejte najemno. Rozpalte pánev a přidejte do ní lžíci oleje. Do horkého oleje přidejte hovězí maso, vařečkou ho rozdělte na malé kousky a zprudka opečte dohněda. Jakmile je hotové, přimíchejte také strouhanou mrkev, červené zelí, nakrájenou jarní cibulku a česnek a společně opékejte pár minut, dokud zelenina nezměkne, nakonec přidejte sójovou omáčku a ještě minutu prohřejte. Směs by neměla být mokrá. Nechte kompletně vychladnout. \nRýžový papír na jarní závitky namočte do teplé vody, po změknutí naplňte připravenou náplní a zabalte dle videa. Hotové přendejte do fritézy, postříkejte olejem ve spreji a pečte na 195 °C 15 minut. \nNa majonézu smíchejte vše s prolisovaným česnekem do hladké omáčky.", "title": "Křupavé knedlíčky z rýžového papíru z airfryeru", "title_orig": "Knedlíčky z rýžového papíru", "category": "Hlavní jídlo", "tags": ["hovězí", "mleté maso", "rýžový papír", "airfryer", "asijské", "zelí", "mrkev"], "ingredients": ["cca 10 kusů rýžového papíru", "300 g mletého hovězího masa", "2 menší mrkve", "kousek červeného zelí", "2 stroužky česneku", "1/2 jarní cibulky", "2 lžíce sójové omáčky", "1 lžíce oleje", "olej ve spreji", "Majonéza: 1 lžíce majonézy", "1 lžíce řeckého jogurtu", "1 lžíce sójové omáčky", "1 stroužek česneku", "1 lžička srirachy"], "steps": ["Zelí a jednu mrkev nastrouhat nahrubo, druhou najemno, česnek a cibulku nakrájet", "Na oleji zprudka opéct hovězí do hněda", "Přidat zeleninu, česnek, restovat pár minut, nakonec sójovku; směs nemá být mokrá, nechat vychladnout", "Rýžový papír namočit, naplnit a zabalit", "Postříkat olejem a péct v airfryeru při 195 °C 15 minut", "Smíchat vše na omáčku s prolisovaným česnekem"], "recipe": "full", "note": "Na 2 porce", "time_min": null, "unsure": false, "servings": 2}, {"i": 64, "url": "https://www.instagram.com/reel/DPHPinsiPat/", "author": "varime.blog", "caption": "🥵 Už nikdy nekúpim tortilly v obchode…\nPrečo? Lebo tieto domáce tortilly sú:\n✨ mäkučké,\n✨ nelámu sa,\n✨ hotové za pár minút.\n\nStačí ti 5 surovín, ktoré máš určite doma 👇\n\nRecept – Domáce tortilly (10 ks)\n290–310 g hladkej (špaldovej múky, 00, T650) • 1 ČL soli • ½ ČL prášku do pečiva • 50 g oleja alebo masla • 160 ml horúcej vody (nie vriacej)\n\n👉 V miske zmiešaj múku, soľ a prášok do pečiva.\nPridaj olej alebo maslo a zapracuj do múky.\nPrilej horúcu vodu a vypracuj hladké, mäkké cesto.\nRozdeľ ho na 10 guľôčok (cca 50 g), potri olejom a nechaj 20–30 minút odpočívať.\nKaždú guľôčku vyvaľkaj na tenučkú placku a peč nasucho na panvici 30–50 sekúnd z každej strany, kým naskočia pľuzgieriky.\nUkladaj ich na seba a zakrývaj utierkou – ostanú mäkučké a nelámu sa.\n\n💡 Vieš, čo je na tom najlepšie?\nCesto vydrží v chladničke 2 dni a hotové tortilly v mrazničke 2 mesiace – takže keď príde chuť na quesadillu, tacos alebo wrap, máš ich vždy poruke.\n\n👉 Skús a napíš mi do komentára: si tím „kupujem“ alebo „pečiem doma“?\n\nVšetky recepty nájdeš aj na mojom blogu 🔗 www.varime.blog\n\n#varimeblog #videorecept #dobruchut #foodblogerka #domacetortilly #tortilly #homemadetortillas #rychlajedla #slovenskerecepty #jednoducherecepty #slovakfood #mealprep", "title": "Domácí tortilly", "title_orig": "Domáce tortilly", "category": "Pečivo", "tags": ["tortilla", "těsto", "pečivo", "rychlovka", "vegetariánské", "mražení", "slovenské"], "ingredients": ["290-310 g hladké onprest", "caption": "RESTAURANT PIZZA at home 🍕 \nwithout any professional equipment…IT IS POSSIBLE!\n\nComment “recipe” and i will send it to you ❤️", "title": "Pizza jako z restaurace", "title_orig": "RESTAURANT PIZZA", "category": "Hlavní jídlo", "tags": ["pizza", "těsto", "italské", "domácí"], "ingredients": [], "steps": [], "recipe": "none", "note": "Recept posílá autor po komentáři „recipe“", "time_min": null, "unsure": false, "servings": null}, {"i": 67, "url": "https://www.instagram.com/reel/DOEPbtLCBmY/", "author": "sonajuhascik", "caption": "Existujú recepty na foccaciu, v ktorých píšu, že by mala kysnúť aj 18 hodín a pravidelne by si ju mala prekladať.\nAle na čo si život komplikovať? 💁‍♀️\n\nRecept na extra jednoduchú foccaciu, ktorú zvládne každý tu: ⬇️\n\nBudeš potrebovať:\n- 512g hladkej múky\n- 10g soli\n- 8g sušeného droždia\n- 455g vlažnej vody\n\n- cca 4 lyžice olivového oleja na potretie cesta a rúk\n- maslo na vymastenie plechu\n- paradajky, rozmarín, olivy, syr alebo hocičo, čo dáš navrch\n\nPostup:\nZmiešaj všetky suroviny a vypracuj cesto.\nPotri celú plochu 1 lyžicou olivovým olejom.\nZakry fóliou a vlož do chladničky na aspoň 8 hodín. (Ideálne cez noc.)\nRáno potri plech maslom a nalej do stredu 2 lyžice olivového oleja. \nPlech, ktorý používam je menší. (Asi polovica z klasického veľkého)\nAk preferuješ tenkú focacciu, môžeš použiť aj väčší plech, ale na klasický veľký odporúčam urobiť dvojitú dávku.\nDo stredu plechu vylej cesto a obracaj ho v oleji, pokiaľ nie je z každej strany.\nNechaj ho odkryté na linke kysnúť aspoň hodinu až dve. Malo by byť rozliaté po celom plechu a mali by sa na ňom začať robiť bubliny. Tak vieš, že je pripravené na ďalší krok.\nA teraz prichádza tá najviac terapeutická časť - dierkovanie foccaci. \nDo dlani si nalej trošičku oleja a rozotri, aby sa ti cesto nelepilo na prsty.\nPo celej ploche urob s prstami dierky. Ak sa vytvoria bublinky, nepukaj ich. To je to, čo robí focacciu tak dobrú.\nNavrch poukladaj čo máš v chladničke alebo v záhradke, posoľ, pokvapkaj olivovým olejom a daj piecť do rúry na 220 stupňov cca 20-25 minút.\n\nA užívaj ty aj celá rodina.☺️\n\nFocaccia je super aj samostatne alebo ju môžeš použiť na sendviče.\n\nAk ťa tlačí čas, v komentároch nájdeš verziu, v ktorej nemusíš čakať celú noc.", "title": "Extra jednoduchá focaccia", "title_orig": "Foccacia", "category": "Pečivo", "tags": ["focaccia", "chléb", "italské", "těsto", "olivový olej", "přes noc", "vegetariánské"], "ingredients": ["512 g hladké mouky", "10 g soli", "8 g sušeného droždí", "455 g vlažné vody", "cca 4 lžíce olivového oleje na potření těsta a rukou", "máslo na vymazání plechu", "Navrch: rajčata, rozmarýn, olivy, sýr nebo cokoliv"], "steps": ["Smíchat všechny suroviny a vypracovat těsto", "Potřít 1 lžící oleje, zakrýt fólií a dát na min. 8 hodin do lednice (ideálně přes noc)", "Ráno vymazat plech máslem, nalít 2 lžíce oleje a těsto v něm obrátit", "Nechat odkryté kynout 1-2 hodiny, až se objeví bublinky", "Namazanými prsty udělat dolíčky, bubliny nepíchat", "Dát navrch zeleninu, osolit, pokapat olejem", "Péct v troubě při 220 °C cca 20-25 minut"], "recipe": "full", "note": "Rychlejší verze bez čekání přes noc je v komentářích. Pro velký plech dvojitá dávka", "time_min": null, "unsure": false, "servings": null}, {"i": 68, "url": "https://www.instagram.com/reel/DPUK74fDPdW/", "author": "healthy_by_sofia", "caption": "Špenátové cestoviny z dvoch ingrediencii.😍😋🥬 Videla som to na instagrame, tak som to musela vyskúšať.\n\n•Recept: \n• 100-120 g múky 🥯\n• špenát (asi 1,5 hrste) 🥬\n• štipka soli🧂\n\n• 🔃spolu to rozmixuj ( ak by cesto bolo lepivé, pridaj teochu múky)\n• 💧daj variť vodu v hrnci- ked začne bublať, začni strihať cesto na také listy a pitom to tam nechaj asi ešte 15-20 min\n• 🍗nakrajaj kuracie mäso na kocky, hoď  na panvicu a opeč zo všetký strán\n• 🫗nakoniec pridaj omáčku (recept je nižšie) a nechaj to trochu zapiecť\nmôže sa servírovať: na tanier daj cestoviny, mäso, 2 pl jemného tvarohu, 1 čl medu a pesta\n\n• Omáčka na mäso: \n• 1PL sójovej omáčky🫗\n• kvapka citrónu🍋\n• 2 strúčky cesnaku🧄\n• oregano\n• pálivá paprika🌶️\n• med🍯\n• štipka soli🧂\n\n#spenatovecestoviny #spinach #spinachpasta #pasta #italianopasta #healthy_by_sofia #zdraverecepty #rychlyrecept #dinner #vecera #pastadinner #foodies #fitrecepty #rýchlyobed #kuraciemaso #pokèbowl", "title": "Špenátové těstoviny s kuřecím", "title_orig": "Špenátové cestoviny z dvoch ingrediencií", "category": "Hlavní jídlo", "tags": ["těstoviny", "špenát", "kuřecí", "zdravé", "fit", "rychlovka", "tvaroh"], "ingredients": ["100-120 g mouky", "špenát (asi 1,5 hrsti)", "špetka soli", "kuřecí maso na kostky", "Omáčka: 1 lžíce sójové omáčky", "kapka citronu", "2 stroužky česneku", "oregano", "pálivá paprika", "med", "špetka soli", "K podávání: 2 lžíce jemného tvarohu, 1 lžička medu, pesto"], "steps": ["Mouku se špenátem a solí rozmixovat (když lepí, přidat mouku)", "Do vroucí vody stříhat těsto na listy a vařit 15-20 minut", "Kuřecí nakrájet na kostky a opéct", "Přidat omáčku a chvíli zapéct", "Servírovat s tvarohem, medem a pestem"], "recipe": "full", "note": "", "time_min": null, "unsure": false, "servings": null}, {"i": 69, "url": "https://www.instagram.com/reel/DTGrr4JDJM_/", "author": "alexcookjoy", "caption": "Loaded Sweet Potatoes. Recipe ↓\n\n■ INGREDIENTS\nSweet potatoes:\n• sweet potatoes - 4 medium (about 2 lb / 900 g)\n• olive oil - 1½ tbsp\n• salt - to taste\n\nBeef filling:\n• ground beef - 1 lb (450 g)\n• onion - 1 small, finely chopped\n• garlic - 2 cloves, minced\n• olive oil - 1 tbsp\n• salt & black pepper - to taste\n• smoked paprika - 1 tsp (optional)\n• baby spinach - 2 cups (60 g)\n\nFinish:\n• butter - 2-3 tbsp\n• shredded cheese (cheddar or mix) - 1½ cups (150 g)\n• sour cream - for serving\n• green onions - sliced\n\nOptional extras:\n• guacamole\n• salsa\n• or simple topping: diced tomato + avocado + corn\n\n■ HOW TO COOK:\n1. Wash the sweet potatoes (do not peel). Rub with olive oil and sprinkle with salt. Bake at 400°F (200°C) for 45-55 minutes, until very soft inside.\n\n2. While the potatoes bake, heat a pan over medium heat. Add olive oil, onion, and cook 3-4 minutes until soft. Add garlic → cook 30 seconds. Add ground beef, season with salt, pepper, and paprika. Cook 6-8 minutes until browned. Stir in baby spinach and cook 1 minute, just until wilted. Set aside.\n\n3. Remove potatoes from the oven. Slice each one lengthwise. Add butter directly into the hot potato and mash the inside with a fork until creamy.\n\n4. Top each potato with beef filling, then sprinkle with cheese. Return to the oven at 400°F (200°C) for 8-10 minutes, until cheese melts.\n\n5. Add a spoon of sour cream and sprinkle with green onions. Serve with guacamole and salsa on top or on the side (or keep it simple with tomato, avocado, and corn).\n\n■ INFO (approx.)\nPrep: 15 min  Cook: 60 min\nServes: 4\n~560 kcal | 32 g protein | 28 g fat | 46 g carbs (per serving)", "title": "Plněné batáty s hovězím", "title_orig": "Loaded Sweet Potatoes", "category": "Hlavní jídlo", "tags": ["batáty", "hovězí", "mleté maso", "sýr", "do trouby", "špenát"], "ingredients": ["Batáty: 4 středně velké (cca 900 g)", "1 1/2 lžíce olivového oleje", "sůl", "Náplň: 450 g mletého hovězího", "1 malá cibule", "2 stroužky česneku", "1 lžíce olivového oleje", "sůl a pepř", "1 lžička uzené papriky (volitelně)", "60 g baby špenátu", "Dokončení: 2-3 lžíce másla", "150 g strouhaného sýra", "zakysaná smetana", "jarní cibulka", "Volitelně: guacamole, salsa nebo rajče, avokádo, kukuřice"], "steps": ["Batáty omýt, potřít olejem, osolit a péct při 200 °C 45-55 minut do měkka", "Na oleji orestovat cibuli 3-4 minuty, přidat česnek 30 s", "Přidat hovězí, okořenit, smažit 6-8 minut, vmíchat špenát na 1 minutu", "Batáty podélně rozříznout, přidat máslo a vnitřek rozmačkat vidličkou", "Naplnit hovězím a posypat sýrem, zapéct při 200 °C 8-10 minut", "Podávat se zakysanou smetanou, jarní cibulkou, guacamole
