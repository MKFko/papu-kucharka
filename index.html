lké cibule \n2 stroužky česneku \n1/2 lžičky sladké papriky \n1/2 chilli vloček \n1 lžička oregana\n1 lžíce sójové omáčky Kikkoman \n100 g smetany 31%\n30-40g jemně strouhaného parmazánu\n1 hrst plocholisté petržele \nOlivový olej, pepř \n200 g sušených špaget \n\n#spoluprace\n#ZdravesKikkomanem #KikkomanInspirace2026", "title": "Špagety s karamelizovanou cibulí", "title_orig": "Špagety s karamelizovanou cibulí", "category": "Hlavní jídlo", "tags": ["těstoviny", "špagety", "cibule", "smetana", "parmazán", "vegetariánské", "rychlovka"], "ingredients": ["2 velké cibule", "2 stroužky česneku", "1/2 lžičky sladké papriky", "1/2 lžičky chilli vloček", "1 lžička oregana", "1 lžíce sójové omáčky", "100 g smetany 31 %", "30-40 g jemně strouhaného parmazánu", "1 hrst plocholisté petržele", "Olivový olej, pepř", "200 g sušených špaget"], "steps": [], "recipe": "ingredients", "note": "2 porce; postup není uveden. Reklamní spolupráce (Kikkoman)", "time_min": null, "unsure": false, "servings": 2}, {"i": 74, "url": "https://www.instagram.com/reel/DP65gdhiEOS/", "author": "zivotpodlegarpa", "caption": "Tyhle domácí tortilly zvládneš dřív, než se vůbec obuješ do krámu 😏\n Měkké, voňavé a hotové za 20 minut! 🌯\n\n🧂 Co budeš potřebovat:\n* 220 g hladké mouky\n* ½ lžičky soli\n* ½ lžičky kypřicího prášku\n* 125 ml vody\n* 3 lžíce oleje (klidně řepkového)\n\n👩‍🍳 Postup: Všechno smíchej, nech 10 min. odpočinout. Rozděl těsto na 4 koule a rozválej na pomoučeném válu.\n Opékej na rozpálené suché pánvi z každé strany 1–2 minuty – ne déle!, jinak ztvrdnou.\n Hotové tortilly dej na talíř a přikryj utěrkou – krásně zvláční. 🤍\n\n💡 Tip: Jsou skvělé na wrapy, quesadilly nebo jen tak s hummusem!\n\n📲 Ulož si recept 💾 a sleduj mě pro víc rychlých domácích jídel!\n\n#tortilla #homemade #recept #zivotpodlegarpa #wrap #recipe", "title": "Domácí tortilly", "title_orig": "Domácí tortilly", "category": "Pečivo", "tags": ["tortilla", "těsto", "pečivo", "rychlovka", "vegetariánské", "wrap"], "ingredients": ["220 g hladké mouky", "1/2 lžičky soli", "1/2 lžičky kypřicího prášku", "125 ml vody", "3 lžíce oleje (klidně řepkového)"], "steps": ["Vše smíchat a nechat 10 minut odpočinout", "Rozdělit na 4 koule a rozválet na pomoučeném válu", "Péct na suché rozpálené pánvi 1-2 minuty z každé strany", "Přikrýt utěrkou, aby změkly"], "recipe": "full", "note": "Hotové za 20 minut; skvělé na wrapy, quesadilly", "time_min": 20, "unsure": false, "servings": null}, {"i": 75, "url": "https://www.instagram.com/reel/DRXMJC0DYgh/", "author": "iramsfoodstory", "caption": "Fettuccine Alfredo 🍝 \n\nIngredients:\n\n225g fettuccine\nSalt to taste\n1 tsp black pepper\n1 tbsp garlic powder\n1 tsp Italian seasoning\n2 tbsp freshly minced parsley\n1/2 cup butter\n1 1/2 cup unsweetened heavy whipping cream\n1 cup parmesan cheese\n1 1/2 tbsp all-purpose flour\n1 cup reserved pasta water\n\nMethod:\n\nBring a large pot of salted water to a boil. Cook the fettuccine according to package instructions until al dente. Reserve 1 cup of pasta water before draining.\nIn a large saucepan, melt the butter over medium heat.\nSprinkle flour over the butter mixture and whisk to combine. Cook for 1-2 minutes, stirring constantly.\nGradually pour in the heavy whipping cream, whisking continuously to prevent lumps. Bring the mixture to a simmer and cook for 2-3 minutes or until slightly thickened.\nRemove the saucepan from the heat and stir in parmesan cheese until melted and smooth. Season with salt, black pepper, garlic powder and Italian seasoning.\nAdd the cooked fettuccine to the saucepan and toss to combine, adding reserved pasta water if needed to achieve a creamy consistency. Stir in freshly minced parsley and serve hot.\n\n#fettuccine #alfredo #pasta", "title": "Fettuccine Alfredo", "title_orig": "Fettuccine Alfredo", "category": "Hlavní jídlo", "tags": ["těstoviny", "smetana", "parmazán", "italské", "vegetariánské", "česnek"], "ingredients": ["225 g fettuccine", "sůl", "1 lžička černého pepře", "1 lžíce česnekového prášku", "1 lžička italského koření", "2 lžíce čerstvé petrželky", "115 g másla", "360 ml smetany ke šlehání", "100 g parmazánu", "1 1/2 lžíce hladké mouky", "240 ml vody z vaření těstovin"], "steps": ["Fettuccine uvařit al dente, odebrat 1 hrnek vody z vaření", "V hrnci rozpustit máslo, zasypat moukou a 1-2 minuty míchat", "Postupně zalít smetanou a 2-3 minuty vařit do zhoustnutí", "Odstavit, vmíchat parmazán, dochutit kořením", "Přidat těstoviny, podle potřeby vodu z vaření a petrželku, podávat horké"], "recipe": "full", "note": "", "time_min": null, "unsure": false, "servings": null}, {"i": 76, "url": "https://www.instagram.com/reel/DGa92WwIAg0/", "author": "anetjiskra", "caption": "Thajský salát s omáčkou z arašídů 😍\n\nBudete na něj potřebovat:\n\n1 balení rýžových nudlí\n1-2 mrkve\n1/2 okurky\n1/5 hlávky červeného zelí\n3 jarní cibulky\n1/3 papriky\nKoriandr\nDrcené arašídy\nŠťáva z limetky\nPečené kuřecí maso\n\nNa omáčku:\n5 lžic arašídového másla\n2 lžíce sójovky\n1 lžíce sezamového oleje\n1 lžíce rýžového octa (nebo šťávy z limetky)\n2 stroužky česneku\nKousek zázvoru\nCca 4-5 lžíc vody\n+ můžete přidat trochu chilli 🌶\n\n#salat#oblibenysalat#hannetonmonde#vecere", "title": "Thajský salát s arašídovou omáčkou", "title_orig": "Thajský salát s omáčkou z arašídů", "category": "Salát", "tags": ["rýžové nudle", "arašídy", "kuřecí", "asijské", "thajské", "zelenina", "koriandr"], "ingredients": ["1 balení rýžových nudlí", "1-2 mrkve", "1/2 okurky", "1/5 hlávky červeného zelí", "3 jarní cibulky", "1/3 papriky", "Koriandr", "Drcené arašídy", "Šťáva z limetky", "Pečené kuřecí maso", "Omáčka: 5 lžic arašídového másla", "2 lžíce sójovky", "1 lžíce sezamového oleje", "1 lžíce rýžového octa (nebo limetkové šťávy)", "2 stroužky česneku", "Kousek zázvoru", "Cca 4-5 lžic vody", "Volitelně chilli"], "steps": [], "recipe": "ingredients", "note": "Postup není popsán", "time_min": null, "unsure": false, "servings": null}, {"i": 78, "url": "https://www.instagram.com/reel/DTCfmyvDKvD/", "author": "vojta.holy", "caption": "🔥 Recept který se udělá \"skoro\" sám 😅\n\nPotřebuješ: \n• brambory\n• kuřecí prsa\n• cibuli\n• česnek\n• koření na kuře, sůl, pepř \n• sýr (mozzarella / čedar / cokoliv doma)\n\nPostup: \n1️⃣ Brambory, kuře, cibuli a česnek nakrájej na kousky\n2️⃣ Vše smíchej v míse, přidej koření\n3️⃣ Rozlož na pekáč a dej do trouby\n4️⃣ Po 20 minutách promíchej\n5️⃣ Přidej sýr a zapeč dalších cca 10 minut\n6️⃣ Vytáhni a jez \n\n👉 Každá trouba peče jinak, takže se čas může lišit, důležité je, aby byly brambory hotové ✅️\n\n👉 Sleduj mě pro další jednoduchý, funkční jídla, co zvládneš i po dlouhým dni 💪\n\n#jidlo #recept #hubnuti", "title": "Zapékané brambory s kuřecím a sýrem", "title_orig": "", "category": "Hlavní jídlo", "tags": ["kuřecí", "brambory", "sýr", "do trouby", "jeden plech", "jednoduché", "high-protein"], "ingredients": ["Brambory", "Kuřecí prsa", "Cibule", "Česnek", "Koření na kuře, sůl, pepř", "Sýr (mozzarella / čedar / cokoliv)"], "steps": ["Brambory, kuře, cibuli a česnek nakrájet na kousky", "Smíchat s kořením a rozložit na pekáč", "Péct v troubě, po 20 minutách promíchat", "Přidat sýr a zapéct dalších cca 10 minut"], "recipe": "full", "note": "Množství neuvedeno; čas se liší podle trouby", "time_min": 30, "unsure": false, "servings": null}, {"i": 79, "url": "https://www.instagram.com/reel/DP5r542Em_G/", "author": "recipesbyvictoria", "caption": "CRISPY DUMPLING SPIRAL 🔥 Comment “YUM” and I’ll send you the full recipe with access to my whole archive. Crispy on the bottom, juicy in the middle and ridiculously fun to make!", "title": "Křupavá knedlíková spirála", "title_orig": "Crispy Dumpling Spiral", "category": "Snack / předkrm", "tags": ["knedlíčky", "asijské", "křupavé", "předkrm"], "ingredients": [], "steps": [], "recipe": "none", "note": "Recept posílá autor po komentáři „YUM“", "time_min": null, "unsure": false, "servings": null}, {"i": 80, "url": "https://www.instagram.com/reel/DSFefMmlvsV/", "author": "kalejunkie", "caption": "@kalejunkie 🥟 the VIRAL DUMPLING “LASAGNA” has got to be one of the best food trends I’ve seen in a while. Why? Bc making dumplings one at a time is time consuming and this is a fun way to make layers and enjoy in ramekins or mugs! You can also add more water than I suggest below and it becomes a soup dumpling!⁣ Please tag the original  creator below so I can give credit! 🥰⁣\n⁣\nComment LINK for my ramekin set—they are so cute and come with covers and make a great holiday gift 🎁!\n⁣\nMakes 4 servings (2 each)⁣\n1 Ib ground pork⁣\n1 cup napa cabbage, chopped⁣\n3 green onions, finely sliced⁣\n1 tb fresh ginger, minced⁣\n2 cloves garlic, mashed⁣\n6 mushrooms, finely chopped⁣\n1/2 tsp baking soda (optional but recommend for fluffier texture!)⁣\n2 tb sesame oil⁣\n2 tb mirin (or shaoxing wine)⁣\n2 tb oyster sauce⁣\n1/4 cup low sodium soy sauce ⁣\n1 package wonton wrappers⁣\nChili oil & green onions for garnish⁣\n⁣\nIn a large bowl, mix the pork with the seasonings and other fillings above. In a mug or ramekin, alternate layers of pork mixture and wonton wrappers until the mug/ramekin is almost full. ⁣\nBefore adding the final layer of wonton wrapper, add 1/3 cup of water. I then like to add two wonton wrappers on top. Steam for 20 minutes.⁣\nAdd chili oil and green onions and enjoy!⁣\n#dumplings #viralfood #foodtrends #dumplinglasagna #soupdumplings #lasagnasoup⁣", "title": "Knedlíková lasagne v hrníčku", "title_orig": "Viral Dumpling Lasagna", "category": "Hlavní jídlo", "tags": ["vepřové", "mleté maso", "knedlíčky", "asijské", "dumplings", "na páře", "lasagne"], "ingredients": ["450 g mletého vepřového", "70 g nasekaného pekingského zelí", "3 jarní cibulky", "1 lžíce čerstvého zázvoru", "2 stroužky česneku", "6 žampionů, najemno", "1/2 lžičky jedlé sody (volitelně)", "2 lžíce sezamového oleje", "2 lžíce mirinu (nebo shaoxing vína)", "2 lžíce ústřičné omáčky", "60 ml sójové omáčky se sníženým obsahem soli", "1 balení plátků wonton", "Chilli olej a jarní cibulka na ozdobu"], "steps": ["Maso smíchat se všemi ingrediencemi náplně", "V hrnku nebo ramekinu střídat vrstvy masa a plátků wonton skoro až po okraj", "Před poslední vrstvou přidat 1/3 hrnku (cca 80 ml) vody, navrch 2 plátky", "Dusit v páře 20 minut", "Podávat s chilli olejem a jarní cibulkou"], "recipe": "full", "note": "4 porce (po 2 ks). S více vody vznikne polévka", "time_min": 20, "unsure": false, "servings": 4}, {"i": 81, "url": "https://www.instagram.com/reel/DRzuPbqiNJZ/", "author": "janakrejcova_", "caption": "⭐ Pistáciové linecké – recept\n\nIngredience (cca 35–45 kusů podle velikosti)\n\nTěsto:\n\t•\t150 g hladké mouky\n\t•\t80 g mletých pistácií (nesolených)\n\t•\t100 g másla (studeného)\n\t•\t60 g moučkového cukru\n\t•\t1 žloutek\n\t•\tšpetka soli\n\nNáplň:\n\t•\tpistáciový krém (např. 100% pistáciová pasta smíchaná s trochou bílé čokolády)\nnebo\n\t•\tkvalitní marmeláda (nejlépe malinová či citronová)\n\n⸻\n\n🍪 Postup\n\t1.\tSmíchej suché suroviny – mouku, mleté pistácie, cukr a sůl.\n\t2.\tPřidej na kostičky nakrájené studené máslo a žloutek.\n\t3.\tRychle vypracuj hladké těsto. Pokud se drolí, pomůže lžička studené vody nebo pistáciové pasty.\n\t4.\tTěsto zabal a dej odležet min. na 1 hodinu do lednice (klidně i přes noc).\n\t5.\tTroubu předehřej na 170 °C.\n\t6.\tTěsto na pomoučené pracovní desce vyválej na 3–4 mm.\n\t7.\tVykrajuj libovolné tvary a přenes je na plech s pečícím papírem.\n\t8.\tPeč cca 7–9 minut, dokud okraje jen lehce nezlátnou.\n\t9.\tNech vychladnout a slepuj marmeládou nebo pistáciovým krémem.\n\t10.\tMůžeš posypat jemně mletými pistáciemi nebo poprášit cukrem.\n\n⭐ Pistáciová náplň \n\nSuroviny\n\t•\t120 g bílé čokolády\n\t•\t80-90 g pistáciové pasty\n\n⸻\n\nPostup\n\t1.\tBílou čokoládu rozpusť ve vodní lázni nebo v mikrovlnce (po 20–30 s krátkých intervalech, aby se nespálila).\n\t2.\tTrochu zchladlou, ale stále tekutou čokoládu smíchej s pistáciovou pastou.\n\t3.\tMíchej, dokud nevznikne hladký, lesklý krém.\ : "rebi.steffi", "caption": "Photo by Rebeka Šteffeková on November 09, 2025.", "title": "Skořicoví šneci", "title_orig": "", "category": "Sladké", "tags": ["sladké", "kynuté těsto", "skořice", "pečivo", "do trouby"], "ingredients": [], "steps": [], "recipe": "none", "note": "Podle náhledu videu. Recept jen ve videu.", "time_min": null, "unsure": false, "servings": null}, {"i": 97, "url": "https://www.instagram.com/reel/DMx5yotNsty/", "author": "healthbycaroline", "caption": "My nutritionist can be a real bore sometimes but her recipes always hit 👌 \n\nRed pepper and tomato pasta 🍅🌶️🍝\n\nServes 3! You will need…\n250g pasta (uncooked)\n2 red peppers\n300g tomatoes\n5 garlic cloves\n1 generous tsp dried basil\n100g ricotta\n1 tbsp olive oil\n1 x 400g tin cannellini beans (drained and rinsed)\n20g parmesan (grated)\n\n1. Preheat your oven to 200’C.\n2. Roughly chop the peppers and add to a roasting dish with the tomatoes, garlic cloves and basil. Season with salt and pepper. Drizzle over the olive oil, toss everything together and roast for about 25 minutes until the vegetables have softened and are starting to char.\n3. Remove from the oven and allow to cool, then blend with the ricotta until smooth.\n4. Cook the pasta according to packet instructions, then drain (reserving a mug of pasta water).\n5. Add the sauce to a pan and heat through, then tip in the cooked pasta, the drained beans and the parmesan. Add a splash of pasta water and stir everything together, letting it all cook for a few minutes until the parmesan has melted into the sauce and everything is heated through.\n6. Season to taste, then serve with an extra grating of parmesan on top.", "title": "Těstoviny s pečenou paprikou a rajčaty", "title_orig": "Red pepper and tomato pasta", "category": "Hlavní jídlo", "tags": ["těstoviny", "paprika", "rajčata", "ricotta", "fazole", "vegetariánské", "do trouby", "zdravé"], "ingredients": ["250 g těstovin (suchých)", "2 červené papriky", "300 g rajčat", "5 stroužků česneku", "1 vrchovatá lžička sušené bazalky", "100 g ricotty", "1 lžíce olivového oleje", "1 plechovka (400 g) cannellini fazolí, odkapaných", "20 g strouhaného parmezánu", "sůl, pepř"], "steps": ["Předehřát troubu na 200 °C", "Papriky nahrubo nakrájet, dát s rajčaty, česnekem a bazalkou do pekáče, osolit, opepřit, pokapat olejem a péct cca 25 minut do změknutí", "Vychladlé rozmixovat s ricottou dohladka", "Uvařit těstoviny, nechat hrnek vody z vaření", "Omáčku ohřát na pánvi, přidat těstoviny, fazole a parmezán, podle potřeby zalít vodou z těstovin a pár minut prohřát", "Dochutit a podávat s parmezánem navrch"], "recipe": "full", "note": "3 porce", "time_min": null, "unsure": false, "servings": 3}, {"i": 98, "url": "https://www.instagram.com/reel/DQo8tlLDmrn/", "author": "honzacestuje", "caption": "Lítáš z Prahy a neznáš tuhle restauraci?😱\n\nTak to je chyba, protože lívance za 60 Kč nebo hlavní jídlo od 150 Kč? To jen tak na @pragueairport neseženeš. Jedná se o Restauraci Runway a najdeš ji na Terminálu 1 a to jak za bezpečnostní kontrolou, tak ve veřejné části. Takže sem můžeš zajít, i když poletíš z Terminálu 2.\n\nS QR kódem z videa dostaneš navíc do konce roku 2026 slevu 20 % na celé jídlo. Tak co, vyzkoušíš jí, až příště poletíš?\n\n#spoluprace #pragueairport #letistepraha", "title": "Restaurace Runway na letišti Praha", "title_orig": "", "category": "Ostatní", "tags": ["restaurace", "tip na místo", "praha"], "ingredients": [], "steps": [], "recipe": "none", "note": "Reklamní tip na restauraci, žádný recept", "time_min": null, "unsure": false, "servings": null}, {"i": 99, "url": "https://www.instagram.com/reel/DJyRmcHIJwG/", "author": "wellwithnatie", "caption": "recept na nejlepší tiramisu ✨\n\nPoprvé v životě jsem udělala pravé tiramisu, které od mala doopravdy zbožňuju. Když jsem ho ochutnala, bylo za mě lepší než v restauraci. I doma sklidilo takový úspěch, že se musím podělit o recept!💋\n\n👩🏽‍🍳Ingredience\nCukrářské piškoty \n4 vejce (nejlépe domácí)\n2 mascarpone\n80 g cukru krupice \nŠpetka vanilky\nEspresso\nAmaretto (volitelné)\n\nVajíčka si rozdělíme na bílky a žloutky. Žloutky vyšleháme nad vodní párou s cukrem a vanilkou. Následně přidáme mascarpone a následně i vyšlehané bílky. \nPiškoty namočíme v kávě (můžeme přidat i amaretto) a vrstvíme do misky. Já dala dvě vrstvy piškotů a krému. \nTiramisu necháme přes noc v lednici, poté posypeme kakaem a můžeme si ho vychutnat! \nDobrou chuť!🫶🏻\n\n#recept #tiramisu #inspirace #zdravyzivotnistyl #dezert #peceni #recipes #baking #viralreel", "title": "Tiramisu", "title_orig": "Nejlepší tiramisu", "category": "Sladké", "tags": ["tiramisu", "mascarpone", "dezert", "italské", "bez pečení", "káva", "vejce"], "ingredients": ["cukrářské piškoty", "4 vejce", "2 balení mascarpone", "80 g krupicového cukru", "špetka vanilky", "espresso", "amaretto (volitelné)", "kakao na posypání"], "steps": ["Vejce rozdělit na bílky a žloutky", "Žloutky vyšlehat nad párou s cukrem a vanilkou", "Přidat mascarpone a pak vyšlehané bílky", "Piškoty namočit v kávě (případně s amarettem) a vrstvit do misky, 2 vrstvy piškotů a krému", "Přes noc v lednici, před podáváním posypat kakaem"], "recipe": "full", "note": "Množství mascarpone a piškotů není přesně uvedeno", "time_min": null, "unsure": false, "servings": null}, {"i": 100, "url": "https://www.instagram.com/reel/DQV-kjmDez2/", "author": "jindrich_ton", "caption": "Kuřecí stripsy😁👌\n\nTenhle kuřecí wrap z horkovzdušné fritézy je absolutní top 🤤\nKřupavý stripsy, domácí dresink a všechno hotový za pár minut 🙌\nPoužil jsem svou horkovzdušnou fritézu od @cosori_cz_sk , která to zvládla dokonale 🔥\nA s kódem JINDRA15 máš slevu 15 % na svůj vlastní kousek 😁\n*spoluprace\n\nIngredience:\n2 kuřecí prsa na proužky \n1 vejce\n2 lžíce bílého jogurtu \n1/2 lžičky sladké papriky a sušeného česneku\nSůl, pepř\nKukuřičné lupínky na obalení \nOlej ve spreji\nSalát\nTortilly \nDresink:\n2 lžíce zakysané smetany\n1-2 lžíce majonézy \n1 lžička hořčice\n1-2 st a trochu víc, tak nechte klidně 7 minut. \n\nNa 4 vejce\n80ml sojovky\n80ml vody \n2 lžíce rýžového octa\n1 stroužek česneku\n2-4 plátky zázvoru\n1 lžíce třtinového cukru, či 1 lžíce javorového sirupu\n2 lžíce mirinu (nemusíte)\n1 lžička sušeného chilli\n1 jarní cibulka\nSezam\n\nMůžete použít třeba i řasu kombu, či saké místo vody.  Moc díky @playstation_cz že mi kryjete záda a dáváte @dorota_dostalova čas si ode mě odpočinout.\n\nVeškerý nákup mám klasicky z @rohlik.cz kde seženeš i suroviny jako mirin, saké či rýžový ocet!:)\n\n#gifted #recept #jídlo #food #recipe #playstation #ghostofyotai #foodie #gamer", "title": "Naložená vejce Ajitsuke Tamago", "title_orig": "Ajitsuke Tamago", "category": "Snack / předkrm", "tags": ["vejce", "asijské", "japonské", "marinované", "ramen", "nakládané"], "ingredients": ["4 vejce", "80 ml sójové omáčky", "80 ml vody", "2 lžíce rýžového octa", "1 stroužek česneku", "2–4 plátky zázvoru", "1 lžíce třtinového cukru nebo javorového sirupu", "2 lžíce mirinu (volitelně)", "1 lžička sušeného chilli", "1 jarní cibulka", "sezam"], "steps": ["Uvařit vejce (pro méně uvařená cca 7 minut)", "Smíchat marinádu a vejce v ní nechat 12–24 hodin, ponořená (přikrýt fólií) a občas otočit"], "recipe": "full", "note": "Marinovat 12–24 h; místo vody lze saké nebo kombu", "time_min": null, "unsure": false, "servings": null}, {"i": 105, "url": "https://www.instagram.com/reel/DNqdFXGo9cu/", "author": "receptyodanicky", "caption": "Recept na švédské masové kuličky jako z Ikey mám na blogu už docela dlouho, ale ono je vás tu od té doby spoustu nových a není na škodu si zrovna tenhle recept připomenout. \n\nNa masové kuličky:\n1 lžíce řepkového oleje\n500 g mletého krůtího masa\n1 žlutá cibule\n3 stroužky česneku\n1 vejce (velikost M)\n115 g strouhanky\n5 lžic plnotučného mléka\n1 lžička soli\n\nNa omáčku:\n45 g másla\n45 g hladké mouky\n200 ml smetany ke šlehání\n400 ml masového vývaru\n1/4 lžičky muškátového oříšku\n2 lžičky tmavé sojové omáčky\n1 lžička dijonské hořčice\n\nK podávání:\nbramborová kaše\nhrášek\nbrusinky\n\nCelý postup, jak si recept připravit, mám na blogu. Hledejte recept s názvem “Švédské masové kuličky”.\n\n#recept #recepty #trend #ikeameatballs #viral #food #vareni #dinnerinspo #cooking #foodinspo #snadnerecepty #receptyodanicky", "title": "Švédské masové kuličky", "title_orig": "Švédské masové kuličky jako z Ikey", "category": "Hlavní jídlo", "tags": ["krůtí", "mleté maso", "kuličky", "švédské", "bramborová kaše", "smetanová omáčka"], "ingredients": ["Kuličky: 1 lžíce řepkového oleje", "Kuličky: 500 g mletého krůtího masa", "Kuličky: 1 žlutá cibule", "Kuličky: 3 stroužky česneku", "Kuličky: 1 vejce (M)", "Kuličky: 115 g strouhanky", "Kuličky: 5 lžic plnotučného mléka", "Kuličky: 1 lžička soli", "Omáčka: 45 g másla", "Omáčka: 45 g hladké mouky", "Omáčka: 200 ml smetany ke šlehání", "Omáčka: 400 ml masového vývaru", "Omáčka: 1/4 lžičky muškátového oříšku", "Omáčka: 2 lžičky tmavé sojové omáčky", "Omáčka: 1 lžička dijonské hořčice", "K podávání: bramborová kaše, hrášek, brusinky"], "steps": [], "recipe": "ingredients", "note": "Celý postup na blogu autorky (hledat Švédské masové kuličky)", "time_min": null, "unsure": false, "servings": null}, {"i": 106, "url": "https://www.instagram.com/reel/DJvIYltMKVW/", "author": "prontoyyc", "caption": "Lets make pasta con ricotta e pistacchio!! #pizza #pasta #italianfood #dinnertime #calgary", "title": "Těstoviny s ricottou a pistáciemi", "title_orig": "Pasta con ricotta e pistacchio", "category": "Hlavní jídlo", "tags": ["těstoviny", "ricotta", "pistácie", "italské", "vegetariánské"], "ingredients": ["těstoviny", "ricotta", "pistácie"], "steps": [], "recipe": "partial", "note": "Jen název, množství a postup chybí", "time_min": null, "unsure": false, "servings": null}, {"i": 107, "url": "https://www.instagram.com/reel/DPBoNcZiHNN/", "author": "ceskazceska", "caption": "Vsadím se, že tuhle jednoduchou tvarohovou buchtu s jablky budete péct pořád dokola a dokola. Tak, jako to dělám já už několikátý podzim. 😍👌\n\nJe vláčná, krásně voní po skořici a navíc je hotová raz dva. Tvaroh jí dodá jemnost, jablka šťavnatost a máslo se skořicí neodolatelnou chuť.\nIdeální na podzimní víkend ke kávě nebo čaji. 🍂☕\n\nPotřebujete:\n250 g měkkého tučného tvarohu\n100 g másla\n150 g moučkového cukru\n1 prášek do pečiva\n3 vejce od spokojených slepic (vejce označená 0 nebo 1)\n250 g polohrubé mouky\n4 velká jablka\nskořice podle chuti\n\n1. V míse utřu tvaroh s moučkovým cukrem, změklým máslem a vejci.\n2. Vmíchám mouku, prášek do pečiva a skořici.\n3. Přidám oloupaná a na kostičky nakrájená jablka.\n4. Těsto vliji do vymazané a vysypané formy, vložím do trouby a peču na 170 °C asi 30 min.\n\nRecept si určitě uložte a sledujte @ceskazceska pro víc jednoduchých a sezónních dobrot!♥️\n\n#recept #recepty #rychlyrecept #jablka #milujipeceni #podzim #sezonnisuroviny", "title": "Tvarohová buchta s jablky", "title_orig": "Tvarohová buchta s jablky", "category": "Sladké", "tags": ["tvaroh", "jablka", "buchta", "skořice", "pečení", "podzim", "vegetariánské", "do trouby"], "ingredients": ["250 g měkkého tučného tvarohu", "100 g másla", "150 g moučkového cukru", "1 prášek do pečiva", "3 vejce", "250 g polohrubé mouky", "4 velká jablka", "skořice podle chuti"], "steps": ["Utřít tvaroh s cukrem, změklým máslem a vejci", "Vmíchat mouku, prášek do pečiva a skořici", "Přidat oloupaná jablka na kostičky", "Vlít do vymazané vysypané formy a péct při 170 °C cca 30 minut"], "recipe": "full", "note": "", "time_min": 30, "unsure": false, "servings": null}, {"i": 108, "url": "https://www.instagram.com/reel/DPYKvwTjKPu/", "author": "katerinadolezelovaaa", "caption": "Trhané vepřové s 🥕 a bramborovou kaší! 🫶🏼\n\nNa marinádu:\nNajemno cibulka (nebo lžičku sušené)\nNajemno dva stroužky česneku (nebo lžička sušeného)\nLžíce javorové sirupu nebo medu\nLžička cukru\nLžička soli\nLžička uzené papriky \nLžička sojovky\nLžička skořice \nPepř od oka\n10 lžic krájených rajčat (cca půlka plechovky)\nLžíce kečupu \nLžička hořčice \nLžička protlaku\nDvě lžíce oleje \n\nMaso (vepřová plec) do omáčky naložit a nechat přes noc v lednici. Druhý den maso dejte do pekáče (já přidala ještě trochu těch krájených rajčat), podlijte trošku vodou nebo vývarem a nechte hodinu zakryté péct na 200 stupňů. Po hodině snižte na 150 stupňů a nechte péct další hodinu. Občas maso přelijte omáčku a pokud se vypaří - podlijte opět vodou nebo vývarem. Po těch dvou hodinách přidejte nakrájenou mrkev, opět přelijte omáčkou maso a nechce péct ještě cc další 2 hodiny. (Já to nechávám posledních 45 minut odkryté už). Celková doba pečení je tedy cca 4 hodiny. Nakonec maso vidličkami roztrhejte. \n\nK tomu udělejte krémovou bramborovou kaši nebo dejte do burgerů a dobrou chuť! 🤎\n\n#comfordfood #cozyfood #foodie #recipe", "title": "Trhané vepřové s mrkví a bramborovou kaší", "title_orig": "Trhané vepřové", "category": "Hlavní jídlo", "tags": ["vepřové", "vepřová plec", "trhané maso", "bramborová kaše", "do trouby", "marináda", "comfort food"], "ingredients": ["vepřová plec", "Marináda: cibulka najemno (nebo lžička sušené)", "2 stroužky česneku (nebo lžička sušeného)", "1 lžíce javorového sirupu nebo medu", "1 lžička cukru", "1 lžička soli", "1 lžička uzené papriky", "1 lžička sójové omáčky", "1 lžička skořice", "pepř podle chuti", "10 lžic krájených rajčat (cca půl plechovky)", "1 lžíce kečupu", "1 lžička hořčice", "1 lžička protlaku", "2 lžíce oleje", "mrkev", "bramborová kaše"], "steps": ["Maso naložit do marinády a nechat přes noc v lednici", "Dát do pekáče, podlít trochou vody nebo vývaru, péct hodinu zakryté na 200 °C", "Snížit na 150 °C a péct další hodinu, občas přelít omáčkou", "Přidat nakrájenou mrkev a péct dál, posledních 45 min odkryté", "Celkem cca 4 hodiny, maso nakonec roztrhat vidličkami", "Podávat s bramborovou kaší nebo v burgeru"], "recipe": "full", "note": "Celková doba pečení cca 4 hodiny + noc marinování", "time_min": 240, "unsure": false, "servings": null}, {"i": 109, "url": "https://www.instagram.com/reel/DMfmxbetGor/", "author": "helenemoo", "caption": "Have you tried these yet?? ❤️‍🔥 One of the things I’m most confident about is my cinnamon and cardamom buns, and after I shared this recipe with you last year, I’m even more confident now thanks to your feedback hahaha 😭  Let me know what you think if you try it, and if there’s a way to make them even better!!\n\nHere’s the full recipe (step by step and all the secret tricks is in the video)\n\n30 buns (make half if want 15)\n1020 g / 8.5 cups flour\n1 package dry yeast (13 g)\n200 g / 1 cup sugar\n3 tsp freshly ground cardamom \n1 tsp cinnamon\n\n*mix*\n\nadd 2 eggs and \n5-6 dl / 2-2.5 cups water \n\n*mix*\n\nadd 200 g soft butter\n\nRise for 1 hour\n\n*the best* cinnamon and cardamom filling:\n200 g butter\n200 g brown sugar\n4 tbs cinnamon\n2 tbs freshly ground cardamom\n2 tsp vanilla sugar\n1 tsp salt (or more) \n\nRise for another 30 minutes before the oven \n\nBake for 9-11 minutes until golden at 225°C (435°F) no fan. Brush with melted butter straight after the oven. Happy baking!! 💓", "title": "Skořicovo-kardamomové buchty", "title_orig": "Cinnamon and cardamom buns", "category": "Sladké", "tags": ["pečivo", "skořice", "kardamom", "kynuté těsto", "sladké", "skandinávské", "vegetariánské"], "ingredients": ["Těsto: 1020 g (8,5 hrnku) mouky", "1 balení sušeného droždí (13 g)", "200 g (1 hrnek) cukru", "3 lžičky čerstvě mletého kardamomu", "1 lžička skořice", "2 vejce", "500–600 ml vody", "200 g změklého másla", "Náplň: 200 g másla", "Náplň: 200 g hnědého cukru", "Náplň: 4 lžíce skořice", "Náplň: 2 lžíce čerstvě mletého kardamomu", "Náplň: 2 lžičky vanilkového cukru", "Náplň: 1 lžička soli (nebo víc)", "rozpuštěné máslo na potření"], "steps": ["Smíchat mouku, droždí, cukr, kardamom a skořici", "Přidat vejce a vodu, promíchat, pak přidat máslo", "Kynout 1 hodinu", "Naplnit náplní a tvarovat, dokynout dalších 30 minut", "Péct 9–11 minut při 225 °C bez horkého vzduchu", "Hned po upečení potřít rozpuštěným máslem"], "recipe": "full", "note": "Dávka na 30 buchet (půlku pro 15)", "time_min": null, "unsure": false, "servings": 30}, {"i": 110, "url": "https://www.instagram.com/reel/DPO-YjwCNDh/", "author": "_klaraberisha", "caption": "Ingredience\n\nNa knedlíčky:\n\t•\t12–15 plátků rýžového papíru\n\t•\t250 g mletého kuřecího masa\n\t•\t1 lžíce česneku (strouhaného nebo nasekaného) - já použila sušený\n\t•\t3–4 jarní cibulky (najemno nasekané)\n\t•\t1 lžíce sójové omáčky\n\t•\t1 lžíce ústřicové omáčky\n\t•\t2 lžičky sezamového oleje\n\t•\t2 lžičky kukuřičného škrobu\n\t•\t¼ lžičky soli (nebo podle chuti)\n\t•\t¼ lžičky bílého nebo černého pepře\n\nNa dip:\n\t•\t2 lžíce sójové omáčky\n\t•\t1 lžíce rýžového octa nebo citronové šťávy\n\t•\t1 lžička medu\n\t•\tchilli flakes, sezamový semínka", "title": "Rýžové papírové knedlíčky s kuřecím masem", "title_orig": "", "category": "Snack / předkrm", "tags": ["kuřecí", "mleté maso", "rýžový papír", "asijské", "knedlíčky", "dip"], "ingredients": ["12–15 plátků rýžového papíru", "250 g mletého kuřecího masa", "1 lžíce česneku (strouhaného nebo sušeného)", "3–4 jarní cibulky najemno", "1 lžíce sójové omáčky", "1 lžíce ústřicové omáčky", "2 lžičky sezamového oleje", "2 lžičky kukuřičného škrobu", "1/4 lžičky soli", "1/4 lžičky pepře", "Dip: 2 lžíce sójové omáčky", "Dip: 1 lžíce rýžového octa nebo citronové šťávy", "Dip: 1 lžička medu", "Dip: chilli vločky, sezam"], "steps": [], "recipe": "ingredients", "note": "Postup v captionu chybí", "time_min": null, "unsure": true, "servings": null}, {"i": 111, "url": "https://www.instagram.com/reel/DOlxHtQiZag/", "author": "autumrainn", "caption": "cinnamon apple pastries 🍎🍂 so yum with caramel drizzled on top too! this is a recipe from @thelittleblogofvegan I found on pinterest that I knew I had to try, such a fun idea for fall baking :’) \n\n(this was my first time trying out gluten free puff pastry!! it didn’t rise as much as regular puff pastry would but still turned out yummy!)\n\nfall desserts, autumn foods, baking videos #falltreats #autumnbaking #falldesserts", "title": "Skořicové jablečné pečivo", "title_orig": "Cinnamon apple pastries", "category": "Sladké", "tags": ["jablka", "skořice", "listové těsto", "karamel", "podzim", "sladké", "bezlepkové"], "ingredients": [], "steps": [], "recipe": "none", "note": "Recept od @thelittleblogofvegan; použito bezlepkové listové těsto", "time_min": null, "unsure": false, "servings": null}, {"i": 112, "url": "https://www.instagram.com/reel/DM0YJx7KTu3/", "author": "dea_incucina_", "caption": "HOW to make – Real Italian Gnocchi 🍅🇮🇹\nIn Italy, gnocchi aren’t just pasta. They’re comfort, tradition, and Sunday at nonna’s.\n\n1️⃣ Boil the potatoes\n2️⃣ Mash & mix with egg, salt, and flour\n3️⃣ Cut and shape each gnocco with care\n4️⃣ Boil until they float\n5️⃣ Mix with tomato sauce, mozzarella & basil\n6️⃣ Bake until golden and bubbly\n\nGnocchi might look simple. But here, it’s love in every bite.\n\n⚠️ Tag someone who calls them “no-kee” 😅👇\nAnd tell me—what do you put on your gnocchi?\n\n📹: @altro.agency\n🌐 Make it in Sorrento: deaincucina.com\n\n#HowItsMade #DEAincucina #ItalianGnocchi #GnocchiRecipe #SorrentoFood #ComfortFoodItalianStyle #NonnaApproved", "title": "Italské gnocchi zapečené s rajčatovou omáčkou", "title_orig": "Real Italian Gnocchi", "category": "Hlavní jídlo", "tags": ["gnocchi", "brambory", "mozzarella", "italské", "do trouby", "rajčatová omáčka"], "ingredients": ["brambory", "vejce", "sůl", "mouka", "rajčatová omáčka", "mozzarella", "bazalka"], "steps": ["Uvařit brambory", "Rozmačkat, smíchat s vejcem, solí a moukou", "Nakrájet a vytvarovat gnocchi", "Vařit, dokud nevyplavou", "Smíchat s rajčatovou omáčkou, mozzarellou a bazalkou", "Zapéct dozlatova"], "recipe": "partial", "note": "Množství nejsou uvedena", "time_min": null, "unsure": false, "servings": null}, {"i": 113, "url": "https://www.instagram.com/reel/DOWZfQ9CNFn/", "author": "dr.vegan", "caption": "One Pan Creamy Tomato Spinach Pasta\n\nWhat you’ll need:\n🍅 Cherry tomatoes\n🧅 Red onion\n🌱 Fresh spinach\n🧄 Garlic\n🥛 Plant-based cream + veggie broth\n🍝 Tagliatelle (or spaghetti)\n\t•\therbs, chili flakes, olive oil, salt & pepper\n\nLayer everything in one pan, pour in the liquids, cook covered, then finish in a silky tomato sauce 🙌\n\n𝐅𝐔𝐋𝐋 𝐑𝐄𝐂𝐈𝐏𝐄 𝐎𝐍 𝐌𝐘 𝐁𝐋𝐎𝐆\n𝐃𝐫𝐯𝐞𝐠𝐚𝐧𝐛𝐥𝐨𝐠 𝐝𝐨𝐭 𝐜𝐨𝐦 (𝐋𝐈𝐍𝐊 𝐈𝐍 𝐌𝐘 𝐁𝐈𝐎)\n\n#veganmeal #veggierecipes #pasta #quickrecipes #vegan #veggie #veganrecipes #onepotmeal #pastalover #pastapasta #pastarecipe #tomatopasta #easyrecipes #healthy #quickrecipe #veganlunch #veganfood #veganrecipe #pasta🍝 #easyrecipe #healthyfoods #quickrecipe #vegetarianrecipes #easyfood #vegancomfortfood #vegetarian #lazyvegan #easyrecipes #easyveganmeals #vegandinner", "title": "Krémové těstoviny s rajčaty a špenátem na jedné pánvi", "title_orig": "One Pan Creamy Tomato Spinach Pasta", "category": "Hlavní jídlo", "tags": ["těstoviny", "veganské", "vegetariánské", "jeden hrnec", "špenát", "rajčata", "rychlovka"], "ingredients": ["cherry rajčata", "červená cibule", "čerstvý špenát", "česnek", "rostlinná smetana", "zeleninový vývar", "tagliatelle (nebo špagety)", "bylinky, chilli vločky, olivový olej, sůl, pepř"], "steps": ["Vše vrstvit do jedné pánve", "Zalít tekutinami, vařit pod pokličkou", "Dokončit v hedvábné rajčatové omáčce"], "recipe": "ingredients", "note": "Celý recept na blogu autora (odkaz v biu), množství nejsou uvedena", "time_min": null, "unsure": false, "servings": null}, {"i": 114, "url": "https://www.instagram.com/reel/DOf1NUuiGZF/", "author": "anetjiskra", "caption": "Dneska si spolu upečeme (tedy spíš usmažíme 😅) jednoduché skořicové donuty 😍\n\nNa těsto:\n480 g hladké mouky\n70 g cukru krupice\n7 g sušeného droždí (1 sáček)\n1 a ½ lžičky mleté skořice\n½ lžičky soli\n250 ml vlažného mléka\n60 g rozpuštěného másla\n2 celá vejce\n1 lžička vanilkového extraktu (volitelné)\n\nNa smažení:\nolej (např. slunečnicový), dostatek na ponoření\n\nNa obalení:\n100 g cukru krupice\n1–2 lžičky mleté skořice.\n\nPostup:\n\nV malé misce smíchej 1 lžičku cukru, sušené droždí a vlažné mléko. Nech 10 minut stát, dokud nezačne pěnit.\n\nV míse smíchej mouku (já si nechala ještě cca 100g bokem a přisypávala jsem pak do robota), zbytek cukru, skořici a sůl. Přidej kvásek, vejce, rozpuštěné máslo a vanilku. Vypracuj hladké těsto - robotem asi 6–8 minut, ručně o něco déle. Mělo by být jemné a pružné, ale ne příliš lepivé. Přendej ještě na vál a rukama propracuj, cca 5 minut. \n\nTěsto dej do olejem vymazané misky přikryj čistou utěrkou a nech kynout na teplém místě cca hodinu a půl minut, až zdvojnásobí objem.\n\nTěsto vyválej na pomoučené ploše na tloušťku cca 1,5–2 cm. Vykrajuj donuty (např. sklenicí a malým víčkem na díru uprostřed). Donuty přendej na nastříhaný pečící papír a dej opět pod útěrku kynout na cca 15-20 minut. \n\nRozehřej olej na 170–180 °C. Donuty smaž cca 1 minutu z každé strany dozlatova. Opatrně vyndej a nech okapat na papírové utěrce.\n\nJeště teplé donuty balte ve směsi cukru a skořice.\n\nDobrou chuť!\n\n#donuty#recept#hannetonmonde", "title": "Skořicové donuty", "title_orig": "Skořicové donuty", "category": "Sladké", "tags": ["donuty", "skořice", "kynuté těsto", "smažené", "sladké", "vegetariánské"], "ingredients": ["Těsto: 480 g hladké mouky", "70 g krupicového cukru", "7 g sušeného droždí", "1,5 lžičky mleté skořice", "1/2 lžičky soli", "250 ml vlažného mléka", "60 g rozpuštěného másla", "2 vejce", "1 lžička vanilkového extraktu (volitelně)", "Smažení: olej na ponoření", "Obalení: 100 g krupicového cukru", "Obalení: 1–2 lžičky mleté skořice"], "steps": ["Smíchat 1 lžičku cukru, droždí a mléko, nechat 10 minut do pěny", "Smíchat mouku, cukr, skořici a sůl, přidat kvásek, vejce, máslo a vanilku", "Vypracovat těsto (robotem 6–8 min, ručně déle) a ještě 5 minut propracovat na válu", "Kynout na teplém místě cca 1,5 hodiny do zdvojnásobení", "Vyválet na 1,5–2 cm, vykrajovat donuty, nechat dokynout 15–20 minut", "Rozehřát olej na 170–180 °C, smažit cca 1 minutu z každé strany", "Okapat a ještě teplé obalit ve směsi cukru a skořice"], "recipe": "full", "note": "", "time_min": null, "unsure": false, "servings": null}, {"i": 115, "url": "https://www.instagram.com/reel/DN8AfMGDHHE/", "author": "mammamia.meme", "caption": "Mamma Mia! Choosing pasta feels like choosing your destiny 🍝✨\n.\n.\n.\n.\n.\n.\n#pastapasta #pasta #italianpasta\n#italygram #italianmarket #italy #italia\n#solana #mammamiatoken #meme #memecoin #memecoins \n#italiandoitbetter #italianfood \n#italianfoodporn", "title": "Meme o těstovinách", "title_orig": "Mamma Mia! Choosing pasta...", "category": "Ostatní", "tags": ["meme", "těstoviny"], "ingredients": [], "steps": [], "recipe": "none", "note": "Nejde o recept, jen meme", "time_min": null, "unsure": false, "servings": null}, {"i": 116, "url": "https://www.instagram.com/reel/CxlZ-GyLPE_/", "author": "the_cotchi", "caption": "👨🏼‍🍳Pistáciové máslo\n\n📍Máslo hotové ze dvou ingrediencí: pistácie a sůl. Jestli jsi líný/á stejně jako já, určitě si kup už vyloupané! Potom je stačí toastnout v troubě 10 minutek a protřít v útěrce, protože když se zbavíš slupek, bude máslo zelenější. Určitě mixuj v intervalech, aby se ti nepřehřála mašina. Poslední tip, čím déle budeš mixovat, tím bude máslo řidší!\n\n📍Ingredience:\n- 400g pistácie\n- 1/2 lžičky soli", "title": "Pistáciové máslo", "title_orig": "Pistáciové máslo", "category": "Omáčka / dip", "tags": ["pistácie", "máslo", "sladké", "vegan", "pasta"], "ingredients": ["400 g pistácií", "1/2 lžičky soli"], "steps": ["Vyloupané pistácie toastovat v troubě 10 minut", "Protřít v utěrce kvůli slupkám", "Mixovat v intervalech, aby se mixér nepřehřál (čím déle, tím řidší máslo)"], "recipe": "full", "note": "", "time_min": null, "unsure": false, "servings": null}, {"i": 117, "url": "https://www.instagram.com/reel/C9P1fLDsjwK/", "author": "the_cotchi", "caption": "👨🏼‍🍳Pistáciový cheesecake\n\n📍Tohle je něco vážení! Opravdu za to stojí. Naprosté nebe v papuli! Ani nevím, kdy jsem naposled dělal celý cheesecake (ještě k tomu pečený), tak jsem rovnou udělal takovou bombu.\n\n📍Možná se bude zdát, že je tento cheesecake náročný, ale ve skutečnosti je to úplná pohodička! Video je natočené chronologicky, takže můžes postupovat zároveň semnou.\n\n❗️Péct na 125 stupňů 70 minut, poté vypnout troubu a nechat ještě 60 minut uvnitř. Díky tomu se cheesecake nepropadne ani nepopraská.❗️\n\n❗️Je možné, že máslo z korpusu trochu proteče formou, takže popřípadě podložit plechem nebo obalit alobalem❗️\n\n📍Korpus:\n- 125g Digestive sušenky\n- 50g pistácie (nesolené)\n- 130g másla\n\n📍Pistáciový krém:\n- 120g pistáciového másla (předchozí recept)\n- 80g bílé čokolády\n\n📍Krém:\n- 600g krémového sýru (dal jsem philadelphia)\n- 80g cukru krystal\n- 20g vanilkového cukru (1 balení)\n- 1 lžíce vanilkové pasty\n- 200g pistáciový krém\n- 40 g kukuřičného škrobu\n- 3 vejce\n\n📍Poleva:\n- 60g pistáciového másla\n- 80g smetany ke šlehání\n- 50g bílé čokolády\n- 10g cukru moučka (můžeš vynechat)\n\n📍Posyp\n- pistácie (nesolené)\n- maliny sušené mrazem\n\n#cheesecake #pistacchio #pistacie #homemade #sweet #delicious #yummy #treat #dinner #lunch #peceni #bake", "title": "Pistáciový cheesecake", "title_orig": "Pistáciový cheesecake", "category": "Sladké", "tags": ["cheesecake", "pistácie", "pečení", "sýr", "sladké", "dezert", "vegetariánské"], "ingredients": ["Korpus: 125 g digestive sušenek", "Korpus: 50 g nesolených pistácií", "Korpus: 130 g másla", "Pistáciový krém: 120 g pistáciového másla", "Pistáciový krém: 80 g bílé čokolády", "Krém: 600 g krémového sýru (Philadelphia)", "Krém: 80 g krystalového cukru", "Krém: 20 g vanilkového cukru", "Krém: 1 lžíce vanilkové pasty", "Krém: 200 g pistáciového krému", "Krém: 40 g kukuřičného škrobu", "Krém: 3 vejce", "Poleva: 60 g pistáciového másla", "Poleva: 80 g smetany ke šlehání", "Poleva: 50 g bílé čokolády", "Poleva: 10 g moučkového cukru (volitelně)", "Posyp: pistácie, mrazem sušené maliny"], "steps": ["Péct na 125 °C 70 minut", "Poté troubu vypnout a nechat cheesecake ještě 60 minut uvnitř (nepropadne se ani nepopraská)", "Pozor: máslo z korpusu může protéct formou, podložit plechem nebo obalit alobalem"], "recipe": "full", "note": "Postup přípravy jen ve videu (natočeno chronologicky); pistáciové máslo viz předchozí recept", "time_min": 130, "unsure": false, "servings": null}, {"i": 118, "url": "https://www.instagram.com/reel/DNKbnMzMWnj/", "author": "foodmag.cz", "caption": "Tohohle máme vždycky plný mrazák 😋 Dnešní tip na jídlo z magnetu z naší Asijské sady. #asie #gyoza #restaurace #cesko #vareni #jedlo #jidlo #domacnost #deti #kuchyne #recept #cesky", "title": "Gyoza z asijské sady", "title_orig": "Gyoza", "category": "Snack / předkrm", "tags": ["gyoza", "asijské", "mražené", "tip"], "ingredients": [], "steps": [], "recipe": "none", "note": "Reklamní tip na produkt, bez receptu", "time_min": null, "unsure": false, "servings": null}, {"i": 119, "url": "https://www.instagram.com/reel/DIOicKaNAVH/", "author": "healthiersimple", "caption": "RECIPE BELOW 👇🏼 | Stuffed Chicken Breast\n\nCraving something quick yet delicious? Here’s how I made this stuffed chicken breast.\nFirst, slice the chicken breast in the middle. Then, stuff it with pesto, tomatoes, mozzarella, and oregano.\n\nThe sauce on top is a mix of olive oil, paprika, garlic powder, salt & pepper — simple but full of flavor.\n\nPop it in the air fryer at 200°C for 5 minutes. After that, add the Parmesan on top and cook for another 10-12 minutes. Voila! Perfectly crispy, juicy, and cheesy.\n\nDon’t forget to save this video for later!\n\n#chickenrecipe #airfryerchicken #airfryerrecipe #healthylunchideas\n#EasyRecipe #healthyrecipes", "title": "Plněná kuřecí prsa z airfryeru", "title_orig": "Stuffed Chicken Breast", "category": "Hlavní jídlo", "tags": ["kuřecí", "prsa", "airfryer", "sýr", "mozzarella", "pesto", "high-protein", "rychlovka"], "ingredients": ["kuřecí prsa", "pesto", "rajčata", "mozzarella", "oregano", "parmezán", "Omáčka: olivový olej, paprika, česnekový prášek, sůl, pepř"], "steps": ["Kuřecí prso podélně nařezat", "Naplnit pestem, rajčaty, mozzarellou a oregano", "Potřít omáčkou z oleje, papriky, česneku, soli a pepře", "Péct v airfryeru 5 minut na 200 °C", "Posypat parmezánem a péct dalších 10–12 minut"], "recipe": "full", "note": "Množství nejsou uvedena", "time_min": 17, "unsure": false, "servings": null}, {"i": 120, "url": "https://www.instagram.com/reel/DHcPoiTRxZ0/", "author": "timthetankofficial", "caption": "4 Ingredient Strawberry Banana Pancakes?!", "title": "Jahodovo-banánové lívance ze 4 surovin", "title_orig": "4 Ingredient Strawberry Banana Pancakes", "category": "Snídaně", "tags": ["lívance", "banán", "jahody", "snídaně", "rychlovka", "zdravé"], "ingredients": [], "steps": [], "recipe": "none", "note": "Jen název, bez receptu", "time_min": null, "unsure": false, "servings": null}, {"i": 121, "url": "https://www.instagram.com/reel/DKoaLX-I9AD/", "author": "thyme_4_cooking", "caption": "Sunny eggs meet juicy tomatoes in this simple, soul-warming Breakfast 🥚🍅✨ \n\nFresh tomatoes simmer just enough to release their sweet, tangy juices, blending perfectly with golden fried eggs. Seasoned to perfection and garnished with fresh herbs, it is comfort food with a fresh twist. \n\nIngredients:\n\n-3 tomatoes (halved)\n-5 eggs\n-1 tablespoon extra virgin olive oil\n-1 garlic clove, minced\n-1/2 teaspoon dried oregano \n-salt and pepper, to taste\n-fresh parsley to garnish \n\nInstructions:\n\n1. Heat one tablespoon of oil in a pan, add the tomatoes, cover and cook for 10 minutes until they are soft. If your tomatoes are not so juicy, you can add a little bit of water to the pan.\n2. Peel the skin of the tomatoes and mash them with a wooden fork or spoon. Add the garlic, oregano, season with salt and pepper and give it a mix.\n3. Crack the eggs on top of the sauce, season with a pinch of salt, cover and cook until they are set, about 8-10 minutes.\n4. Season the top with more black pepper and add fresh parsley (or any herb that you like). Enjoy!\n\n#breakfast #easyrecipes #slowmornings #comfortfood #summer #tomatoes #eggs #onepanmeal", "title": "Vejce v rajčatech", "title_orig": "Sunny eggs and tomatoes", "category": "Snídaně", "tags": ["vejce", "rajčata", "snídaně", "jedna pánev", "vegetariánské", "rychlovka"], "ingredients": ["3 rajčata (půlená)", "5 vajec", "1 lžíce extra panenského olivového oleje", "1 stroužek česneku, nasekaný", "1/2 lžičky sušeného oregana", "sůl a pepř", "čerstvá petržel"], "steps": ["Na oleji na pánvi přikryté 10 minut dusit rajčata do změknutí (případně přidat trochu vody)", "Rajčata oloupat, rozmačkat, přidat česnek, oregano, sůl a pepř", "Na omáčku rozklepnout vejce, osolit, přikrýt a vařit 8–10 minut do zatuhnutí", "Posypat pepřem a petrželkou"], "recipe": "full", "note": "", "time_min": 20, "unsure": false, "servings": null}, {"i": 122, "url": "https://www.instagram.com/reel/DLQKCZ1Pdmc/", "author": "recipeincaption", "caption": "Caramelized Onion and Garlic Spaghetti 🔥\n\nFind the full recipe on my free recipe app “Osta Recipes” on the App Store or Google Play store ‼️\n\nComment “Recipe” and I’ll send you the full recipe card for free!!\n\nMinimal effort, max comfort. Sweet, savory, a little spicy... this one hits every note.\n\nTip: Best served with with chicken, shrimp, or tofu 🫡 \n\nIngredients:\n\n-1 large onion, thinly sliced\n-4 garlic cloves, minced\n-2 tbsp chili crisp \n-1 cup of cream or coconut milk, room temperature\n-1 tbsp soy sauce, optional\n-1/2 cup fresh Parmesan cheese, grated\n-8 oz (225g) pasta of your choice\n-2 tbsp butter\n-1 tbsp olive oil\n-Seasonings (1 tsp each): paprika, garlic powder, salt, pepper, italian seasoning\n\n1. Slice your onion like it owes you money, mince that garlic (use fresh please), and measure out all your seasoning. Bring a cup of cream or coconut milk to room temperature.\n2. Heat 2 tbsp butter + 1 tbsp olive oil in a large skillet over medium. Add in the onions and let them vibe for 15–20 minutes, stirring occasionally, until golden and jammy. If they start sticking, hit ‘em with a splash of water.\n3. While your onions are caramelizing like sweet little angels, boil a pot of salted water and cook the pasta until al dente. Drain, but don’t forget to save some of that pasta water — it’s liquid gold.\n4. When the onions are deeply golden, stir in your minced garlic and all the seasonings. Let it all bloom for a minute, then add the chili crisp and saute for a minute. Pour in your cream (or coconut milk). Let it simmer and get cozy for a few minutes then add the grated Parmesan cheese. \n5. Add your pasta to the sauce and toss to coat. Use that reserved pasta water to loosen things up if it’s too thick — you’re going for silky, not sticky.\n6. Serve hot with an extra spoon of chili crisp on top for a spicy kick and maybe a sprinkle of fresh parsley if you’re feelin’ fancy.", "title": "Špagety s karamelizovanou cibulí a česnekem", "title_orig": "Caramelized Onion and Garlic Spaghetti", "category": "Hlavní jídlo", "tags": ["těstoviny", "špagety", "cibule", "česnek", "smetana", "vegetariánské", "parmazán", "chilli"], "ingredients": ["1 velká cibule, tence nakrájená", "4 stroužky česneku", "2 lžíce chili crisp", "240 ml smetany nebo kokosového mléka", "1 lžíce sójové omáčky (volitelně)", "50 g parmazánu", "225 g těstovin", "2 lžíce másla", "1 lžíce olivového oleje", "po 1 lžičce: paprika, česnekový prášek, sůl, pepř, italské koření", "petržel a chili crisp navrch"], "steps": ["Smetanu dát na pokojovou teplotu", "Na másle a oleji na středním žáru 15–20 minut smažit cibuli do zlatova", "Mezitím uvařit těstoviny al dente, nechat trochu vody", "Do cibule přidat česnek a koření, minutu smažit, přidat chili crisp a minutu smažit", "Zalít smetanou, pár minut provařit, přidat parmazán", "Přidat těstoviny, podle potřeby zředit vodou z vaření", "Podávat s chili crisp a petrželkou"], "recipe": "full", "note": "Podávat s kuřecím, krevetami nebo tofu", "time_min": 30, "unsure": false, "servings": null}, {"i": 123, "url": "https://www.instagram.com/reel/DKuGI4HIL-t/", "author": "anetjiskra", "caption": "Thajské kari do 30 minut ✨️\n\nBudeš potřebovat:\n400 g kuřecího masa\n1 červenou cibuli\n3 stroužky česneku\nCurry pastu (žlutá, červená)\n1 plechovka kokosového mléka (+ 100 ml vody)\n1 lžička kukuřičného škrobu\nSůl, pepř\nZelenina - cuketa, mrkev, paprika, fazolky...\nRýže\n\n#rychlyobed#hannetonmonde#receot", "title": "Thajské kari s kuřecím", "title_orig": "Thajské kari do 30 minut", "category": "Hlavní jídlo", "tags": ["kuřecí", "kari", "thajské", "asijské", "rýže", "kokosové mléko", "rychlovka"], "ingredients": ["400 g kuřecího masa", "1 červená cibule", "3 stroužky česneku", "curry pasta (žlutá, červená)", "1 plechovka kokosového mléka (+ 100 ml vody)", "1 lžička kukuřičného škrobu", "sůl, pepř", "zelenina (cuketa, mrkev, paprika, fazolky)", "rýže"], "steps": [], "recipe": "ingredients", "note": "Postup jen ve videu", "time_min": 30, "unsure": false, "servings": null}, {"i": 124, "url": "https://www.instagram.com/reel/DKZGcktMH_M/", "author": "katerinafric", "caption": "Recept a postup na dvě porce : \n\n• 3 kuřecí horní stehna s kostí \n• 1 a půl nakrájené cibule \n• míchám dohromady olivový olej a lžíci ghi @vilgainczsk \n• 1/2 kuřecí vývar ve skle @vilgainczsk s 1:1 s vodou (ať to není moc slané) nebo udělej zeleninový (jen vař zeleninu 40 min, bez vývaru to není ta omáčka, ten vývar tam je ZÁKLAD!!)\n• hodně sladké papriky \n• jíška : máslo a mouka 1:1 - nebo kupovaná \n• smetana = když dělám odlehčenou verzi ,,zdravější” dávám 7% rama smetanu a když klasiku tak 33% jednu celou - doporučuji spíše tuhle !! \n• trochu mléka cca 3 lžíce, ať je to trochu jemnější \n• sůl ani pepř nedávám - ale můžeš dle chuti \n\nPostup je mega důležitý !! Osmažíš si krásně maso na oleji ze všech stran do křupava, odložíš a osmažíš cibuli a poté přidáš papriku, tyto dvě věci třeba 3 min hezky smažíš 🫶🏽 \n\nMaso vrátíš zpět a přidáš vývar, vodu tak, ať je maso na 70% zalité a vaříš 40-45 minut. Pak zase vytáhneš maso, které obereš. Směs z pánve (vodovou) si rozmixuješ a vrátíš zpet, přidáš smetanu a zbytek všeho a obrané maso. Podáváme s těstovinami nebo knedlíčkem 🥰🥰 \n\nPÁNVE JSOU @ourplace .. ať se vyhneme komentářům na ně jako pod každým videem 😄💓\n\nJednou jsem teda něco random nevymyslela, ale je to recept od @marekpavala , snad mu nebude vadit, že jsem si ho půjčila 😄 mrkněte na jeho recepty, jsou vynikající a doma je děláme strašně často 💓💓\n\n#recepty #lunchideas #dinnerideas #zdraverecepty #letsgetcooking #mealideas #healthygirl #tipynajidlo #recipes #healthyrecipes", "title": "Kuřecí paprikáš", "title_orig": "Kuřecí paprikáš", "category": "Hlavní jídlo", "tags": ["kuřecí", "paprikáš", "smetana", "české", "těstoviny", "knedlík", "omáčka"], "ingredients": ["3 kuřecí horní stehna s kostí", "1,5 cibule, nakrájená", "olivový olej + 1 lžíce ghí", "1/2 skleněného kuřecího vývaru ředěného 1:1 vodou (nebo zeleninový vývar)", "hodně sladké papriky", "jíška z másla a mouky 1:1 (nebo kupovaná)", "smetana (7% lehčí nebo 33% klasická, doporučena klasická)", "cca 3 lžíce mléka", "sůl, pepř podle chuti"], "steps": ["Maso opéct dokřupava ze všech stran na oleji a odložit", "Opéct cibuli, přidat papriku a 3 minuty smažit", "Maso vrátit, zalít vývarem a vodou z cca 70 %, vařit 40–45 minut", "Maso vytáhnout a oškubat, směs z pánve rozmixovat", "Vrátit do pánve, přidat smetanu, mléko, jíšku a maso", "Podávat s těstovinami nebo knedlíkem"], "recipe": "full", "note": "Na 2 porce; inspirováno receptem @marekpavala; název jídla odvozen z postupu", "time_min": 60, "unsure": true, "servings": 2}, {"i": 125, "url": "https://www.instagram.com/reel/DJkGyqkSELm/", "author": "recipeincaption", "caption": "One-Pan Greek Parmesan Chicken & Potatoes with Roasted Garlic Tzaziki 🍋🧄\n\nComment “Recipe” and I’ll send you the full r UJ SE!\nTyhle domácí sýrové krokety jsou důkaz, že láska na první sousto existuje. Zvenku zlatavě křupavé, uvnitř se táhne sýrové nebe. Perfektní na party, k filmu nebo jen tak… protože prostě potřebuješ něco božsky sýrového.\nUlož si recept a označ někoho, kdo by ti to měl udělat! 😏\n\nKrokety:\n250 g strouhaného sýra (gouda, cheddar)\n1 vejce\nLžička hořčice \n2 lžíce hladké mouky\nSůl, pepř\nCornflakes na obalení \nOlej na smažení \n\nDip:\n3 lžíce majonézy\n2 lžičky sirracha\nSťáva z 1/2 limetky\nŠpetka cukru\n\n#inspirace #krokety #syr #cheesecroquettes", "title": "Sýrové krokety s dipem", "title_orig": "Sýrové krokety", "category": "Snack / předkrm", "tags": ["sýr", "vejce", "krokety", "smažené", "párty", "vegetariánské"], "ingredients": ["250 g strouhaného sýra (gouda, cheddar)", "1 vejce", "1 lžička hořčice", "2 lžíce hladké mouky", "sůl, pepř", "cornflakes na obalení", "olej na smažení", "Dip: 3 lžíce majonézy", "Dip: 2 lžičky sriracha", "Dip: šťáva z 1/2 limetky", "Dip: špetka cukru"], "steps": [], "recipe": "ingredients", "note": "Postup jen ve videu", "time_min": null, "unsure": false, "servings": null}, {"i": 128, "url": "https://www.instagram.com/reel/DJjui2bICfK/", "author": "beata.ann_", "caption": "#recept #reels", "title": "Neznámý reels (bez popisku)", "title_orig": "", "category": "Ostatní", "tags": ["recept"], "ingredients": [], "steps": [], "recipe": "none", "note": "Popisek obsahuje jen hashtagy a náhled jídlo neukazuje. Otevři reels.", "time_min": null, "unsure": false, "servings": null}, {"i": 129, "url": "https://www.instagram.com/reel/DIO0JtYs3Z6/", "author": "nikolahomolkova", "caption": "Zatím nejlepší asijský jídlo roku 2025 u mě na profilu! 😃 Porce pro 2 ⬇️\n\nPřílohy:\n- 120g rýžové nudle\n- brokolice, pak choi (nebo jiná zelenina)\n\nTo si uvaříte ve vodě. Ať vám to chutná. Cca 5 minut.\n\nMasové kuličky:\n- cca 300g kuřecí mleté\n- troška česneku a zázvoru (já dala česnekové pyré a zázvorové koření - z lenosti)\n- lžíce sojovky\n- hrstka nasekaného koriandru\n- 1 lžička kukuřičného škrobu (ať jsou kuličkz vláčné)\n\nSmíchat a dát do horkovzdušky nebo trouby na 10-15minut a 180-200 stupňů. Já jsem ještě lehce posprejovala avokádovým olejem.\n\nSós:\n- 2-3 lžíce sojovky\n- 1.5-2 lžíce medu\n- 1 lžíce rýžového octa\n- 1 lžička sezamového oleje\n- 1 lžička kukuřičného škrobu\n- 50-70ml vody\n\nSmíchat.\n\nAž budete mít kuličky upečené. Rozpalte pánev, nalijte tam onáčku a kuličky v ní chviličku vykoupejte a povařte, ať sós zhoustne. No a pak už jen naservírujte spolu s jarní cibulkou, koriandrem a sezamovými semínky ❤️\n\n#nejlepsirecept #skutecne #nekecam", "title": "Asijské kuřecí kuličky s rýžovými nudlemi", "title_orig": "", "category": "Hlavní jídlo", "tags": ["kuřecí", "mleté maso", "nudle", "asijské", "airfryer", "high-protein"], "ingredients": ["Přílohy: 120 g rýžových nudlí", "Přílohy: brokolice, pak choi (nebo jiná zelenina)", "Kuličky: cca 300 g mletého kuřecího masa", "trochu česneku a zázvoru", "1 lžíce sojové omáčky", "hrstka nasekaného koriandru", "1 lžička kukuřičného škrobu", "Omáčka: 2–3 lžíce sojové omáčky", "Omáčka: 1,5–2 lžíce medu", "Omáčka: 1 lžíce rýžového octa", "Omáčka: 1 lžička sezamového oleje", "Omáčka: 1 lžička kukuřičného škrobu", "Omáčka: 50–70 ml vody", "Na servírování: jarní cibulka, koriandr, sezamová semínka"], "steps": ["Nudle a zeleninu uvařit ve vodě cca 5 minut.", "Smíchat ingredience na kuličky, vytvarovat a péct v horkovzdušné fritéze nebo troubě 10–15 minut při 180–200 °C.", "Smíchat ingredience na omáčku.", "Na pánvi kuličky krátce povařit v omáčce, až zhoustne.", "Servírovat s nudlemi, jarní cibulkou, koriandrem a sezamem."], "recipe": "full", "note": "Porce pro 2", "time_min": null, "unsure": false, "servings": 2}, {"i": 130, "url": "https://www.instagram.com/reel/DIYMllGNIcO/", "author": "andy.stech", "caption": "Reminder: Pretože nie všetky koláčiky, ktoré si pripravíš musia byť vo high protein low kcal verzii. Milujem robiť aj také, milujem skúšať aj toto ♥️💆🏼‍♀️\n\nKorpus:\n•200g maslové sušienky\n•100g maslo\n\nPlnka:\n•500g philadelphia\n•100g kinder čoko\n•50g praškový cukor \n\nPoleva:\n•200g kinder čoko\n•100ml smotana na varenie\n\n1. Sušienky pomixuj na jemno, prilej k nim roztopené maslo a utlač do formy. Použila som štvrcovú cca 20x20. Nezabudni vyložiť papierom na pečenie, aby sa ti to z nej ľahko vyberalo.\n2. Na plnku zmiešaj philadelphiu, roztopenú kinder čoko a cukor. Natri na korpus.\n3. Na polevu roztop čokoládu so smotanou a vylej na vrch.\n4. Poukladaj kocky buena a daj zatuhnúť, ideálne na noc.\n\nHotovo!", "title": "Kinder cheesecake bez pečení", "title_orig": "", "category": "Sladké", "tags": ["sladké", "dezert", "čokoláda", "cream cheese", "bez pečení", "kinder"], "ingredients": ["Korpus: 200 g máslových sušenek", "Korpus: 100 g másla", "Plnka: 500 g philadelphie", "Plnka: 100 g Kinder čokolády", "Plnka: 50 g moučkového cukru", "Poleva: 200 g Kinder čokolády", "Poleva: 100 ml smetany na vaření", "Kostky Kinder Bueno na ozdobu"], "steps": ["Sušenky rozmixovat najemno, smíchat s rozpuštěným máslem a utlačit do formy (cca 20x20 cm) vyložené pečicím papírem.", "Philadelphii smíchat s rozpuštěnou Kinder čokoládou a cukrem, natřít na korpus.", "Čokoládu rozpustit se smetanou a vylít navrch.", "Poskládat kostky Bueno a nechat ztuhnout, ideálně přes noc."], "recipe": "full", "note": "Nepečený dezert, ztuhnout přes noc", "time_min": null, "unsure": false, "servings": null}, {"i": 131, "url": "https://www.instagram.com/reel/DI4msgwoQ51/", "author": "tastyiri_en", "caption": "ACCORDION POTATOES 🥔 \n\n▪️1 potato \n▪️1 grater \n▪️Spices and extra virgin olive oil (oregano, paprika, pepper) \n👉🏻10 min at 400°F (200°C) in the air fryer\n\n #recipe #potato #potatoes #healthyrecipe #healthysnack #homemadefries #tip", "title": "Harmonikové brambory z airfryeru", "title_orig": "Accordion potatoes", "category": "Snack / předkrm", "tags": ["brambory", "airfryer", "zdravé", "vegetariánské", "veganské", "rychlovka"], "ingredients": ["1 brambor", "koření (oregano, paprika, pepř)", "extra panenský olivový olej"], "steps": ["Brambor nakrájet na harmoniku (např. pomocí struhadla jako zarážky), okořenit a pokapat olejem.", "Péct v airfryeru 10 min při 200 °C."], "recipe": "full", "note": "", "time_min": 10, "unsure": false, "servings": null}, {"i": 132, "url": "https://www.instagram.com/reel/DIRk8Y8qLa0/", "author": "ondera_vaculik", "caption": "Nejlepší recept na kuřecí maso⬇️⬇️⬇️:\n\nNa maso potřebuješ (4 porce):\n- kuřecí prsa 400g\n- 1,5 lžičky soli \n- 1,5 lžičky pepře \n- 2 lžičky sušeného česneku \n- 2 lžičky oregana\n- 2 lžičky uzené papriky\n- 1 lžičky bazalky \n- 15g olivového oleje \n\nKaramelizovaná cibulka:\n- 175g červené cibule \n- 40g sušených rajčat \n- 0,5 lžičky soli \n- 0,5 lžičky pepře \n- 1 lžička uzené papriky \n- 1 lžička chilli vloček \n- 1 stroužek česneku \n- 150ml mléka \n- 150g ricotta \n- 25g parmazán \nNásleduj recept a máš hotovo. Já to ještě podával s 50g rýže 😀🤌 \n\nGhíčko mám kvalitní z @brainmarket_cz , takže pokud by někdo chtěl doplnit zásobu suplementů nebo kvalitních vitamínů tak může nakoupit levněji 💪\n⚡️ slevový kód 10%: ondra10\n#healthylifestyle #health #fitnes #healthyfood #healthyrecipes #zdravejidlo #zdraverecepty  #zdravyzivotnistyl #zdravi", "title": "Kuřecí prsa s karamelizovanou cibulí a ricottou", "title_orig": "", "category": "Hlavní jídlo", "tags": ["kuřecí", "ricotta", "high-protein", "zdravé", "fit", "sušená rajčata"], "ingredients": ["Maso (4 porce): 400 g kuřecích prsou", "1,5 lžičky soli", "1,5 lžičky pepře", "2 lžičky sušeného česneku", "2 lžičky oregana", "2 lžičky uzené papriky", "1 lžička bazalky", "15 g olivového oleje", "Cibulka: 175 g červené cibule", "40 g sušených rajčat", "0,5 lžičky soli", "0,5 lžičky pepře", "1 lžička uzené papriky", "1 lžička chilli vloček", "1 stroužek česneku", "150 ml mléka", "150 g ricotty", "25 g parmazánu", "Podávat s 50 g rýže"], "steps": [], "recipe": "ingredients", "note": "4 po "steps": ["Maso naložit do marinády.", "Maso opékat na prudkém ohni.", "Přidat zeleninu, nudle, arašídy a omáčku."], "recipe": "ingredients", "note": "Tipy: maso na vysokém plameni, papriku nechat křupavou; veganská verze s kokosovou aminoomáčkou nebo hoisin; spolupráce s Vilgain", "time_min": null, "unsure": false, "servings": null}, {"i": 137, "url": "https://www.instagram.com/reel/ChpO5VUDmc9/", "author": "chili_tathuy", "caption": "Chcete nové kamarády? Udělejte si tyhle nudle? Nehledáte nové kamarády? Udělejte si tyhle nudle i tak. 😎 \n\nMísto arašídového oleje můžete použít i jiné aromatické oleje jako je například dýňový nebo dokonce i rozpuštěné máslo. #spetkachili #nudle #chiliolej #mnamka #kamosibudouslintat #levnerecepty #vegannudle ⠀\n⠀\nRECEPT:\nIngredience:⠀\n100 g pšeničných bezvaječných nudlí (můžete použít i instantní nudle). Ve videu mám sušené nesmažené. ⠀\nKousek uzeného tofu⠀\nolej na smažení ⠀\n⠀\nChili olej⠀\n50 ml arašídového oleje (lze použít i obyčejný rostlinný)⠀\n3 lžíce praženého sezamového oleje (není potřeba, ale je to o pak o dost chutnější)⠀\n2 stroužky česneku ⠀\n1 šalotka ⠀\nlžíce sušených nepálivých chili flíčků ⠀\nLžíce sezamových semínek ⠀\nLžíce jarní cibulky ⠀\n2 lžíce sojové omáčky ⠀\n1,5 lžíce javorového sirupu ⠀\n⠀\nPostup: ⠀\nNudle uvařte v osolené bublající vodě, dokud nezměknou (cca 6 minut). Pak je opláchněte vlažnou tekoucí vodou, aby se nelepily. ⠀\n⠀\nTofu nakrájejte na plátky a na oleji osmažte dokřupava.⠀\n⠀\nV rendlíčku zahřejte arašídový olej. Můžete přidat pár kapek praženého sezamového oleje. Zahřejte olej tak, aby byl opravdu horký. ⠀\nČesnek, šalotku a jarní cibulku pokrájejte najemno. Přidejte do hlubší mísy společně se sušenými chili flíčky a sezamovými semínky. Pomalu vše zalijte horkým olejem, nechte chvilku bublat a pak vše promíchejte. Přidejte sojovou omáčku a javorový sirup. Přidejte nudle a řádně zamíchejte. Servírujte s křupavými plátky tofu a dozdobte třeba koriandrem nebo jarní cibulkou. ⠀\n⠀", "title": "Nudle s chilli olejem a křupavým tofu", "title_orig": "", "category": "Hlavní jídlo", "tags": ["nudle", "tofu", "veganské", "asijské", "chilli olej", "levné", "rychlovka"], "ingredients": ["100 g pšeničných bezvaječných nudlí", "kousek uzeného tofu", "olej na smažení", "Chili olej: 50 ml arašídového oleje", "3 lžíce praženého sezamového oleje", "2 stroužky česneku", "1 šalotka", "1 lžíce sušených nepálivých chili vloček", "1 lžíce sezamových semínek", "1 lžíce jarní cibulky", "2 lžíce sojové omáčky", "1,5 lžíce javorového sirupu", "koriandr nebo jarní cibulka na ozdobu"], "steps": ["Nudle uvařit v osolené vodě cca 6 minut, opláchnout vlažnou vodou.", "Tofu nakrájet na plátky a osmažit dokřupava.", "Zahřát olej do horka.", "Česnek, šalotku a jarní cibulku najemno nakrájet, dát do mísy s chilli a sezamem a zalít horkým olejem.", "Přidat sojovku a javorový sirup, promíchat s nudlemi, servírovat s tofu."], "recipe": "full", "note": "Arašídový olej lze nahradit dýňovým nebo máslem", "time_min": null, "unsure": false, "servings": null}, {"i": 138, "url": "https://www.instagram.com/reel/CjxlZWzDjqx/", "author": "chili_tathuy", "caption": "Vysoce žádaný recept zde! Nudle jako… z “čínské”restaurace, ale ještě lepší a bez tuny oleje. 😏 Ideální na chladné melancholické podzimní dny. MOJE KUCHAŘKA JE OUT! 🤩 K dostání pouze na chilita.cz #spetkachili #nudle #tudle #kreativnirecepty. \n⠀\nIngredience: ⠀\n100 g pšeničních nudlí ⠀\n1 mrkev ⠀\n1/2 cukety ⠀\n2 stroužky česneku⠀\nkus oloupaného zázvoru⠀\n1/2 chilli cayenne ⠀\n100 g kuřecího masa nebo tofu ⠀\n3 lžíce sójové omáčky ⠀\n2 lžíce praženého sezamového oleje⠀\nšťáva z 1/2 pomeranče ⠀\nlžíce sezamových semínek⠀\nhrst čerstvého koriandru⠀\nsůl a pepř ⠀\n⠀\nPostup:⠀\n⠀\n1. Nejdřív si všechnu zeleninu i maso očistěte. Oloupejte mrkev a nakrájejte na nudličky nebo pomocí škrabky na proužky. Cuketu si nakrájejte také na proužky. Maso osušte a osolte. Cibuli si nakrájejte na kolečka, česnek, zázvor a chili najemno. Pokud chcete zmírnit pikantnost, vyškrabte nožem z papriček semínka. ⠀\n⠀\n2. Nudle si uvařte podle návodu. Nejdříve si na pánvi orestujte cibuli, dokud nebude hnědá. Pak přidejte mrkev, 3 minutky restujte a pak přidejte zázvor, česnek a chili. Restujte další 2 minuty a pak přidejte maso. Do pánve přihoďte cuketu a lžíci sezamových semínek. Restujte, dokud nebude vše měkké (cca 4 minuty) a pak vše zakápněte pomerančovou šťávou. Na závěr přidejte sójovou omáčku.⠀\n⠀\n3. Do pánve přidejte nudle rovnou z vody. Díky této metodě budou nudle vláčné aniž byste museli přidávat mnoho oleje. Zamíchejte a povařte ještě minutku. Stáhněte z plotny, dochuťte sezamovým olejem a pokrájeným čerstvým koriandrem. Zamíchejte a servírujte. Na závěr ještě můžete dozdobit sezamovými semínky. ⠀\n⠀\nBrou! ⠀", "title": "Nudle s kuřetem a zeleninou jako z čínské restaurace", "title_orig": "", "category": "Hlavní jídlo", "tags": ["nudle", "kuřecí", "tofu", "zelenina", "asijské", "rychlovka", "zázvor"], "ingredients": ["100 g pšeničných nudlí", "1 mrkev", "1/2 cukety", "2 stroužky česneku", "kus zázvoru", "1/2 chilli cayenne", "100 g kuřecího masa nebo tofu", "3 lžíce sójové omáčky", "2 lžíce praženého sezamového oleje", "šťáva z 1/2 pomeranče", "1 lžíce sezamových semínek", "hrst čerstvého koriandru", "sůl a pepř", "cibule"], "steps": ["Zeleninu a maso očistit a nakrájet, maso osolit.", "Nudle uvařit podle návodu.", "Na pánvi osmažit cibuli do hněda, přidat mrkev (3 min), pak zázvor, česnek, chilli (2 min) a maso.", "Přidat cuketu a sezam, restovat cca 4 minuty, zakápnout pomerančovou šťávou a sójovkou.", "Přidat nudle rovnou z vody, povařit minutu, dochutit sezamovým olejem a koriandrem."], "recipe": "full", "note": "Recept z kuchařky autorky", "time_min": null, "unsure": false, "servings": null}, {"i": 139, "url": "https://www.instagram.com/reel/CtrlfjbucHe/", "author": "ondera_vaculik", "caption": "Ať už je váš cíl zhubnout nebo nabrat svaly, tak to není nikdy důvod, proč by jste měli jíst suchou rý , soli, pepře a 1/4 lžičky chilli)", "olej na smažení"], "steps": ["Brambory nakrájet na tenké plátky škrabkou nebo mandolinou, okořenit a osmažit."], "recipe": "full", "note": "", "time_min": null, "unsure": false, "servings": null}, {"i": 142, "url": "https://www.instagram.com/reel/DF-5uRUg6xn/", "author": "anetjiskra", "caption": "Recept na pastu s lososem a citrónem 🍋🐟\n\nBudete potřebovat:\n300 g lososa\n1 citrón\nSmetanu ke šlehání\nTěstoviny\n1 cibule\n3 stroužky česneku\nHrst špenátu (mražený nebo čerstvý)\nOlivový olej\n2 lžíce másla\nSůl, pepř, granulovaný česnek\n\n#recept#večeře#hannetonmonde#rychlyobed", "title": "Těstoviny s lososem a citronem", "title_orig": "Pasta s lososem a citrónem", "category": "Hlavní jídlo", "tags": ["těstoviny", "losos", "ryba", "citron", "špenát", "smetana", "rychlovka"], "ingredients": ["300 g lososa", "1 citrón", "smetana ke šlehání", "těstoviny", "1 cibule", "3 stroužky česneku", "hrst špenátu (mražený nebo čerstvý)", "olivový olej", "2 lžíce másla", "sůl, pepř, granulovaný česnek"], "steps": [], "recipe": "ingredients", "note": "Množství nejsou uvedena u všech surovin; postup jen ve videu", "time_min": null, "unsure": false, "servings": null}, {"i": 143, "url": "https://www.instagram.com/reel/C_irceiIkme/", "author": "alfiecooks", "caption": "CARAMELISED ONION + BROWN BUTTER PASTA 🤤\n\nwhat’s your go-to midweek meal? my caramelised onion + brown butter malfadine is comforting, quick to make + absolutely delicious. ideal for feeding you, friends + family. \n\nAD| the recipe uses just a handful of ingredients you’ll probably have already. the key is to brown your butter - my go to is @flora_family_uki salted. creamy + rich, it caramelises your onions to perfection. it’s also made from natural ingredients.\n\nadd garlic, sun dried tomatoes, cream + a few other bits, then that’s it! my full recipe can be found below - so enjoy + let me know if you give a go 👇\n\nINGREDIENTS (serves 4)\n\n320g pasta of choice - I used malfadine (+ pasta water)\n2 large brown onions\n4 garlic cloves\n280g sun dried tomatoes\n30g fresh parsley\n100g butter (I use flora salted)\n100ml cream (I use flora double)\n4 tbsp nutritional yeast (I use instead of parmesan)\nSalt\nPepper\nOlive oil\n\nTo garnish: chilli oil, chives\n\nMETHOD\n\n1. Slice the onions into half moons. Warm a splash of olive oil in a pan on a medium high heat + melt in 2 tbsp butter. Allow to foam + brown, stirring regularly (2-3 mins). \n2. Add the onions + a large pinch of salt. Cook on a medium heat, stirring regularly + adding a splash of water if sticking, until golden, softened + caramelised (at least 20 mins). \n3. Mince the garlic + finely chop the sundried tomatoes. Once the onions have begun to caramelise (20 mins), add the garlic + tomatoes. Stir to combine + sauté for a further minute or two. Season with black pepper. \n4. Get your pasta onto boil in salted water.\n5. Pour in the cream + the nutrtitional yeast. stir well to combine. \n6. Once your pasta is al dente, drain (reserving some pasta water) + add to the sauce with a ladle of pasta water. Stir + toss well to create a thick, glossy sauce. \n7. Finely chop the parsley + add half to the pasta, mixing well. 8. Season to taste + serve into bowls. Finish with a drizzle of chilli oil + parsley/chives - enjoy!\n\n#caramelisedonion #pasta #easyrecipes #comfortfood #brownbutter #weeknightdinner #quickmeals #flora", "title": "Těstoviny s karamelizovanou cibulí a hnědým máslem", "title_orig": "Caramelised onion + brown butter pasta", "category": "Hlavní jídlo", "tags": ["těstoviny", "cibule", "máslo", "sušená rajčata", "vegetariánské", "italské", "rychlovka"], "ingredients": ["320 g těstovin (např. malfadine) + voda z vaření", "2 velké hnědé cibule", "4 stroužky česneku", "280 g sušených rajčat", "30 g čerstvé petrželky", "100 g másla", "100 ml smetany", "4 lžíce nutričních kvasnic (místo parmazánu)", "sůl, pepř, olivový olej", "Na ozdobu: chilli olej, pažitka"], "steps": ["Cibuli nakrájet na půlměsíčky. Na oleji a 2 lžících másla nechat zpěnit a zhnědnout (2–3 min).", "Přidat cibuli a sůl, restovat na střední teplotě do zlatova a karamelizace (min. 20 min), podle potřeby podlít vodou.", "Přidat česnek a nasekaná sušená rajčata, 1–2 minuty restovat, opepřit.", "Uvařit těstoviny v osolené vodě.", "Přilít smetanu a nutriční kvasnice.", "Těstoviny al dente přidat do omáčky s naběračkou vody z vaření, promíchat.", "Přidat půlku petrželky, dochutit, servírovat s chilli olejem a bylinkami."], "recipe": "full", "note": "4 porce", "time_min": null, "unsure": false, "servings": 4}, {"i": 144, "url": "https://www.instagram.com/reel/DA1GI7lsbyF/", "author": "receptyodanicky", "caption": "Tradiční Pad Thai patří mezí mé oblíbené recepty. Ať už si ho připravíte s kuřecím masem, krevetami nebo s tofu, nikdy nešlápnete vedle.\n\nIngredience:\n250 g rýžových nudlí\n500 g kuřecího masa\n2 lžíce sezamového oleje\n3 vejce\n6 stroužků česneku\n1 lžíce nastrouhaného zázvoru\n1 svazek jarní cibulky\n1/2 pórku\n1 mrkev\n100 g mungo nebo sojových výhonků (lze vynechat)\n\nNa Pad Thai omáčku:\n4 lžíce rybí omáčky\n6 lžic tamarindové pasty\n3 lžíce sojové omáčky\n3 lžíce třtinového cukru\n2-3 lžíce vody\n\nNa dokončení:\nčerstvý koriandr\n2 hrsti nasekaných arašídů\n2 limety\nchilli paprička\n\nCelý postup, jak si recept připravit, mám na blogu. Hledejte recept s názvem “Pad Thai s kuřecím masem”.\n\n#recept #recepty #trend #padthai #padthairecipe #viral #food #vareni #dinnerinspo #cooking #foodinspo #snadnerecepty #receptyodanicky", "title": "Pad Thai s kuřecím masem", "title_orig": "Pad Thai s kuřecím masem", "category": "Hlavní jídlo", "tags": ["kuřecí", "nudle", "asijské", "thajské", "pad thai", "vejce", "arašídy"], "ingredients": ["250 g rýžových nudlí", "500 g kuřecího masa", "2 lžíce sezamového oleje", "3 vejce", "6 stroužků česneku", "1 lžíce nastrouhaného zázvoru", "1 svazek jarní cibulky", "1/2 pórku", "1 mrkev", "100 g mungo nebo sójových výhonků (lze vynechat)", "Omáčka: 4 lžíce rybí omáčky", "Omáčka: 6 lžic tamarindové pasty", "Omáčka: 3 lžíce sójové omáčky", "Omáčka: 3 lžíce třtinového cukru", "Omáčka: 2–3 lžíce vody", "Na dokončení: čerstvý koriandr", "2 hrsti nasekaných arašídů", "2 limety", "chilli paprička"], "steps": [], "recipe": "ingredients", "note": "Celý postup na blogu autorky", "time_min": null, "unsure": false, "servings": null}, {"i": 145, "url": "https://www.instagram.com/reel/DCqpXJOsT-L/", "author": "drobeckuv_talir", "caption": "Kuře na paprice tak trochu jinak\ncca 3 dospělé a 3 dětské porce\n👶🏼 Recept je vhodný i pro děti od ukončeného 6. měsíce po bezpečném zavedení všech surovin a při vhodné prezentaci.\n\n70 g másla\n1 lžíce oleje\n4 červené kápie\n2 lžíce mleté papriky\n4 kuřecí stehna\n1 cibule\n3 mrkve\nMletá paprika\n240 g máslových fazolí\n250 g 33% smetany ke šlehání\n700 ml vody nebo vývaru\nSůl a pepř pro děti staršího roku\n\nOčištěnou kápii, mrkev a cibuli nakrájím nadrobno. Rozehřeju si máslo s olejem a zarestuji ze všech stan kuřecí stehna hezky do zlatavé barvy. Maso vyjmu a přidám mrkev s cibulí. Restuji cca 5 minut, přidám kápii, pokračuju v restování další 3 minuty a na posledních 30 sekund nechám krátce zarestovat mletou papriku. Vrátím stehna do hrnce, přidávám vodu nebo vývar, osolím, opepřím a vařím pod pokličkou cca hodinu.\nKdyž jsou stehna hotová, tak je vyju z omáčky a tu umixuji společně s máslovými fazolemi a smetanou dohladka. Na závěr ještě doladím chutě a podávám s masem a přílohou, jakou máme rádi.\n\n#Kurenapaprice #jidloprodeti #blw #prvniprikrmy", "title": "Kuře na paprice s máslovými fazolemi", "title_orig": "Kuře na paprice tak trochu jinak", "category": "Hlavní jídlo", "tags": ["kuřecí", "paprika", "smetana", "fazole", "české", "pro děti", "jeden hrnec"], "ingredients": ["70 g másla", "1 lžíce oleje", "4 červené kápie", "2 lžíce mleté papriky", "4 kuřecí stehna", "1 cibule", "3 mrkve", "240 g máslových fazolí", "250 g smetany ke šlehání 33 %", "700 ml vody nebo vývaru", "sůl a pepř (pro děti starší než rok)"], "steps": ["Kápii, mrkev a cibuli nakrájet nadrobno.", "Na másle s olejem osmažit stehna dozlatova, vyjmout.", "Zpěnit mrkev s cibulí cca 5 min, přidat kápii a restovat 3 min, nakonec 30 s mletou papriku.", "Vrátit stehna, přidat vodu nebo vývar, osolit, opepřit a vařit pod pokličkou cca hodinu.", "Stehna vyjmout, omáčku umixovat s fazolemi a smetanou dohladka, dochutit.", "Podávat s masem a přílohou."], "recipe": "full", "note": "Cca 3 dospělé a 3 dětské porce; vhodné pro děti od 6. měsíce", "time_min": null, "unsure": false, "servings": null}, {"i": 146, "url": "https://www.instagram.com/reel/DA1EZduAWkl/", "author": "valentynaap", "caption": "tohle bude vaše nový nejoblíbenější comfort food!!🍅🧀❤️\n\n🍅INGREDIENCE:\n*cherry rajčata (cca 1 a 1/2 vaničky)\n*2x klasický rajčata \n*1x střední červená cibule\n*česnek (+- 5 stroužků)\n*olivový olej (od oka)\n*rajčatový protlak (+- 40g, já použila zhruba 1/3 balení)\n*cca 800 ml zeleninového / kuřecího vývaru (trochu si nechte na případný redění po rozmixování)\n*15g cukru (vrchovatá lžička)\n*10g soli (menší lžička)\n*italské bylinky koření (od oka)\n*čerstvá bazalka\n*smetana 33%\n\n🧀INGREDIENCE\n*chleba\n*čedar \n*máslo / ghí na osmažení \n\n🍅POSTUP:\n*troubu si předehřejte na 230 stupňů\n*všechny ingredience (kromě smetany a č. bazalky) si nakrájejte a naházejte do pekáčku a dejte na +- hodinu péct\n*obsah pekáčku si přelejte do mixéru a rozmixujte, předejte bazalku a zbytek vývaru (pokud je třeba!)\n*polévku dodělejte v hrnci - přidejte smetanu\n*na grilled 🧀: do chleba dejte čedar a opečte s obou stran na ghí/másle & máte hotovo!\n\n#tomatosoup #tomatosoupandgrilledcheese #rajcatovapolevka", "title": "Pečená rajčatová polévka s grilovaným sýrem", "title_orig": "Tomato soup and grilled cheese", "category": "Polévka", "tags": ["rajčata", "polévka", "sýr", "vegetariánské", "comfort food", "do trouby"], "ingredients": ["cherry rajčata (cca 1 a 1/2 vaničky)", "2 kla const SYNC_LABEL = {

/* ---------- MK²: copy, edit, new ---------- */
