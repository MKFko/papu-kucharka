<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Papu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Papu kuchařka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: slide-out menu (views: all / favourites / MK²), sticky search bar, card grid; recipe opens in a side sheet (bottom sheet on phone). */
:root {
  --bg: #f2f3ef;
  --surface: #ffffff;
  --ink: #1d211c;
  --muted: #646a61;
  --line: #dcdfd6;
  --accent: #c2410c;        /* paprika */
  --accent-ink: #ffffff;
  --accent-soft: #fbe6da;
  --mk: #3f5f2a;            /* basil, for MK² */
  --mk-soft: #e3ecd9;
  --chip: #e7e9e2;
  --ok: #2f7a43;
  --ok-soft: #dcefdf;
  --warn: #9a6a00;
  --warn-soft: #f6ecd0;
  --none: #7a7f76;
  --none-soft: #e6e7e2;
  --danger: #b42318;
  --shadow: 0 1px 2px rgba(29,33,28,.06), 0 6px 20px rgba(29,33,28,.06);
  --scrim: rgba(20,22,19,.42);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151714; --surface: #1e211d; --ink: #eceee8; --muted: #9ba196; --line: #30352e;
  --accent: #fb7a3c; --accent-ink: #1a0f08; --accent-soft: #3a2316; --mk: #a9cf8a; --mk-soft: #26331f; --chip: #282c26;
  --ok: #7cc98f; --ok-soft: #1f3324; --warn: #e2b54f; --warn-soft: #362d17; --none: #8d9389; --none-soft: #2a2d28; --danger: #f97066;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.6);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151714; --surface: #1e211d; --ink: #eceee8; --muted: #9ba196; --line: #30352e;
  --accent: #fb7a3c; --accent-ink: #1a0f08; --accent-soft: #3a2316; --mk: #a9cf8a; --mk-soft: #26331f; --chip: #282c26;
  --ok: #7cc98f; --ok-soft: #1f3324; --warn: #e2b54f; --warn-soft: #362d17; --none: #8d9389; --none-soft: #2a2d28; --danger: #f97066;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.6);
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
sup { font-size: .55em; line-height: 0; position: relative; top: -.15em; }
button { font-family: inherit; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { padding-block: 12px; display: grid; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font: 800 clamp(24px, 4vw, 32px)/1 var(--display); letter-spacing: -.02em; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand h1 span { color: var(--accent); }
.brand h1 .mk { color: var(--mk); }
.brand .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.menu-btn { flex: none; width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.menu-btn svg { width: 20px; height: 20px; }
.searchrow { display: flex; gap: 8px; }
.search { flex: 1; min-width: 0; position: relative; }
.search input { width: 100%; font: 500 16px var(--body); padding: 12px 40px 12px 42px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); outline: none; }
.search input:focus { border-color: var(--accent); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.search button.clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 20px; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; }
.btn { font: 600 14px var(--body); border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 14px; min-height: 38px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.mk { background: var(--mk-soft); color: var(--mk); border-color: transparent; }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 32px; padding: 0 10px; font-size: 13px; border-radius: 10px; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips:empty { display: none; }
.chip { flex: none; font: 500 13px var(--body); padding: 6px 11px; border-radius: 999px; background: var(--chip); color: var(--ink); border: 1.5px solid transparent; cursor: pointer; white-space: nowrap; }
.chip .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.chip.tag[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.filters { display: grid; gap: 8px; }
.toggles { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); align-items: center; }
.toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.toggles select { font: 500 13px var(--body); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; }

main .wrap { padding-block: 18px 48px; display: grid; gap: 14px; }
.viewbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.viewbar p { margin: 0; color: var(--muted); font-size: 14px; max-width: 60ch; }
.syncpill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.syncpill.ok { background: var(--ok-soft); color: var(--ok); }
.syncpill.warn { background: var(--warn-soft); color: var(--warn); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 12px; display: grid; gap: 8px; align-content: start; cursor: pointer; text-align: left; color: inherit; font: inherit; transition: border-color .15s, transform .15s; min-width: 0; }
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card.mk2 { border-color: color-mix(in srgb, var(--mk) 35%, var(--line)); }
.card .meta { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.card .cat { text-transform: uppercase; letter-spacing: .06em; font-weight: 600; font-size: 11px; }
.card .marks { display: inline-flex; gap: 6px; align-items: center; }
.mkmark { font: 700 11px var(--display); color: var(--mk); background: var(--mk-soft); border-radius: 6px; padding: 1px 6px; }
.card h3 { font: 700 18px/1.2 var(--display); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.card .orig { font-size: 12.5px; color: var(--muted); margin-top: -4px; overflow-wrap: anywhere; }
.card .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.card .tags span { font-size: 11.5px; padding: 2px 8px; background: var(--chip); border-radius: 999px; color: var(--muted); }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding-top: 2px; }
.card .foot .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.badge.full { background: var(--ok-soft); color: var(--ok); }
.badge.ingredients, .badge.partial { background: var(--warn-soft); color: var(--warn); }
.badge.none { background: var(--none-soft); color: var(--none); }
.badge.mine { background: var(--mk-soft); color: var(--mk); }
.fav { color: var(--accent); font-size: 15px; line-height: 1; }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.hit { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--accent); padding-left: 8px; overflow-wrap: anywhere; }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty strong { display: block; font: 700 20px var(--display); color: var(--ink); margin-bottom: 6px; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.drawer { position: fixed; z-index: 22; top: 0; bottom: 0; left: 0; width: min(310px, 86vw); background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; padding: calc(18px + env(safe-area-inset-top, 0px)) 12px calc(18px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); animation: slidein .18s ease-out; }
@keyframes slidein { from { transform: translateX(-100%); } to { transform: none; } }
.drawer .dhead { font: 800 24px/1 var(--display); padding: 4px 10px 16px; letter-spacing: -.02em; }
.drawer .dhead span { color: var(--accent); }
.navitem { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 12px; border-radius: 12px; border: 0; background: none; color: var(--ink); font: 600 15.5px var(--body); cursor: pointer; text-align: left; }
.navitem:hover { background: var(--chip); }
.navitem[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.navitem.mk[aria-current="true"] { background: var(--mk-soft); color: var(--mk); }
.navitem .ico { width: 22px; text-align: center; font-size: 17px; }
.navitem .n { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; }
.drawer hr { border: 0; border-top: 1px solid var(--line); margin: 10px 4px; width: auto; }
.drawer .foot { margin-top: auto; padding: 0 12px; font-size: 12px; color: var(--muted); }

/* Sheet */
.sheet { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(580px, 100%); background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
@media (max-width: 640px) { .sheet { top: 5vh; width: 100%; border-radius: 18px 18px 0 0; padding-right: 0; } }
.sheet .head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.sheet .head .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sheet .cat { text-transform: uppercase; letter-spacing: .06em; font-weight: 600; font-size: 11px; color: var(--muted); }
.sheet h2 { font: 800 26px/1.15 var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance; overflow-wrap: anywhere; }
.sheet .orig { color: var(--muted); font-size: 14px; }
.sheet .actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 6px; align-items: center; }
.sheet .actions .who { color: var(--muted); font-size: 13px; }
.iconbtn { border: 0; background: var(--chip); color: var(--ink); width: 36px; height: 36px; border-radius: 10px; font-size: 18px; cursor: pointer; flex: none; }
.sheet .body { overflow-y: auto; padding: 16px 20px 40px; display: grid; gap: 20px; align-content: start; }
.sheet section h4 { font: 700 13px var(--body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 8px; }
.ing { list-style: none; margin: 0; padding: 0; display: grid; }
.ing li { padding: 7px 0 7px 26px; border-bottom: 1px dashed var(--line); position: relative; cursor: pointer; overflow-wrap: anywhere; }
.ing li::before { content: ""; position: absolute; left: 2px; top: 11px; width: 14px; height: 14px; border: 1.5px solid var(--muted); border-radius: 4px; }
.ing li.done { color: var(--muted); text-decoration: line-through; }
.ing li.done::before { background: var(--ok); border-color: var(--ok); }
.ing li .q { font-weight: 600; font-variant-numeric: tabular-nums; }
.ing li .q.scaled { color: var(--accent); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 8px; }
.steps li::before { content: counter(s); font: 700 13px var(--display); background: var(--accent-soft); color: var(--accent); width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center; margin-top: 1px; }
.note { background: var(--warn-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.note.mk { background: var(--mk-soft); }
.stags { display: flex; flex-wrap: wrap; gap: 6px; }
.stags button { font: 500 12.5px var(--body); padding: 4px 10px; border-radius: 999px; background: var(--chip); border: 0; color: var(--ink); cursor: pointer; }
details.cap summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
details.cap pre { white-space: pre-wrap; font: 13.5px/1.55 var(--body); color: var(--ink); background: var(--bg); padding: 12px; border-radius: 10px; margin: 10px 0 0; overflow-wrap: anywhere; }

/* Portions */
.portions { display: grid; gap: 8px; background: var(--bg); border-radius: 12px; padding: 12px; }
.portions .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.portions .lbl { font-weight: 600; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); }
.stepper button { width: 40px; height: 38px; border: 0; background: none; color: var(--ink); font-size: 20px; cursor: pointer; border-radius: 10px; }
.stepper output { min-width: 34px; text-align: center; font: 700 18px var(--display); font-variant-numeric: tabular-nums; }
.portions small { color: var(--muted); font-size: 13px; }
.portions select { font: 600 13px var(--body); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 2px 4px; }

/* Edit form */
.form { display: grid; gap: 14px; }
.form label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.form input, .form textarea, .form select { font: 400 15px var(--body); color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; min-width: 0; }
.form textarea { resize: vertical; min-height: 110px; line-height: 1.45; }
.form input:focus, .form textarea:focus, .form select:focus { border-color: var(--mk); outline: none; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ingrows { display: grid; gap: 6px; }
.ingrow { display: grid; grid-template-columns: 54px 88px minmax(0, 1fr) 34px; gap: 6px; align-items: center; }
.ingrow input { padding: 7px 8px; font-size: 14.5px; }
.ingrow .rm { width: 34px; height: 34px; border: 0; border-radius: 8px; background: var(--chip); color: var(--muted); cursor: pointer; font-size: 18px; }
.inghead { display: grid; grid-template-columns: 54px 88px 1fr 34px; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.formbar { display: flex; gap: 8px; flex-wrap: wrap; position: sticky; bottom: -40px; background: var(--surface); padding-block: 10px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.help ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 6px; }
.help code { background: var(--chip); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
.status { font-size: 14px; padding: 8px 10px; border-radius: 10px; background: var(--chip); }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.status.err { background: var(--warn-soft); color: var(--warn); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } .drawer { animation: none; } }
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="brand">
      <button class="menu-btn" id="menuBtn" aria-label="Otevřít menu" aria-controls="drawer" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="viewTitle">Papu <span>kuchařka</span></h1>
      <div class="count" id="count"></div>
    </div>
    <div class="searchrow">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Hledej jídlo, surovinu nebo autora… např. kuře rýže" autocomplete="off" aria-label="Hledat recepty">
        <button class="clear" id="clear" aria-label="Smazat hledání" hidden>×</button>
      </div>
      <button class="btn primary" id="random" title="Náhodný recept z aktuálního výběru">Co dneska?</button>
    </div>
    <div class="filters">
      <div class="chips" id="cats" role="group" aria-label="Kategorie"></div>
      <div class="chips" id="tags" role="group" aria-label="Štítky"></div>
      <div class="toggles">
        <label><input type="checkbox" id="onlyRecipe"> Jen s receptem</label>
        <label>Řadit <select id="sort"><option value="saved">od nejnovějších</option><option value="az">A–Z</option><option value="time">nejrychlejší</option></select></label>
      </div>
    </div>
  </div>
</header>

<main><div class="wrap">
  <div class="viewbar" id="viewbar" hidden></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
</div></main>

<div class="scrim" id="scrim" hidden></div>
<nav class="drawer" id="drawer" hidden aria-label="Menu">
  <div class="dhead">Papu <span>kuchařka</span></div>
  <button class="navitem" data-view="all"><span class="ico">🍲</span><span>Všechny recepty</span><span class="n" id="nAll"></span></button>
  <button class="navitem" data-view="fav"><span class="ico">★</span><span>Oblíbené</span><span class="n" id="nFav"></span></button>
  <button class="navitem mk" data-view="mk2"><span class="ico">✎</span><span>MK<sup>2</sup> kuchařka</span><span class="n" id="nMk"></span></button>
  <hr>
  <button class="navitem" id="openSync"><span class="ico">⇅</span><span>Synchronizace</span><span class="n" id="syncNav"></span></button>
  <div class="foot" id="drawerFoot"></div>
</nav>

<script>

rvings": null, "unsure": false}, {"i": 200, "url": "https://www.instagram.com/reel/DbRSrlsNIF3/", "author": "iamkatevelvet", "caption": "KUNG PAO jako z asijského bistra - recept je na 4/5 porcí 💥🔥\n\n800g kuřecích prsou, které okořeníš solí, pepřem a kořením na Čínu (v něm je i česnek a zázvor, případně tyto ingredience můžeš dát čerstvé) 😇\n\nZelenina - mražená Wok + čerstvá. (Nebo pouze čerstvá - paprika, cibule, pak choy) \n\nOmáčka - 150ml tmavé sojové, 50ml ustricove, volitelně trochu srirachi, 3 ČL cukru. \n\nPostup:\nNa rozpálenou pánev s trochou oleje daš nejprve mraženou zeleninu. \nAž trochu změkne, přidáš naložené maso.\nMaso necháš lehce zatáhnout a přidáš čerstvou zeleninu. \nPromícháš, přikryješ pokličkou a necháš společně změknout. \nPoté zaliješ připravenou omáčkou. Necháš pod pokličkou podusit cca 5 minut. \nNakonec přiliješ škrobovou vodu (150ml teplé vody + 1 PL škrobu)\nPo přiliti škrobové vody jen promícháš a sundáš z plotny, dál nevaříš, jinak z toho bude mít kejdu. \n\nDobrou chuť 💥🫶🏽", "title": "Kung pao kuře jako z bistra", "title_orig": "Kung Pao jako z asijského bistra", "category": "Hlavní jídlo", "tags": ["kuřecí", "asijské", "čínské", "zelenina", "wok", "rychlovka"], "ingredients": ["800 g kuřecích prsou", "sůl, pepř, koření na čínu (s česnekem a zázvorem)", "zelenina: mražená wok směs + čerstvá (paprika, cibule, pak choi)", "Omáčka: 150 ml tmavé sójové omáčky", "Omáčka: 50 ml ústřicové omáčky", "Omáčka: 3 lžičky cukru", "Omáčka: trocha srirachy (volitelně)", "150 ml teplé vody + 1 lžíce škrobu"], "steps": ["Maso nakrájej a okořeň solí, pepřem a kořením na čínu.", "Na rozpálené pánvi s olejem opeč mraženou zeleninu, až trochu změkne, přidej maso a nech ho zatáhnout.", "Přidej čerstvou zeleninu, promíchej, přikryj a nech změknout.", "Zalij omáčkou a pod pokličkou duš cca 5 minut.", "Přilij škrobovou vodu, promíchej a hned sundej z plotny, dál už nevař."], "recipe": "full", "note": "Na 4–5 porcí", "time_min": null, "servings": 4, "unsure  100g cukru. Pak si vem vykynuté těsto, rozválej ho, vykrájej placičky a ještě je uprostřed trošku pomačkej, a pomazej okraje žloutkem, doprostřed dej tvaroh, ovoce, a zasyp to drobenkou. Potom to peč na 160 stupňů cca 12-15 min až budou okraje lehce zlatavé. Horké koláče polij máslem smíchaným s rumem, a můžeš ochutnávat! 🍓\n\nNa 15 koláčů potřebuješ:\n\nTěsto:\n500g hladké mouky\n21g droždí \n250ml plnotučného mléka \n50g másla \n40g sádla (případně dej jen máslo)\n80g cukru \nšpetka soli\n2 žloutky \nkůra z jednoho citronu \n1 lžička vanilkového extraktu\n\nTvaroh:\n500g plnotučného tvarohu (vanička +kostka)\n1 vejce\n1 lžička vanilkového extraktu \n3 lžíce cukru moučka \n\nDrobenka:\n200g polohrubé mouky \n100g cukru\n120g másla \n\nOvoce:\n400g jahod\n400g borůvek \n\n+ 100g másla 40ml rumu na polití\n\n#pečení #kolace #cooking #food #czech", "title": "Moravské koláče s tvarohem a ovocem", "title_orig": "Moravské koláče", "category": "Pečivo", "tags": ["pečivo", "sladké", "koláče", "tvaroh", "kynuté těsto", "české", "jahody", "borůvky", "do trouby"], "ingredients": ["Těsto: 500 g hladké mouky", "Těsto: 21 g droždí", "Těsto: 250 ml plnotučného mléka", "Těsto: 50 g másla", "Těsto: 40 g sádla (nebo jen máslo)", "Těsto: 80 g cukru", "Těsto: špetka soli", "Těsto: 2 žloutky", "Těsto: kůra z 1 citronu", "Těsto: 1 lžička vanilkového extraktu", "Tvaroh: 500 g plnotučného tvarohu", "Tvaroh: 1 vejce", "Tvaroh: 1 lžička vanilkového extraktu", "Tvaroh: 3 lžíce moučkového cukru", "Drobenka: 200 g polohrubé mouky", "Drobenka: 100 g cukru", "Drobenka: 120 g másla", "Ovoce: 400 g jahod", "Ovoce: 400 g borůvek", "Na polití: 100 g másla", "Na polití: 40 ml rumu"], "steps": ["Do vlažného mléka dej lžíci cukru, 2 lžíce mouky a rozdrobené droždí, nech 15 min vzejít.", "V robotu míchej mouku, cukr, kvásek, sůl, rozpuštěné máslo se sádlem, žloutky, vanilku a citronovou kůru aspoň 10 minut; nech kynout 1,5 hodiny.", "Smíchej tvaroh s vejcem, cukrem a vanilkou.", "Připrav drobenku z mouky, másla a cukru.", "Těsto rozválej, vykrájej placky, uprostřed promačkni, okraje potři žloutkem, dej tvaroh, ovoce a drobenku.", "Peč na 160 °C 12–15 minut do zlatova.", "Horké koláče polij máslem smíchaným s rumem."], "recipe": "full", "note": "", "time_min": null, "servings": 15, "unsure": false}, {"i": 187, "url": "https://www.instagram.com/reel/Ct7ExrmpglN/", "author": "plantyou", "caption": "🎉💖😍VEGAN BURRITO BOWL by @PLANTYOU. FULL RECIPE on my site. 💯JUST SEARCH VEGAN TACO BOWL at plantyou dot com or PLANTYOU TACO BOWL on google :)\n.\nDelicious, nutritious and high in protein. You’re going to love it!💖Carleigh\n.\n#vegan #burritobowl #healthy #veganbowl #veganrecipe #veganbowls #plantbased #plantbasedrecipe #salad #ssaladrecipe #quickrecipe #simplerecipe #eatmoreplants #healthyeating #healthyfood", "title": "Veganská burrito miska", "title_orig": "Vegan burrito bowl", "category": "Hlavní jídlo", "tags": ["veganské", "vegetariánské", "rýže", "mexické", "high-protein", "zdravé"], "ingredients": [], "steps": [], "recipe": "none", "note": "Celý recept na webu plantyou.com (Vegan taco bowl)", "time_min": null, "servings": null, "unsure": false}, {"i": 188, "url": "https://www.instagram.com/reel/DVeGvtviN5J/", "author": "receptyodanicky", "caption": "Burrito patří mezi jídla, která jsou až překvapivě praktická. Jeho příprava je celkem rychlá, snadno si ho přizpůsobíte vlastním chutím a navíc se skvěle hodí i na nějaký ten meal prep. Což já sama teď celkem ocením, protože už plánuji, jaká jídla bych si mohla připravit na šestinedělí do mrazáku pro případ nouze a myslím, že takové burrito by vůbec nemuselo být špatné. \n\nIngredience:\n1 lžíce olivového oleje\n600 g mletého hovězího masa\n1 lžička mletého římského kmínu\n1 lžička sušené cibule\n1/2 lžičky sušeného česneku\n2 lžičky sladké papriky\n1/2 lžičky sušeného oregana\n2 lžíce rajčatového protlaku\n1 ½ lžíce kečupu\nsůl a pepř na dochucení\n\nNa rajčatovou salsu (pico de gallo):\n4 větší rajčata\n1 žlutá cibule\n2 hrsti čerstvého nasekaného koriandru\n1 jalapeño paprička\n1 limeta\nsůl\n\nK podávání:\n4 tortilly Ø 30cm\n400 g uvařené rýže\n1/2 hlávky ledového salátu\n100 g nastrouhaného sýra\n200 g rajčatové salsy\n100 g zakysané smetany\n\nCelý recept mám na blogu pod názvem “Šťavnaté burrito s hovězím masem”.\n\n#recept #recepty #vareni #receptyodanicky #burrito", "title": "Šťavnaté burrito s hovězím masem", "title_orig": "Burrito", "category": "Hlavní jídlo", "tags": ["hovězí", "mleté maso", "tortilla", "rýže", "mexické", "meal prep", "mražení"], "ingredients": ["1 lžíce olivového oleje", "600 g mletého hovězího masa", "1 lžička mletého římského kmínu", "1 lžička sušené cibule", "1/2 lžičky sušeného česneku", "2 lžičky sladké papriky", "1/2 lžičky sušeného oregana", "2 lžíce rajčatového protlaku", "1 1/2 lžíce kečupu", "sůl a pepř", "Salsa: 4 větší rajčata", "Salsa: 1 žlutá cibule", "Salsa: 2 hrsti čerstvého koriandru", "Salsa: 1 jalapeño paprička", "Salsa: 1 limeta", "Salsa: sůl", "4 tortilly (Ø 30 cm)", "400 g uvařené rýže", "1/2 hlávky ledového salátu", "100 g nastrouhaného sýra", "200 g rajčatové salsy", "100 g zakysané smetany"], "steps": ["Maso opeč s kořením, protlakem a kečupem.", "Připrav pico de gallo ze zbylých surovin.", "Tortilly naplň masem, rýží, salátem, sýrem, salsou a smetanou a zabal."], "recipe": "ingredients", "note": "Celý recept na blogu receptyodanicky; vhodné do mrazáku", "time_min": null, "servings": null, "unsure": false}, {"i": 189, "url": "https://www.instagram.com/reel/DeGrNyPT7Fi/", "author": "noaawilliams", "caption": "Crispy Bang Bang Salmon Bites 🔥Had to bring this one back, it’s still one of those dinners I can’t stop making 🤌🏼\n\nHigh protein, spicy, sweet and ready in under 30 minutes. You can customise your bowl with whatever veggies you have on hand too 🥰\n\nRecipe serves 2\n2 skinless, boneless salmon fillets, cut into cubes (240g)\n½ tsp salt\n1 tsp paprika\n1 garlic clove, minced\n1½ tbsp soy sauce\n½ tbsp brown sugar\n1 tsp sriracha\n1 tsp olive oil\n\nBang Bang sauce:\n60g light mayo\n2–3 tbsp sweet chilli sauce\n2 tsp sriracha\n\nTo serve:\nRice\nSliced cucumber\nJulienned carrot\nSesame seeds\nChopped spring onions\n\nToss the salmon with the seasonings and leave it to marinate for around 10 minutes while you mix the sauce ingredients together.\n\nAir fry the salmon bites at 200°C for 8–12 minutes, or until golden and crispy.\n\nServe over rice with your veggies, drizzle generously with Bang Bang sauce and finish with sesame seeds and spring onions.\n\nThe salmon bites are approximately 340 calories with 26g protein. The sauce makes 2–4 serves, then you can build your bowl however you like. If you’re tracking, simply add whatever you serve it with x\n\nLet me know if you try it 🥰\n\n#healthydinnerideas #salmonbowl #bangbangsalmon #highproteinmeals", "title": "Křupavé bang bang lososové kousky", "title_orig": "Crispy Bang Bang Salmon Bites", "category": "Hlavní jídlo", "tags": ["ryba", "losos", "rýže", "asijské", "airfryer", "high-protein", "rychlovka"], "ingredients": ["240 g lososa bez kůže a kostí (2 filety)", "1/2 lžičky soli", "1 lžička papriky", "1 stroužek česneku", "1 1/2 lžíce sójové omáčky", "1/2 lžíce hnědého cukru", "1 lžička srirachy", "1 lžička olivového oleje", "Omáčka: 60 g lehké majonézy", "Omáčka: 2–3 lžíce sladké chilli omáčky", "Omáčka: 2 lžičky srirachy", "rýže, okurka, mrkev, sezam, jarní cibulka na servírování"], "steps": ["Lososa nakrájej na kostky, promíchej s kořením a nech cca 10 minut marinovat.", "Smíchej ingredience na omáčku.", "Peč v airfryeru na 200 °C 8–12 minut do křupava.", "Podávej na rýži se zeleninou, omáčkou, sezamem a jarní cibulkou."], "recipe": "full", "note": "Kousky cca 340 kcal, 26 g bílkovin; omáčka vystačí na 2–4 porce", "time_min": 30, "servings": 2, "unsure": false}, {"i": 190, "url": "https://www.instagram.com/reel/DfZY2VNq9rG/", "author": "tessbegg", "caption": "Maple Sesame Tofu Crispy Rice Salad with a peanut butter dressing 🥜🌿\n\nServes 2-3\n\nRice:\n200g cooked rice, cooled (about 1 1/2 cups)\n2 tsp olive oil\n1 tsp low sodium soy sauce\n\nCrispy Maple Sesame Tofu:\n300g firm tofu\n1 tbsp maple syrup\n1 tsp soy sauce\n1 tbsp corn starch\n1 tbsp sesame seeds\n2 tsp olive oil\n\nOther:\n200g cooked edamame\n1 medium carrot, julienned\n1 medium cucumber, thinly sliced\n1/2 small red onion, thinly sliced\n1 avocado, sliced\n1 big handful fresh mint, chopped\n1 big handful fresh coriander, chopped\n\nDressing:\n2 tbsp smooth peanut butter\nJuice from 1/2 lime\n1 tbsp maple syrup\n1 tbsp soy sauce\n\nPreheat the oven to 200°C. Line two baking trays with baking paper.\n\nAdd the rice to a tray with the olive oil and soy sauce. Toss until evenly coated and spread the rice out in an even layer. Bake for 15-20 minutes (on the lower rack in the oven), until lightly golden - avoid overcooking.\n\nDice the tofu into cubes and add to a bowl with the maple syrup, olive oil, soy sauce, corn starch and sesame seeds. Toss until well coated. Spread the tofu out on the second tray and bake for 25 to 30 minutes, until golden and crisp.\n\nWhisk the peanut butter, lime juice, maple syrup and soy sauce together in a small bowl until smooth. You can adjust the texture by adding more peanut butter to thicken or some water to thin.\n\nAdd everything to a large salad bowl and drizzle over the peanut dressing, then toss and enjoy.\n\n#vegan #easyrecipes #salad #tofu #plantbased", "title": "Křupavý rýžový salát s javorovým tofu a arašídovým dresinkem", "title_orig": "Maple Sesame Tofu Crispy Rice Salad", "category": "Salát", "tags": ["tofu", "rýže", "veganské", "vegetariánské", "salát", "asijské", "do trouby", "edamame"], "ingredients": ["Rýže: 200 g uvařené vychladlé rýže", "Rýže: 2 lžičky olivového oleje", "Rýže: 1 lžička sójové omáčky", "Tofu: 300 g tvrdého tofu", "Tofu: 1 lžíce javorového sirupu", "Tofu: 1 lžička sójové omáčky", "Tofu: 1 lžíce kukuřičného škrobu", "Tofu: 1 lžíce sezamu", "Tofu: 2 lžičky olivového oleje", "200 g uvařeného edamame", "1 střední mrkev", "1 střední okurka", "1/2 malé červené cibule", "1 avokádo", "1 velká hrst máty", "1 velká hrst koriandru", "Dresink: 2 lžíce hladkého arašídového másla", "Dresink: šťáva z 1/2 limety", "Dresink: 1 lžíce javorového sirupu", "Dresink: 1 lžíce sójové omáčky"], "steps": ["Troubu předehřej na 200 °C, dva plechy vylož pečicím papírem.", "Rýži promíchej s olejem a sójovou omáčkou, rozprostři a peč 15–20 minut do lehkého zezlatnutí.", "Tofu nakrájej na kostky, promíchej s javorovým sirupem, olejem, sójovkou, škrobem a sezamem; peč 25–30 minut do křupava.", "Vyšlehej dresink (hustotu uprav arašídovým máslem nebo vodou).", "Vše smíchej v míse, zalij dresinkem a promíchej."], "recipe": "full", "note": "", "time_min": 50, "servings": 3, "unsure": false}, {"i": 191, "url": "https://www.instagram.com/reel/Dd-J7MzvkE2/", "author": "shredhappens", "caption": "💥SPICY LIME CHICKEN CRUNCH BOWL\n\nThis is one of my go-to healthy meals during my 150lb weight loss. It’s got so much going on, and it’s so good! This makes 4 servings, with each serving at 540 cals, 48g protein, 18 net carbs per serving.\n\nI used my high protein lowcarb @kaizenfoodco rice (it packs 20g protein and just 6 net carbs a serving!) but you can use regular or brown rice, quinoa or even cauliflower rice.\n\nThis is such a great healthy meal prep recipe, and SO good.\n\nHere is how I made it:\n\n1.Finely dice 1lb chicken thighs into small pieces. Add to a bowl and drizzle with 1/2 tsp avocado oil, 1 tbsp soy sauce. Season with salt, pepper, 1 tbsp garlic powder, 1 tbsp onion powder, 1 tbsp smoked paprika, the juice of half a large lime, 1/2 tbsp powdered monkfruit or sweetener, & optional: 1 tbsp gluten free flour or cornstarch. Mix well, then pop in the oven at 400F for 32 mins, or airfry at 400F for 22 mins. \n\n2.For the base, I used my Kaizen high protein lowcarb rice, but use any rice you like.\n\n3.For the salad/slaw, I thinly shredded 1/4 head cabbage with a mandolin, add it to a bowl with 3-4 thinly sliced Persian cucumbers, 1 thinly shredded carrot, 3 finely sliced scallions, 1 thinly sliced jalapeño (remove seeds  if you dont want it too spicy), and a large handful of roughly chopped cilantro. Add 1 tbsp sesame oil, 3 tbsp rice vinegar, 2 tbsp tamari or soy sauce, a pinch of salt and pepper, then mix really well, taste and adjust. I added 1 tbsp of toasted sesame seeds for a nice crunch.\n\n4.For the Spicy Lime Sauce, mix together 3 tbsp mayo, 2 tbsp sriracha, 1.5 tbsp unsweetened ketchup, the juice of half a lime, 1/4 tsp cayenne pepper, and 1/2 tsp powdered monkfrit. Mix well, taste, and add 2 tbsp of water to thin out the sauce if you wish.\n\nWhen you’re ready to eat, just assemble! I divided everything into 4 servings: I plated up 1 serving Kaizen lowcarb rice as the base, 4oz cooked chicken, a cup of slaw, drizzled a bit of sauce, topped with fresh cilantro & sesame seeds.\n\nIf you make it, be sure to let me know what you think on SHREDHAPPENS!\n\nENJOY!\n.\n.\n.\n.\n#healthyrecipes #highprotein #lowcarb #lowcarbrecipes #ketorecipes", "title": "Pikantní limetková kuřecí miska", "title_orig": "Spicy Lime Chicken Crunch Bowl", "category": "Hlavní jídlo", "tags": ["kuřecí", "rýže", "high-protein", "meal prep", "airfryer", "asijské", "zdravé", "low-carb"], "ingredients": ["450 g kuřecích stehen", "1/2 lžičky avokádového oleje", "1 lžíce sójové omáčky", "sůl, pepř", "1 lžíce česnekového prášku", "1 lžíce cibulového prášku", "1 lžíce uzené papriky", "šťáva z 1/2 velké limety", "1/2 lžíce sladidla (monkfruit)", "1 lžíce bezlepkové mouky nebo škrobu (volitelně)", "Slaw: 1/4 hlávky zelí", "Slaw: 3–4 okurky", "Slaw: 1 mrkev", "Slaw: 3 jarní cibulky", "Slaw: 1 jalapeño", "Slaw: velká hrst koriandru", "Slaw: 1 lžíce sezamového oleje", "Slaw: 3 lžíce rýžového octa", "Slaw: 2 lžíce tamari nebo sójové omáčky", "Slaw: 1 lžíce opečeného sezamu", "Omáčka: 3 lžíce majonézy", "Omáčka: 2 lžíce srirachy", "Omáčka: 1 1/2 lžíce kečupu bez cukru", "Omáčka: šťáva z 1/2 limety", "Omáčka: 1/4 lžičky kayenského pepře", "Omáčka: 1/2 lžičky sladidla", "Omáčka: 2 lžíce vody (volitelně)", "rýže na podávání"], "steps": ["Kuřecí stehna najemno nakrájej, smíchej s olejem, sójovkou a kořením.", "Peč v troubě na 200 °C 32 minut nebo v airfryeru na 200 °C 22 minut.", "Zelí, okurky, mrkev, jarní cibulku, jalapeño a koriandr smíchej s olejem, octem a sójovkou.", "Smíchej ingredience na omáčku.", "Servíruj na rýži s masem (cca 115 g), slawem, omáčkou a koriandrem."], "recipe": "full", "note": "540 kcal, 48 g bílkovin, 18 g čistých sacharidů na porci", "time_min": null, "servings": 4, "unsure": false}, {"i": 192, "url": "https://www.instagram.com/reel/Dd81zNgMMdw/", "author": "alenakhmil", "caption": "Beef Tacos with Guacamole 🌮\n\nIngredients:\nTortillas — 3\nGround beef — 150 g\nCheddar — 3 slices\nMozzarella — 60 g\nLettuce\n\nFor the guacamole:\nAvocado — 1/2\nTomato — 1/2\nFinely chopped onion — 1 tbsp\nFinely chopped parsley — 1 tbsp\nLime juice\nSalt & pepper\n\nSpread the ground beef evenly over each tortilla. Place meat-side down in a hot pan and cook until browned.\n\nFlip the tortilla, add Cheddar and mozzarella, fold in half and cook on both sides until golden and crispy and the cheese has melted.\n\nFor the guacamole, mash the avocado with a fork. Add finely chopped tomato, onion, parsley, lime juice, salt and pepper. Mix well.\n\nOpen the cooked tacos, add lettuce and guacamole, then serve.\n\nTacos de Carne con Guacamole 🌮\n\nIngredientes:\nTortillas — 3\nCarne picada de ternera — 150 g\nCheddar — 3 lonchas\nMozzarella — 60 g\nLechuga\n\nPara el guacamole:\nAguacate — 1/2\nTomate — 1/2\nCebolla picada — 1 cda\nPerejil picado — 1 cda\nZumo de lima\nSal y pimienta\n\nExtiende la carne picada sobre cada tortilla. Coloca la tortilla en una sartén caliente con la carne hacia abajo y cocina hasta que esté dorada.\n\nDale la vuelta, añade el cheddar y la mozzarella, dóblala por la mitad y cocina por ambos lados hasta que esté dorada y crujiente y el queso se haya derretido.\n\nPara el guacamole, aplasta el aguacate con un tenedor. Añade el tomate, la cebolla y el perejil finamente picados, zumo de lima, sal y pimienta. Mezcla bien.\n\nAbre los tacos, añade lechuga y guacamole, y sirve.\n\n#beeftacos #tacos #guacamole #tacorecipe #easyrecipes", "title": "Hovězí tacos s guacamole", "title_orig": "Beef Tacos with Guacamole", "category": "Hlavní jídlo", "tags": ["hovězí", "mleté maso", "tortilla", "sýr", "mexické", "rychlovka", "guacamole"], "ingredients": ["3 tortilly", "150 g mletého hovězího masa", "3 plátky cheddaru", "60 g mozzarelly", "salát", "Guacamole: 1/2 avokáda", "Guacamole: 1/2 rajčete", "Guacamole: 1 lžíce jemně nakrájené cibule", "Guacamole: 1 lžíce jemně nakrájené petrželky", "Guacamole: limetová šťáva", "Guacamole: sůl, pepř"], "steps": ["Mleté maso rozetři na tortilly a klaď masem dolů na horkou pánev, opeč dohněda.", "Obrať, přidej cheddar a mozzarellu, přeložit a opeč z obou stran dozlatova.", "Rozmačkej avokádo, přidej rajče, cibuli, petržel, limetu, sůl a pepř.", "Tacos otevři, přidej salát a guacamole."], "recipe": "full", "note": "", "time_min": null, "servings": null, "unsure": false}, {"i": 193, "url": "https://www.instagram.com/reel/DfO745_S3LK/", "author": "jasmin_alessia", "caption": "🥑🍣 SPICY SALMON CRUNCH BOWL ✨\n\nKnuspriger Reis, würziger Lachs, cremiges Dressing und frisches Gemüse – die perfekte Bowl für ein leckeres Mittag- oder Abendessen! 🤍\n\n🛒 ZUTATEN | 1 PORTION\n\n🐟 Lachs\n• 100 g Lachs ohne Haut\n• Salz, Pfeffer, Knoblauchpulver, Zwiebelpulver & Paprikapulver\n\n🍚 Knuspriger Reis\n• 50 g Reis (ungekocht)\n• Weniger als ½ TL Chiliöl\n• Etwas Chili & Paprikapulver\n• 1 EL Sojasoße\n• 1 TL Reisessig ohne Zucker\n\n🥣 Creamy Spicy Dressing\n• 1 EL Light-Mayonnaise\n• 2–3 EL Skyr\n• 1 TL Sriracha\n• ½ TL Honig\n• Paprikapulver & Salz\n\n🥑 Toppings\n• ½ kleine Avocado\n• 100 g Edamame\n• Ca. 150 g Gurke\n• Optional: Lauch, Sesam & schwarzer Kümmel\n\n👩🏼‍🍳 ZUBEREITUNG\n\n1️⃣ Reis kochen und mit Chiliöl, Gewürzen, Sojasoße und Reisessig vermischen. Im Airfryer knusprig backen.\n\n2️⃣ Lachs würfeln, würzen und bei ca. 200 °C im Airfryer vollständig durchgaren.\n\n3️⃣ Für das Dressing Light-Mayo, Skyr, Sriracha, Honig und Gewürze cremig verrühren.\n\n4️⃣ Gurke und Avocado schneiden, mit den Edamame in eine Bowl geben. Knusprigen Reis und Lachs hinzufügen.\n\n5️⃣ Dressing darübergeben und genießen! 🤤\n\n📊 NÄHRWERTE | ca. pro Portion\n\n🔥 725 kcal\n💪 44 g Protein\n🍚 69 g Kohlenhydrate\n🥑 28 g Fett\n\nGeschätzte Nährwerte ohne Sesam, schwarzen Kümmel und Lauch. Je nach Marke und tatsächlicher Menge können die Werte abweichen.\n\nSpeichere dir das Rezept für deine nächste Bowl! 🫶🏼\n\n#salmonbowl #highprotein #proteinreich #healthyrecipes #foodinspo bowlrecipe airfryerrecipes easyrecipes gesunderezepte mealideas", "title": "Pikantní lososová miska", "title_orig": "Spicy Salmon Crunch Bowl", "category": "Hlavní jídlo", "tags": ["ryba", "losos", "rýže", "airfryer", "high-protein", "asijské", "edamame"], "ingredients": ["100 g lososa bez kůže", "sůl, pepř, česnekový, cibulový a paprikový prášek", "50 g rýže (nevařené)", "méně než 1/2 lžičky chilli oleje", "chilli, paprikový prášek", "1 lžíce sójové omáčky", "1 lžička rýžového octa bez cukru", "1 lžíce lehké majonézy", "2–3 lžíce skyru", "1 lžička srirachy", "1/2 lžičky medu", "paprikový prášek, sůl", "1/2 malého avokáda", "100 g edamame", "150 g okurky", "pórek, sezam, černý kmín (volitelně)"], "steps": ["Rýži uvař, smíchej s chilli olejem, kořením, sójovkou a octem a upeč do křupava v airfryeru.", "Lososa nakrájej na kostky, ochuť a udělej v airfryeru na cca 200 °C do úplného propečení.", "Vymíchej dresink z majonézy, skyru, srirachy, medu a koření.", "Okurku a avokádo nakrájej, dej do misky s edamame, křupavou rýží a lososem.", "Zalij dresinkem."], "recipe": "full", "note": "725 kcal, 44 g bílkovin, 69 g sacharidů, 28 g tuku na porci", "time_min": null, "servings": 1, "unsure": false}, {"i": 194, "url": "https://www.instagram.com/reel/Det9mksN9HU/", "author": "gulnar.gun", "caption": "Sebzeli Dürüm \n\nMalzemeler\n\n* 1 adet kabak\n* 1 adet havuç\n* 2 adet yumurta\n* 2 dolu yemek kaşığı rendelenmiş kaşar peyniri\n* Tuz\n* Üzeri için susam ve çörek otu\n\nHazırlanışı\n\nKabak ve havucu rendeleyin. Kabağın suyunu sıkıp yumurta, kaşar peyniri ve tuzla karıştırın. Yağlı kâğıt serili tepsiye ince bir tabaka hâlinde yayın. Üzerine susam ve çörek otu serpip 180°C fırında kızarana kadar pişirin.\n\nBiraz ılıdıktan sonra içine dilediğiniz malzemeleri koyup sarın.\n\nAfiyet olsun! ❤️\n\n⸻\n Vegetable Wrap \n\nIngredients\n\n* 1 zucchini\n* 1 carrot\n* 2 eggs\n* 2 heaping tablespoons grated cheese\n* Salt\n* Sesame seeds and black cumin seeds for topping\n\nInstructions\n\nGrate the zucchini and carrot. Squeeze out the excess water from the zucchini. Mix with eggs, cheese, and salt. Spread thinly onto a baking tray lined with parchment paper. Sprinkle with sesame and black cumin seeds. Bake at 180°C (356°F) until golden brown.\n\nLet it cool slightly, add your favorite fillings, and roll it up.\n\nEnjoy! ❤️\n\n#SebzeliDürüm #PratikTarifler #VegetableWrap #EasyRecipes", "title": "Zeleninový wrap z cukety a mrkve", "title_orig": "Sebzeli Dürüm", "category": "Hlavní jídlo", "tags": ["vegetariánské", "vejce", "sýr", "cuketa", "mrkev", "do trouby", "zdravé", "low-carb"], "ingredients": ["1 cuketa", "1 mrkev", "2 vejce", "2 vrchovaté lžíce strouhaného sýra", "sůl", "sezam a černý kmín na posypání"], "steps": ["Cuketu a mrkev nastrouhej, z cukety vymačkej vodu.", "Smíchej s vejci, sýrem a solí.", "Rozetři tence na plech s pečicím papírem, posyp sezamem a černým kmínem.", "Peč při 180 °C do zezlatnutí.", "Lehce vychladlé naplň oblíbenou náplní a zabal."], "recipe": "full", "note": "", "time_min": null, "servings": null, "unsure": false}, {"i": 195, "url": "https://www.instagram.com/reel/DftJrSpSuK_/", "author": "foodbybrandon_", " d effortless to make. It’s gluten free, vegan and high protein. It’s a dish that will satisfy everyone’s requirements!\n\nIngredients:\n2 tbsp oil\n1 onion, diced\n1 tsp garlic paste\n1 tsp ginger paste\nPinch of asafoetedia\n100g chopped tomato tin\nSeasonings (1 tsp cumin powder, 1 tsp coriander powder, 1/2 tsp turmeric, 1/2 tsp chilli powder, 1/8 tsp cinnamon powder, 1/8 tsp black pepper powder, 1/8 tsp garam masala, 1 tsp salt, 1.5 tsp sugar)\n400g chickpea\n200ml coconut milk\n\nMethod:\n1. Heat some oil in a pan and add the onions, garlic paste, ginger paste and asafoetida\n2. Once the onion has cooked add the tomatoes and seasoning powders\n3. Let this cook for around 5 mins\n4. Add the chickpeas and coconut milk\n5. Let this cook for at least 15 mins. You can add water according to the consistency you like \n6. Garnish with more coconut milk and coriander\n7. Enjoy!\n\nAD\n\n#chickpea #chickpeacurry #vegancurry #glutenfreecurry #proteinmeal #veganinspo", "title": "Krémové cizrnové kari", "title_orig": "Creamy Chickpea Curry", "category": "Hlavní jídlo", "tags": ["cizrna", "kari", "indické", "veganské", "high-protein", "kokosové mléko", "jeden hrnec"], "ingredients": ["2 lžíce oleje", "1 cibule nakrájená na kostičky", "1 lžička česnekové pasty", "1 lžička zázvorové pasty", "špetka asafoetidy", "100 g krájených rajčat z plechovky", "Koření: 1 lžička mletého kmínu, 1 lžička mletého koriandru, 1/2 lžičky kurkumy, 1/2 lžičky chilli, 1/8 lžičky skořice, 1/8 lžičky černého pepře, 1/8 lžičky garam masala, 1 lžička soli, 1,5 lžičky cukru", "400 g cizrny", "200 ml kokosového mléka", "Na ozdobu: kokosové mléko, koriandr"], "steps": ["Na oleji osmahni cibuli s česnekovou a zázvorovou pastou a asafoetidou.", "Když je cibule hotová, přidej rajčata a koření a vař asi 5 minut.", "Přidej cizrnu a kokosové mléko a vař aspoň 15 minut, podle potřeby přilej vodu.", "Ozdob kokosovým mlékem a koriandrem."], "recipe": "full", "note": "Bez lepku, veganské", "time_min": 25, "unsure": false, "servings": null}, {"i": 168, "url": "https://www.instagram.com/reel/DZuY67PxQ_h/", "author": "fadwahilili", "caption": "Coconut Chicken Curry\n2 lbs chicken breast cut into cubes\nNeutral oil\n1 large onion diced\n2 tablespoons ginger garlic paste\n1 small can tomato paste\n2-3 green chilies diced\n1 tablespoon garam masala\n1 tablespoon curry powder\n1 tablespoon @fadwamasala Korma Masala (optional)\n1 tablespoon coriander powder\n1/2 tablespoon cumin powder\n1 tsp turmeric\n1/2 tsp black pepper\n1/2 tsp hot red chili powder or to taste\n1 tsp salt or to taste \n1 can unsweetened coconut milk\nHandful chopped cilantro\n\n#curry #dinner #desi", "title": "Kuřecí kari s kokosovým mlékem", "title_orig": "Coconut Chicken Curry", "category": "Hlavní jídlo", "tags": ["kuřecí", "kari", "indické", "kokosové mléko", "pálivé"], "ingredients": ["900 g kuřecích prsou na kostky", "neutrální olej", "1 velká cibule na kostičky", "2 lžíce zázvorovo-česnekové pasty", "1 malá plechovka rajčatového protlaku", "2–3 zelené chilli papričky", "1 lžíce garam masala", "1 lžíce kari koření", "1 lžíce korma masala (volitelně)", "1 lžíce mletého koriandru", "1/2 lžíce mletého kmínu", "1 lžička kurkumy", "1/2 lžičky černého pepře", "1/2 lžičky pálivého chilli (podle chuti)", "1 lžička soli", "1 plechovka neslazeného kokosového mléka", "hrst čerstvého koriandru"], "steps": [], "recipe": "ingredients", "note": "Postup jen ve videu", "time_min": null, "unsure": false, "servings": null}, {"i": 169, "url": "https://www.instagram.com/reel/C-qxe0NSeZX/", "author": "createaplatewithdina", "caption": "30 Minute Thai Red Curry ✨\n1.5 lbs chicken thighs, boneless skinless\n6 ounces green beans, cut into thirds\n1 large red bell pepper, sliced\n1/2 medium onion, sliced\n3 garlic cloves, grated\n1 tsp ginger, grated\n4 Tbs red curry paste \n13.5 oz can coconut milk \n1/2 can water (use can from coconut milk)\n1 tsp fish sauce\n1/4 cup water + 1 tsp cornstarch \nJuice from one lime \n5 basil leaves, chopped \n2 Tbs cilantro, chopped \n1 tsp Salt, more to taste\n1/4 Black pepper \n1 Tbs coconut oil or avocado oil \n\n1. To a hot skillet add coconut oil, grated garlic, grated ginger, and red curry paste. Allow to cook for 1-2 minutes then add thinly sliced chicken thighs, 1/2 tsp salt, 1/4 tsp black pepper and saute 3 minutes.\n2. Add in the sliced bell pepper, chopped green beans, sliced onions, coconut milk, and half a can of water (use can from the coconut milk). \n3. Season with 1/2 tsp salt and bring to a simmer. Allow to cook 5-6 mins or until the chicken is completely cooked through. Squeezing in the juice from the lime, pour in the cornstarch slurry (1/4 cup water mixed with 1 tsp cornstarch), and fish sauce. \n4. Stir together and allow to simmer a couple of minutes so the curry can thicken a bit. Finally garnished with chopped cilantro and basil. Taste and season more if you’d like. Serve with a side of rice, extra lime slices, cilantro, and basil. Enjoy.\n\n#thairedcurry #curry #30minutemeals #easyrecipe", "title": "Thajské červené kari s kuřecím za 30 minut", "title_orig": "30 Minute Thai Red Curry", "category": "Hlavní jídlo", "tags": ["kuřecí", "kari", "thajské", "asijské", "kokosové mléko", "rychlovka"], "ingredients": ["680 g vykostěných kuřecích stehen", "170 g zelených fazolek, nakrájených na třetiny", "1 velká červená paprika na proužky", "1/2 cibule na plátky", "3 stroužky česneku, nastrouhané", "1 lžička nastrouhaného zázvoru", "4 lžíce červené kari pasty", "1 plechovka (400 ml) kokosového mléka", "1/2 plechovky vody", "1 lžička rybí omáčky", "60 ml vody + 1 lžička kukuřičného škrobu", "šťáva z 1 limetky", "5 lístků bazalky", "2 lžíce koriandru", "1 lžička soli, 1/4 lžičky pepře", "1 lžíce kokosového nebo avokádového oleje"], "steps": ["Na rozpáleném oleji 1–2 min opékej česnek, zázvor a kari pastu, přidej na tenko nakrájená stehna, 1/2 lžičky soli a pepř a restuj 3 min.", "Přidej papriku, fazolky, cibuli, kokosové mléko a půl plechovky vody.", "Osol, přiveď k varu a vař 5–6 min, dokud kuře není hotové. Přidej limetkovou šťávu, škrob rozmíchaný ve vodě a rybí omáčku.", "Nech pár minut zhoustnout, ozdob koriandrem a bazalkou. Podávej s rýží a limetkou."], "recipe": "full", "note": "", "time_min": 30, "unsure": false, "servings": null}, {"i": 170, "url": "https://www.instagram.com/reel/DPeZF3ACHpi/", "author": "_klaraberisha", "caption": "Ingredience:\n\t•\t2 kuřecí prsa\n\t•\t2-3 stroužky česneku (nasekané nadrobno)\n\t•\tred thai curry pasta\n\t•\t2 lžíce křupavého arašídového másla\n\t•\t1 lžíce sójové omáčky\n\t•\t1 plechovka kokosového mléka\n\t•\tcca 500 ml kuřecího vývaru\n\t•\tnudle dle chuti (udon, ramen)\n\t•\tsezamová semínka, čerstvý koriandr, limetka\n\n⸻\n\nPostup:\n\t1.\tKuře osmahni:\nKuřecí prsa lehce osol a opepři. Na pánvi je zprudka osmahni dozlatova ze všech stran – jen tak, aby se zatáhla, nemusí být úplně hotová. Vyjmi je a dej stranou.\n\t2.\tPřiprav omáčku:\nNa té samé pánvi nech zbylý tuk a přidej nasekaný česnek. Krátce osmahni, aby se rozvoněl.\nPak přidej thajskou pastu, arašídové máslo, sójovou omáčku, kokosové mléko a vývar. Vše dobře promíchej, až vznikne hladká omáčka.\n\t3.\tUvař kuře v omáčce:\nVrať kuřecí prsa do pánve a nech je v omáčce vařit asi cca 15 minut. Poté je vyjmi a nakrájej na plátky.\n\t4.\tPřidej nudle:\nDo omáčky vlož nudle podle výběru a nech je povařit, dokud nejsou hotové.\n\t5.\tServíruj:\nNudle s omáčkou naservíruj do misek, přidej nakrájené kuře, posyp sezamovými semínky, čerstvým koriandrem a zakápni limetkou, případně přidej chilli olej.", "title": "Thajské kari nudle s kuřecím a arašídovým máslem", "title_orig": "", "category": "Hlavní jídlo", "tags": ["kuřecí", "nudle", "thajské", "asijské", "arašídy", "kokosové mléko"], "ingredients": ["2 kuřecí prsa", "2–3 stroužky česneku nasekané nadrobno", "červená thajská kari pasta", "2 lžíce křupavého arašídového másla", "1 lžíce sójové omáčky", "1 plechovka kokosového mléka", "cca 500 ml kuřecího vývaru", "nudle podle chuti (udon, ramen)", "sezam, čerstvý koriandr, limetka"], "steps": ["Kuřecí prsa osol, opepři a zprudka opeč ze všech stran dozlatova, vyndej.", "Na zbylém tuku krátce osmahni česnek, přidej kari pastu, arašídové máslo, sójovou omáčku, kokosové mléko a vývar a rozmíchej do hladka.", "Vrať kuře do omáčky a vař cca 15 min, pak vyndej a nakrájej na plátky.", "V omáčce uvař nudle.", "Podávej v miskách s kuřetem, sezamem, koriandrem a limetkou, případně s chilli olejem."], "recipe": "full", "note": "", "time_min": null, "unsure": false, "servings": null}, {"i": 171, "url": "https://www.instagram.com/reel/C9-ZeI4ME6M/", "author": "lukishek", "caption": "Thai red curry 🍛\n\nThajské červené kari s kokosovým mlékem je celkem klasika každého asijského bistra. Já ho miluju pro tu sladko-pálivou chuť, která je zároveň jemná, a krémová díky kokosovýmu mléku. Připravil jsem vám recept, jak si ho doma připravit rychle a jednoduše, že prakticky nepoznáte rozdíl. \n\nNejdřív si dej vařit propláchnutou rýži do rýžovaru, nebo pokud rýžovar nevlastníš, tak si ji připrav jiným způsobem. Hlavní je osolit vodu, případně dokořenit pepřem. Potom si nakrájej všechno potřebné: cuketu, papriky, brokolici, (případně mrkev či jinou oblíbenou zeleninu). Pak si do wok pánve dej kokosový (či jiný rostlinný) olej a na něj si nakrájenými zázvor a česnek. Potom přidej kari červenou pastu, maso a kokosové mléko a takhle to zarestuj. Pak už stačí přidat sůl, cukr, a citronovou trávu a můžeš tam naházet veškerou zeleninu, přilít trošku vývaru a další kokosové mléko. Pokud jsi fajnšmekr, tak to můžeš dochutit ještě lžíci rybí a sójové omáčky. Potom to už jen nech chvilku dusit (5-10 min) né více, jinak se ti rozvaří zelenina, a můžeš to servírovat. \n\nRecept jsem natočil ve spolupráci s @vilgainczsk @aktin  kde najdeš všechny důležité suroviny jako je kokosové mléko, vývar, kari pastu nebo třeba skvělou rýži.  Tak nabíhej a kupuj na Aktin.cz \n\nPotřebuješ na 2 porce:\n\n1 konzerva kokosového mléka\n200g rýže basmati\n300g kuřecího masa\n1 papriku\n1/2 cukety\n1/2 brokolice\n2 stroužky česneku \nkari pastu (2 lžíce)\nTrošku zázvoru\n2 kusy citronové trávy\nsůl, pepř, cukr\n\n#czech #recipe #recept #food #chef #fyp #foodporn #cooking #viral #kari #thai #curry #streetfood #rice #kuchyne #maso #thairedcurry", "title": "Thajské červené kari s kuřecím a zeleninou", "title_orig": "Thai red curry", "category": "Hlavní jídlo", "tags": ["kuřecí", "kari", "thajské", "asijské", "rýže", "kokosové mléko", "zelenina"], "ingredients": ["1 plechovka kokosového mléka", "200 g rýže basmati", "300 g kuřecího masa", "1 paprika", "1/2 cukety", "1/2 brokolice", "2 stroužky česneku", "2 lžíce červené kari pasty", "kousek zázvoru", "2 stonky citronové trávy", "sůl, pepř, cukr", "trocha vývaru", "volitelně rybí a sójová omáčka"], "steps": ["Uvař propláchnutou rýži v osolené vodě.", "Nakrájej cuketu, papriku, brokolici (případně další zeleninu).", "Ve woku na kokosovém oleji osmahni zázvor a česnek, přidej kari pastu, maso a kokosové mléko a orestuj.", "Přidej sůl, cukr, citronovou trávu, zeleninu, trochu vývaru a zbytek kokosového mléka. Můžeš dochutit rybí a sójovou omáčkou.", "Duš 5–10 minut, ne déle, aby se zelenina nerozvařila."], "recipe": "full", "note": "Na 2 porce", "time_min": null, "unsure": false, "servings": 2}, {"i": 172, "url": "https://www.instagram.com/reel/DgFIn_RtJB7/", "author": "julie.polakova", "caption": "🥢 KUŘECÍ LETNÍ ZÁVITKY S ARAŠÍDOVÝM DIPEM\n\nJestli už tě nebaví pořád dokola kuře s rýží, PLEASE zkus tohle. 😭🫶🏼 Svěží, křupavé, lehce spicy a ten arašídový dip tomu dává úplně všechno.\n\nNa 1 porci / 4 závitky:\n• 120 g kuřecí prso\n• 4 ks rýžový papír\n• 30 g rýžové nudle\n• 40 g mrkev\n• 80 g salátová okurka\n• 80 g červená paprika\n• 40 ml sweet chilli omáčka\n• 20 ml sójová omáčka\n• 80 g řecký jogurt 0 %\n• 10 g arašídové máslo\n• sůl, pepř a chilli podle chuti\n\nPostup:\nRýžové nudle připrav podle návodu. Kuře nakrájej na proužky, ochuť čá  nevíš, kolik kcal je pro tebe vhodné, pomůže ti kalorická kalkulačka. 💪\n\n👉 herohero.co/udrzitelnefit\n\n🥜🥡🥢 RYCHLÉ ARAŠÍDOVÉ NUDLE S KUŘETEM\n\nCo budeš potřebovat na 3 porce:\n- 3 hnízda nudlí (cca 188 g) -  můžou být pšeničné či rýžové\n- 300 g kuřecího masa (dala jsem vykostěná stehna z kukuřičného kuřete)\n- sůl\n- teriyaki omáčka (cca 2 polévkové lžíce)\nNa omáčku:\n- 2 lžíce arašídového másla (40 g)\n- 2 lžíce jarní cibulky\n- chilli papričky dle chuti\n- 1 lžíce sezamového semínka (10 g)\n- 1 větší stroužek česneku\n- 1/2 menší šalotky\n- půl lžičky čerstvého zázvoru\n- 2 lžíce sójové omáčky\n- 2 lžíce rybí omáčky\n- 1 lžička sezamového oleje\n- horká voda dle konzistence\nNavrch\n- smažená cibulka\n- jarní cibulka\n\nKuřecí maso očistím, osolím a nechám proležet v teriyaki omáčce aspoň 30 minut. \nMarinované maso přendám do HF, zapnu program GRILL na 190 stupňů na 13 minut.\nNudle uvařím dle návodu na obalu.\nDo pánve dám arašídové máslo, nakrájenou jarní cibulku, chilli papričku, sezam, najemno nakrájený česnek a šalotku, najemno nastrouhaný zázvor.\nPřiliju sójovou a rybí omáčku, sezamový olej a horkou vodu.\nPánev dám na plotýnku a promíchám do omáčkové konzistence.\nPřimíchám uvařené nudle, na talíři posypu smaženou cibulkou, jarní cibulkou a přidám opečené maso.\n\nVýživové hodnoty na 1 porci:\n500 kcal / 2092 kJ, 35 g bílkovin, 54 g sacharidů, 16 g tuků, 1 g vlákniny\n\n#receptipyodzuzky #recept #noodles #peanutbutter #asia", "title": "Rychlé arašídové nudle s kuřetem", "title_orig": "Rychlé arašídové nudle s kuřetem", "category": "Hlavní jídlo", "tags": ["kuřecí", "nudle", "asijské", "arašídy", "airfryer", "high-protein"], "ingredients": ["3 hnízda nudlí (cca 188 g), pšeničné nebo rýžové", "300 g kuřecího masa (vykostěná stehna)", "sůl", "cca 2 lžíce teriyaki omáčky", "Omáčka: 2 lžíce arašídového másla (40 g)", "2 lžíce jarní cibulky", "chilli papričky podle chuti", "1 lžíce sezamu (10 g)", "1 větší stroužek česneku", "1/2 menší šalotky", "1/2 lžičky čerstvého zázvoru", "2 lžíce sójové omáčky", "2 lžíce rybí omáčky", "1 lžička sezamového oleje", "horká voda podle konzistence", "Navrch: smažená cibulka, jarní cibulka"], "steps": ["Kuře osol a nech aspoň 30 min marinovat v teriyaki omáčce.", "Peč v horkovzdušné fritéze na programu GRILL 190 °C 13 minut.", "Uvař nudle podle návodu.", "Na pánvi smíchej arašídové máslo, jarní cibulku, chilli, sezam, česnek, šalotku a zázvor, přilij sójovou a rybí omáčku, sezamový olej a horkou vodu a zahřej do omáčky.", "Vmíchej nudle, posyp smaženou a jarní cibulkou a přidej kuře."], "recipe": "full", "note": "3 porce, 1 porce: 500 kcal, 35 g bílkovin, 54 g sacharidů, 16 g tuků", "time_min": 45, "unsure": false, "servings": 3}, {"i": 0, "url": "https://www.instagram.com/reel/DeumIDXS8Bu/", "author": "recipeincaption", "caption": "Dumpling Lasagna 🇨🇳🇮🇹 \n\nComment “Recipe” and I’ll send you the full recipe card for free!!\n\nFor ALL of you asking about the app I made, just search “Osta” on the app or play store. It is free & makes cooking social media recipes way easier 🙏\n\nHomemade dumplings meet homemade lasagna 🤝… dare I say easier, quicker, and better than both? 👀\n\nIngredients: -1 lb (450 g) ground chicken or pork -1/2 cup green onions, chopped -6 garlic cloves, minced -3 tbsp soy sauce -1 tbsp rice vinegar -1 tbsp toasted sesame oil -2 tbsp chili crunch -1 tbsp fresh ginger, grated -1 tbsp oyster sauce -18 to 24 wonton or dumpling wrappers -2 tbsp chicken stock (or water)\nFor Garnish: -Soy sauce -Chili crunch -Green onions, sliced -Sesame seeds\n\nInstructions:\n1. In a bowl, combine the ground chicken or pork with the green onions, garlic, soy sauce, rice vinegar, sesame oil, Chili Crunch, ginger, and oyster sauce. Mix with your hands until just combined.\n2. Set up a steamer over a pot of gently boiling water. If you don’t have a steamer, simply place a heat-safe rack or trivet inside a large pot instead. Make sure your baking dish fits comfortably inside & the lid can fully close (I used an 8×8-inch dish). Keep the water level below the baking dish.\n3. Briefly dip each wrapper in water for just 1–2 secs, then arrange a layer across the bottom of your dish. I used 6 wrappers per layer. Overlap them as needed to completely cover the bottom… the overlap actually helps everything hold together.\n4. Spread a thin layer of the meat mixture over the wrappers. Repeat with wrappers and meat until everything is used. I made 4 layers, but work with whatever fits your dish. Finish with a final layer of wrappers, then pour the chicken stock evenly over top.\n5. Carefully place the dish into your steamer, cover, & steam for 20–22 mins, keeping the water at a gentle boil. Remove once the meat is cooked through & the top is glossy.\n6. Finish with a drizzle of soy sauce, plenty of chili crunch, sliced green onions, and sesame seeds. Slice it up like lasagna and enjoy this new family favorite!", "title": "Knedlíková lasagne", "title_orig": "Dumpling Lasagna", "category": "Hlavní jídlo", "tags": ["kuřecí", "vepřové", "mleté maso", "knedlíčky", "asijské", "italské", "vaření v páře", "rychlovka"], "ingredients": ["450 g mletého kuřecího nebo vepřového masa", "30 g jarní cibulky, nasekané", "6 stroužků česneku, jemně nasekaných", "3 lžíce sójové omáčky", "1 lžíce rýžového octa", "1 lžíce pražený sezamový olej", "2 lžíce chilli crunch", "1 lžíce čerstvého zázvoru, strouhaného", "1 lžíce ústřicové omáčky", "18–24 plátků těsta na wonton/knedlíčky", "2 lžíce kuřecího vývaru (nebo vody)", "Na ozdobu: sójová omáčka, chilli crunch, jarní cibulka, sezamová semínka"], "steps": ["Smíchat maso s cibulkou, česnekem, sójovkou, octem, sezamovým olejem, chilli crunch, zázvorem a ústřicovou omáčkou.", "Připravit parní hrnec (nebo rošt v hrnci) tak, aby se dovnitř vešla zapékací miska (cca 20×20 cm); hladina vody pod miskou.", "Plátky těsta krátce (1–2 s) namočit do vody a vyskládat na dno misky s přesahem (cca 6 na vrstvu).", "Přidat tenkou vrstvu masové směsi; stř o #NepaleseMomo #NepaleseKeuken NepaliFood Dashain Tihar Deventer TasteOfNepal", "title": "Kuřecí momo (nepálské knedlíčky)", "title_orig": "Kip Momo", "category": "Snack / předkrm", "tags": ["kuřecí", "knedlíčky", "nepálské", "asijské"], "ingredients": [], "steps": [], "recipe": "none", "note": "Pouze popis (nizozemsky), bez receptu", "time_min": null, "unsure": false, "servings": null}, {"i": 7, "url": "https://www.instagram.com/reel/DcT8T7QNhiN/", "author": "lzickacukru", "caption": "Tyhle česnekovo medové kuřecí stripsy jsou teda jiný level 🤤\n\nKdo by neznal klasický kuřecí stripsy v lupínkách, já bych je klidně mohla mít tak minimálně jednou týdně, ale po ochutnání týhle varianty už asi jiný dělat nebudu 😁\n\nJsou křupavý, lepivý, sladko kyselo česnokovo čili skvělý, no prostě to ani nejde popsat, doporučuju vyzkoušet 😁\n\nTak kdo do nich půjde už teď o víkendu? 🙋‍♀️ Možná na ně máte u všechno doma! 🤔\n\nNa dvě porce potřebujete:\nNa stripsy:\n100 g kukuřičných lupínků\nlžičku a půl uzené papriky\nlžičku sušeného česneku\nlžičku sušené cibule\n1/3 lžičky sušené bazalky\nvejce\nlžíci srirachi\n600 g kuřecích prsou\navokádový olej ve spreji\nsůl a pepř\nNa omáčku:\n2 lžíce medu\n2 lžíce sladkokyselé omáčky\n2 stroužky česneku\n2 lžíce sójové omáčky\ntrocha nasekané petrželky\nKuřecí prsa nakrájejte na jednotlivé tenké stripsy, řádně je osušte a obalte ve směsi soli a koření. Kukuřičné lupínky rozmixujte na hrubou směs a nasypte je do misky ve druhé misce prošlehejte vajíčko a srirachu. Stripsy namočte ve vajíčku, a nakonec v lupínkách. Vložte je do fritézy tak, aby nebyly přes sebe, a postříkejte olejem ve spreji, já používám avokádový. \nDejte péct do fritézy na 180 °C na 15 minut, já ji nepředehřívám. Mezitím připravte omáčku, v pánvi smíchejte med, sladkokyselou omáčku, srirachu, prolisovaný česnek, sójovou omáčku a nasekanou petrželku a lehce zahřejte, aby vznikla tekutá omáčka. \nHotové stripsy v omáčce namočte a podávejte s vaším oblíbeným dipem.", "title": "Česnekovo-medové kuřecí stripsy ve fritéze", "title_orig": "česnekovo medové kuřecí stripsy", "category": "Hlavní jídlo", "tags": ["kuřecí", "stripsy", "airfryer", "křupavé", "med", "česnek"], "ingredients": ["100 g kukuřičných lupínků", "1,5 lžičky uzené papriky", "1 lžička sušeného česneku", "1 lžička sušené cibule", "1/3 lžičky sušené bazalky", "1 vejce", "1 lžíce srirachy", "600 g kuřecích prsou", "avokádový olej ve spreji", "sůl a pepř", "Omáčka: 2 lžíce medu", "2 lžíce sladkokyselé omáčky", "2 stroužky česneku", "2 lžíce sójové omáčky", "trocha nasekané petrželky"], "steps": ["Kuřecí prsa nakrájet na tenké stripsy, osušit a obalit ve směsi soli a koření.", "Lupínky rozmixovat nahrubo; ve druhé misce prošlehat vejce se srirachou.", "Stripsy namočit do vejce, pak obalit v lupíncích.", "Vložit do fritézy bez překrývání, postříkat olejem, péct 15 min na 180 °C (bez předehřátí).", "Na pánvi lehce zahřát med, sladkokyselou omáčku, česnek, sójovku a petrželku.", "Hotové stripsy obalit v omáčce, podávat s dipem."], "recipe": "full", "note": "Na 2 porce", "time_min": 15, "unsure": false, "servings": 2}, {"i": 8, "url": "https://www.instagram.com/reel/Dfm-MczoWbq/", "author": "mackanskost", "caption": "Kycklingrullader med pesto! 😍🍀 Vill du ha en så saftig, smakrik och bara himla god kyckling? Då måste du göra dom här enkla rulladerna! Tillsammans med pestosåsen blir det en festlig rätt att njuta av. Testa! 🥂\n\nKlicka på GILLA och sväng ihop dom här rulladerna! 💛\n\nDet du behöver är..\n600 g tunt skivade kycklingfiléer\n1 mozzarella\n1/2 kruka basilika\n3 dl matlagningsgrädde\n1 dl basilikapesto\nsalt & peppar\n+ tandpetare\n\nSkiva mozzarellan. Lägg ut dom tunt skivade kycklingfiléerna på en skärbräda. Bred på pesto på varje filé, lägg på en skiva mozzarella, basilika och salt & peppar. Rulla ihop och fäst en tandpetare. Hetta upp smör i en stekpanna och bryn på tills dom fått en fin färg. Blanda ihop grädde, pesto, salt & peppar. Häll det i stekpannan och låt kycklingen puttra tills den är klar igenom. Servera sedan med krispig potatis och en fräsch tomatsallad. Kommer du testa det här? 🥳 Hoppas! HEJ! 😍👋🏼", "title": "Kuřecí závitky s pestem", "title_orig": "Kycklingrullader med pesto", "category": "Hlavní jídlo", "tags": ["kuřecí", "pesto", "mozzarella", "smetana", "švédské", "závitky"], "ingredients": ["600 g tence nakrájených kuřecích filetů", "1 mozzarella", "1/2 květináče bazalky", "300 ml smetany na vaření", "100 ml bazalkového pesta", "sůl a pepř", "špejle", "máslo"], "steps": ["Mozzarellu nakrájet na plátky.", "Kuřecí filety potřít pestem, přidat mozzarellu, bazalku, sůl a pepř, zarolovat a zajistit špejlí.", "Na másle opéct dozlatova.", "Smíchat smetanu s pestem, solí a pepřem, nalít do pánve a dusit do propečení.", "Podávat s křupavými bramborami a rajčatovým salátem."], "recipe": "full", "note": "", "time_min": null, "unsure": false, "servings": null}, {"i": 9, "url": "https://www.instagram.com/reel/DfHy0BVtEvE/", "author": "eli.kotaskova", "caption": "Listové těsto ➡️ pistáciové máslo nebo jakýkoliv jiný oříškový, nutella ➡️ péct na 190 stupňů cca 15-20 minut ➡️ dle chuti po upečení namazat opět pistáciovým máslem, ja přidala ještě nadrcene pistácie a lyo maliny 😊", "title": "Pistáciové taštičky z listového těsta", "title_orig": "", "category": "Sladké", "tags": ["listové těsto", "pistáciové máslo", "do trouby", "rychlovka", "sladké"], "ingredients": ["listové těsto", "pistáciové máslo (nebo jiné oříškové), nutella", "nadrcené pistácie", "lyofilizované maliny"], "steps": ["Listové těsto potřít pistáciovým máslem nebo nutellou.", "Péct na 190 °C cca 15–20 minut.", "Po upečení opět potřít pistáciovým máslem, posypat pistáciemi a lyo malinami."], "recipe": "full", "note": "Přesný tvar není z captionu jasný", "time_min": 20, "unsure": true, "servings": null}, {"i": 10, "url": "https://www.instagram.com/reel/Dfr5XFeMLaK/", "author": "gtastykitchen", "caption": "die leckersten asiatischen Udon Nudeln 😍😍😍 probiert es unbedingt aus! \n\nHier geht es zum Rezept ->\n\nZutaten für 2 Personen: \n- 400g Udon Nudeln\n- 2 Karotten\n- 1 kleine Zwiebel\n- 1/2 Brokkoli \n- 200g Hähnchenbrust\n- Gewürze: Salz, Pfeffer, Knoblauchpulver und Paprikapulver\n- 1 EL dunkle Sojasoße \n- 1 EL helle Sojasoße \n- 1 EL Austernsoße\n- 1 EL Hoisinsoß \n- Optional: 1 TL brauner Zucker\n- Gehackte Lauchzwiebeln\n- Sesam\n\nZubereitung:\nGemüse und Hähnchenbrust klein schneiden. In einer Pfanne etwas Olivenöl erhitzen und Brokkoli und Karotten kurz anbraten. Danach das Gemüse auf einen Teller legen und die Zwiebeln mit dem Hähnchen einmal durchbraten. Sobald die Hähnchenstücke durch sind, kommen noch Gewürze hinzu und danach könnt ihr mit der Soße beginnen. \n\nHierfür fügt ihr einen EL dunkle und einen EL helle Sojasoße, sowie einen EL Austernsoße und einen EL Hoisinsoße der Soße hinzu. Ich habe noch einen TL braunen Zucker hinzugegeben, damit die Soße etwas süsslicher wird. Die Soße lässt ihr jetzt kurz aufkochen. In der Zwischenzeit könnt ihr die Udon Nudeln zum Kochen bringen. Ich habe vorgekochte Udon-Nudeln verwendet und musste die nur für 4 Minuten im kochenden Wasser kurz kochen lassen. \n\nJetzt könnt ihr die Nudeln und das Gemüse der Soße hinzufügen und alles schon miteinander verrühren. Zum Schluss habe ich noch etwas Sesam und gehackte Lauchzwiebeln als Topping verwendet. \n\nGuten Appetit💕💕", "title": "Udon nudle s kuřecím a zeleninou", "title_orig": "Asiatische Udon Nudeln", "category": "Hlavní jídlo", "tags": ["kuřecí", "nudle", "udon", "asijské", "rychlovka", "zelenina"], "ingredients": ["400 g udon nudlí", "2 mrkve", "1 malá cibule", "1/2 brokolice", "200 g kuřecích prsou", "sůl, pepř, česnekový prášek, paprika", "1 lžíce tmavé sójové omáčky", "1 lžíce světlé sójové omáčky", "1 lžíce ústřicové omáčky", "1 lžíce hoisin omáčky", "1 lžička hnědého cukru (volitelně)", "nasekaná jarní cibulka", "sezam", "olivový olej"], "steps": ["Zeleninu a kuře nakrájet. Na oleji krátce orestovat brokolici a mrkev, dát stranou.", "Orestovat cibuli s kuřetem, ochutit kořením.", "Přidat sójové omáčky, ústřicovou, hoisin a cukr, krátce přivést k varu.", "Udon uvařit (předvařené cca 4 min).", "Nudle a zeleninu vmíchat do omáčky, posypat sezamem a jarní cibulkou."], "recipe": "full", "note": "Na 2 porce", "time_min": null, "unsure": false, "servings": 2}, {"i": 11, "url": "https://www.instagram.com/reel/DfxcToKAmUR/", "author": "jmenujisepeta", "caption": "~ tohle si uložte a vyzkoušejte. Bude to váš oblíbený recept! 😍✔️\n\n🫙 směs na marinádu:\nlžička sušeného česneku\nlžička uzené papriky\nsůl\n1/2 lžičky skořice\n2 lžičky medu\n1 lžíce oleje\n2 lzcie kečupu \n\n[ #recipe #recept #food #lunch #dinner ]", "title": "Marináda na maso (med, uzená paprika)", "title_orig": "", "category": "Omáčka / dip", "tags": ["marináda", "med", "kečup", "uzená paprika"], "ingredients": ["1 lžička sušeného česneku", "1 lžička uzené papriky", "sůl", "1/2 lžičky skořice", "2 lžičky medu", "1 lžíce oleje", "2 lžíce kečupu"], "steps": [], "recipe": "ingredients", "note": "Jen marináda, není uvedeno na jaké maso", "time_min": null, "unsure": true, "servings": null}, {"i": 12, "url": "https://www.instagram.com/reel/DemwZ6wNyOY/", "author": "rui.wencheng", "caption": "Part 23 | What’s Gochujang?\n\nIn this series, I’ll be picking one popular ingredient from Asian Cuisine in each episode, sharing what it’s all about and giving you easy way to cook with it through a simple recipe!\n\n✨ Here’s how you can make Gochujang Chicken:\n\n400g chicken thighs (or chicken breast)\n3 tbsp soy sauce\n2 tbsp shaoxing wine\n2 tbsp cornstarch\n1 tbsp gochujang\n1 tbsp rice vinegar\n1,5 tbsp sugar\n2 tbsp oil\n2-3 garlic cloves\nfor garnish scallion, sesame\n\nEnjoy!\n\n#gochujang #asianingredients", "title": "Gochujang kuře", "title_orig": "Gochujang Chicken", "category": "Hlavní jídlo", "tags": ["kuřecí", "gochujang", "asijské", "korejské", "rychlovka"], "ingredients": ["400 g kuřecích stehen (nebo prsou)", "3 lžíce sójové omáčky", "2 lžíce shaoxing vína", "2 lžíce kukuřičného škrobu", "1 lžíce gochujangu", "1 lžíce rýžového octa", "1,5 lžíce cukru", "2 lžíce oleje", "2–3 stroužky česneku", "Na ozdobu: jarní cibulka, sezam"], "steps": [], "recipe": "ingredients", "note": "Kroky nejsou uvedeny; díl 23 série o asijských surovinách", "time_min": null, "unsure": false, "servings": null}, {"i": 13, "url": "https://www.instagram.com/reel/DfZYaOmt-c1/", "author": "lukishek", "caption": "EASY Gochujang nudle s vepřovým masem 🍜\n\nTěch lehkých asijských receptů není nikdy dost, a tyhle instatně připravené instantní nudle, jsou jedna z mých nejoblíbenějších vychytávek. Sladko pálivá omáčka, která přímo čiší různýma chutěma a přitom hotová za pár minut. \n\nA už tuhle neděli se můžeme potkat na Westfield Days @westfieldcernymost kde budu mít v 15:15 hodin cooking show, kde budu vařit z mystery boxu. Tak se přijď pobavit, pokecat, a třeba se něčemu novému naučit! \n\nPříprava:\nNejdřív opeč mleté vepřové na pánvi a to do té doby než bude krásně do hněda. Potom do něho nalisuj, česnek, nastrouhej zázvor, a přidej gochujang pastu a chvilku to orestuj. Pak tam dolej i sojovku, mirin, sezamový olej, med a nakonec i kuřecí vývar do kterého přihoď i nudle a zhruba 3-5 minut to míchej, dokuď nebudou hotové, a omáčka pekne mazlavá! Na naservírované nudličky přijde uz jen sezam, chilli olej a jarní cibulku.\n\nPotřebuješ:\n500 g mletého vepřového masa\n2 lžičky česneku\n2 lžičky zázvoru\n2 lžíce korejské chilli pasty gochujang\n3 lžíce sójové omáčky\n2 lžíce medu\n2 lžíce mirinu\n1 lžíce sezamového oleje\n500 ml kuřecího vývaru\n250 g instantních nudlí\n\n#cooking #food #gochujang #asiancuisine #czech", "title": "Gochujang nudle s vepřovým masem", "title_orig": "EASY Gochujang nudle s vepřovým masem", "category": "Hlavní jídlo", "tags": ["vepřové", "mleté maso", "nudle", "instantní nudle", "gochujang", "korejské", "asijské", "rychlovka"], "ingredients": ["500 g mletého vepřového masa", "2 lžičky česneku", "2 lžičky zázvoru", "2 lžíce gochujangu", "3 lžíce sójové omáčky", "2 lžíce medu", "2 lžíce mirinu", "1 lžíce sezamového oleje", "500 ml kuřecího vývaru", "250 g instantních nudlí", "Na ozdobu: sezam, chilli olej, jarní cibulka"], "steps": ["Mleté maso opéct do zhnědnutí.", "Přidat česnek, zázvor a gochujang, chvíli orestovat.", "Přilít sójovku, mirin, sezamový olej, med a vývar.", "Vložit nudle a 3–5 minut míchat, až jsou hotové a omáčka je mazlavá.", "Podávat se sezamem, chilli olejem a jarní cibulkou."], "recipe": "full", "note": "Hotové za pár minut", "time_min": null, "unsure": false, "servings": null}, {"i": 14, "url": "https://www.instagram.com/reel/DcXTxs6O69n/", "author": "recipeincaption", "caption": "Caramelized Onion and Garlic Spaghetti 🔥\n\nComment “Recipe” and I’ll send you the full recipe card for free!!\n\nFor ALL of you asking about the app I made, search “Osta” on the App Store or Google Play 🫶😁\n\nMinimal effort, max comfort. Sweet, savory, a little spicy... this one hits every note.\n\nTip: Best served with with chicken, shrimp, or tofu 🫡 \n\nIngredients:\n\n-1 large onion, thinly sliced\n-4 garlic cloves, minced\n-2 tbsp chili crisp \n-1 cup of cream or coconut milk, room temperature\n-1 tbsp soy sauce, optional\n-1/2 cup fresh Parmesan cheese, grated\n-8 oz (225g) pasta of your choice\n-2 tbsp butter\n-1 tbsp olive oil\n-Seasonings (1 tsp each): paprika, garlic powder, salt, pepper, italian seasoning\n\n1. Slice your onion like it owes you money, mince that garlic (use fresh please), and measure out all your seasoning. Bring a cup of cream or coconut milk to room temperature.\n2. Heat 2 tbsp butter + 1 tbsp olive oil in a large skillet over medium. Add in the onions and let them vibe for 15–20 minutes, stirring occasionally, until golden and jammy. If they start sticking, hit ‘em with a splash of water.\n3. While your onions are caramelizing like sweet little angels, boil a pot of salted water and cook the pasta until al dente. Drain, but don’t forget to save some of that pasta water — it’s liquid gold.\n4. When the onions are deeply golden, stir in your minced garlic and all the seasonings. Let it all bloom for a minute, then add the chili crisp and saute for a minute. Pour in your cream (or coconut milk). Let it simmer and get cozy for a few minutes then add the grated Parmesan cheese. \n5. Add your pasta to the sauce and toss to coat. Use that reserved pasta water to loosen things up if it’s too thick — you’re going for silky, not sticky.\n6. Serve hot with an extra spoon of chili crisp on top for a spicy kick and maybe a sprinkle of fresh parsley if you’re feelin’ fancy.", "title": "Špagety s karamelizovanou cibulí a česnekem", "title_orig": "Caramelized Onion and Garlic Spaghetti", "category": "Hlavní jídlo", "tags": ["těstoviny", "špagety", "cibule", "česnek", "smetana", "parmazán", "vegetariánské", "rychlovka"], "ingredients": ["1 velká cibule, tence nakrájená", "4 stroužky česneku", "2 lžíce chilli crisp", "240 ml smetany nebo kokosového mléka, pokojové teploty", "1 lžíce sójové omáčky (volitelně)", "50 g strouhaného parmazánu", "225 g těstovin", "2 lžíce másla", "1 lžíce olivového oleje", "po 1 lžičce: paprika, česnekový prášek, sůl, pepř, italské koření", "na ozdobu: chilli crisp, petrželka"], "steps": ["Na másle s olejem 15–20 minut smažit cibuli dozlatova, případně podlít vodou.", "Uvařit těstoviny al dente, odložit trochu vody z vaření.", "Do cibule přidat česnek a koření, minutu restovat, přidat chilli crisp a zalít smetanou.", "Povařit pár minut, přidat parmazán.", "Vmíchat těstoviny, případně zředit vodou z vaření; podávat s chilli crisp a petrželkou."], "recipe": "full", "note": "Dobré s kuřetem, krevetami nebo tofu; autor nabízí kartu receptu po komentáři", "time_min": null, "unsure": false, "servings": null}, {"i": 15, "url": "https://www.instagram.com/reel/DepT28VSS1-/", "author": "elena.lohse", "caption": "honey parmesan rigatoni for part 15 of our Sunday Supper Series 🍯 it’s
